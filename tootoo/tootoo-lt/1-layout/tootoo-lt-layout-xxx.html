<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="revised" content="2026-04-07 12:00">
  <title>TooToo LT</title>
  <style>
    :root {
      --primary-bg: #f3f4f6;
      --secondary-bg: #ffffff;
      --text-color: #1f2937;
      --border-color: #d1d5db;
      --highlight-color: #3b82f6;
      --hover-bg: #e5e7eb;
      --font-family: system-ui, -apple-system, sans-serif;
      --sidebar-width: 300px;
      --font-size: 16px;
    }

    body.dark-mode {
      --primary-bg: #1f2937;
      --secondary-bg: #111827;
      --text-color: #f9fafb;
      --border-color: #374151;
      --highlight-color: #60a5fa;
      --hover-bg: #374151;
    }

    html {
      font-size: var(--font-size);
    }

    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow-x: hidden;
      font-family: var(--font-family);
      color: var(--text-color);
      background-color: var(--primary-bg);
      user-select: auto;
    }

    header {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
      background-color: var(--primary-bg);
      border-bottom: 1px solid var(--border-color);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
      z-index: 10;
      padding: 0.5rem;
    }

    #headerGitHub {
      color: currentColor;
      text-decoration: none;
      display: flex;
      align-items: center;
    }

    #headerTitle {
      font-weight: bold;
      font-size: 1.1rem;
      cursor: pointer;
      text-decoration: none;
      color: var(--text-color);
    }

    button {
      padding: 0.4rem 0.75rem;
      background-color: var(--highlight-color);
      color: #ffffff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.9rem;
      transition: opacity 0.2s, transform 0.1s;
    }

    button:hover {
      opacity: 0.88;
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    .header-btn {
      background-color: var(--secondary-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
    }

    #btnDarkMode {
      margin-left: auto;
    }

    .rate-limit-badge {
      display: none;
      font-size: 0.8rem;
      padding: 0.2rem 0.45rem;
      border: 1px solid var(--border-color);
      border-radius: 999px;
      background-color: var(--primary-bg);
      opacity: 0.85;
      white-space: nowrap;
    }

    main {
      display: flex;
      flex-direction: row;
      flex: 1;
      overflow: hidden;
    }

    .sidebar {
      width: var(--sidebar-width);
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background-color: var(--primary-bg);
      padding: 0;
      overflow: hidden;
    }

    .resizer {
      width: 8px;
      background-color: var(--highlight-color);
      opacity: 0.7;
      cursor: col-resize;
      touch-action: none;
      transition: opacity 0.2s;
    }

    .resizer:hover,
    .resizer.dragging {
      opacity: 1;
    }

    .content-area {
      flex: 1;
      min-width: 0;
      padding: 0;
      overflow-y: auto;
      background-color: var(--secondary-bg);
      position: relative;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 0.5rem;
      border-bottom: 1px solid var(--border-color);
      background-color: var(--primary-bg);
      width: 100%;
      box-sizing: border-box;
    }

    .panel-header h3 {
      margin: 0;
      font-size: 0.95rem;
      font-weight: 600;
    }

    .file-header {
      position: sticky;
      top: 0;
      z-index: 5;
      padding: 0.5rem 1rem;
    }

    #filterInput {
      margin: 0.4rem 0.5rem 0 0.5rem;
      width: calc(100% - 1rem);
      box-sizing: border-box;
      padding: 0.3rem 0.5rem;
      font-size: 0.85rem;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      background-color: #ffffff;
      color: var(--text-color);
      outline: none;
      font-family: inherit;
    }

    body.dark-mode #filterInput {
      background-color: var(--secondary-bg);
    }

    #filterInput:focus {
      border-color: var(--highlight-color);
    }

    #treeList {
      padding: 0 0.5rem;
      flex: 1;
      overflow-y: auto;
      margin-top: 0.5rem;
    }

    #contentBody {
      padding: 0 1rem 1rem 1rem;
      background-color: var(--secondary-bg);
    }

    .back-to-top {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      z-index: 20;
      background-color: var(--highlight-color);
      color: #ffffff;
      border-radius: 50%;
      width: 2.5rem;
      height: 2.5rem;
      font-size: 1.2rem;
      display: none;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
      border: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    @media (max-width: 768px) {
      .sidebar {
        width: 25% !important;
      }

      .resizer {
        width: 4px;
      }

      .file-header {
        position: relative;
      }
    }
  </style>
</head>

<body>

  <header>
    <a id="headerGitHub" href="#" title="View on GitHub">
      <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor">
        <path
          d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z">
        </path>
      </svg>
    </a>
    <a id="headerTitle" title="Reload" href="">TooToo LT</a>
    <button id="btnDarkMode" class="header-btn" title="Toggle Dark Mode">🌙</button>
    <button id="btnFontDec" class="header-btn" title="Decrease Font Size">A−</button>
    <button id="btnFontInc" class="header-btn" title="Increase Font Size">A+</button>
    <button id="btnToken" class="header-btn" title="Set GitHub Token">⚙️ Token</button>
    <div id="rateLimitBadge" class="rate-limit-badge" aria-live="polite" title="API Rate Limit"></div>
  </header>

  <main>
    <div class="sidebar" id="sidebar">
      <div class="panel-header">
        <h3 title="Last updated: 2026-04-07 12:00">Files</h3>
        <button id="btnExpandAll" style="display: none;" title="Expand All Folders">Expand All</button>
      </div>
      <input type="text" id="filterInput" placeholder="Filter files…" title="Filter files by name">
      <div id="treeList"></div>
    </div>

    <div class="resizer" id="resizer" title="Drag to resize sidebar"></div>

    <div class="content-area" id="contentArea">
      <div class="panel-header file-header">
        <h3 title="Current File Content">Content</h3>
      </div>
      <div id="contentBody">
        <p>Select a file from the sidebar.</p>
      </div>
    </div>

    <button id="btnBackToTop" class="back-to-top" aria-label="Back to top" title="Scroll to Top">↑</button>
  </main>

  <script>
    const escapeHTML = ( str ) => {
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
      return String( str ).replace( /[&<>"']/g, ( c ) => map[ c ] );
    };

    const CONFIG = {
      owner: '',
      repo: '',
      branch: '',
    };

    const state = {
      owner: '',
      repo: '',
      branch: '',
      tree: null,
      currentFilePath: '',
    };

    const storageKey = ( suffix ) => \`tootoo-lt:\${location.pathname}:\${suffix}\`;

    const updateHeaderFromConfig = () => {
      const titleText = \`\${state.owner} / \${state.repo}\`;
      document.title = titleText;

      const headerTitleElement = document.getElementById('headerTitle');
      if (headerTitleElement) {
        headerTitleElement.textContent = titleText;
      }

      const headerGitHubElement = document.getElementById('headerGitHub');
      if (headerGitHubElement) {
        headerGitHubElement.href = \`https://github.com/\${state.owner}/\${state.repo}\`;
      }
    };

    const fetchGitConfig = async (path) => {
      try {
        const response = await fetch(\`\${path}.git/config\`);
        if (!response.ok) return null;
        const text = await response.text();
        const match = text.match(/github\\.com[:/](.+?)\\/(.+?)(\\.git)?$/m);
        if (match) {
          return { owner: match[1], repo: match[2].replace(/\\.git$/, '') };
        }
      } catch (e) {
        // ignore
      }
      return null;
    };

    const showInlineForm = () => {
      return new Promise((resolve) => {
        const contentBody = document.getElementById('contentBody');
        contentBody.innerHTML = \`
          <div style="max-width: 400px; margin: 2rem auto; padding: 1.5rem; background: var(--primary-bg); border-radius: 8px; border: 1px solid var(--border-color);">
            <h2 style="margin-top: 0;">Setup Repository</h2>
            <form id="repoForm" style="display: flex; flex-direction: column; gap: 1rem;">
              <div>
                <label style="display: block; margin-bottom: 0.5rem;">Owner / Organization</label>
                <input type="text" id="inputOwner" required style="width: 100%; box-sizing: border-box; padding: 0.5rem; border: 1px solid var(--border-color); border-radius: 4px; background: var(--secondary-bg); color: var(--text-color);">
              </div>
              <div>
                <label style="display: block; margin-bottom: 0.5rem;">Repository Name</label>
                <input type="text" id="inputRepo" required style="width: 100%; box-sizing: border-box; padding: 0.5rem; border: 1px solid var(--border-color); border-radius: 4px; background: var(--secondary-bg); color: var(--text-color);">
              </div>
              <button type="submit" title="Save Repository">Save</button>
            </form>
          </div>
        \`;

        document.getElementById('repoForm').addEventListener('submit', (e) => {
          e.preventDefault();
          const owner = document.getElementById('inputOwner').value.trim();
          const repo = document.getElementById('inputRepo').value.trim();
          localStorage.setItem(storageKey('repo'), JSON.stringify({ owner, repo }));
          resolve({ owner, repo });
        });
      });
    };

    const detectRepo = async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const urlOwner = urlParams.get('owner');
      const urlRepo = urlParams.get('repo');
      const urlBranch = urlParams.get('branch');

      if (urlOwner && urlRepo) {
        CONFIG.owner = urlOwner;
        CONFIG.repo = urlRepo;
        if (urlBranch) CONFIG.branch = urlBranch;
        return;
      }

      if (CONFIG.owner && CONFIG.repo) {
        return;
      }

      const cached = localStorage.getItem(storageKey('repo'));
      if (cached) {
        try {
          const parsed = JSON.parse(cached);
          if (parsed.owner && parsed.repo) {
            CONFIG.owner = parsed.owner;
            CONFIG.repo = parsed.repo;
            return;
          }
        } catch (e) {
          // invalid cache
        }
      }

      const paths = ['', '../', '../../', '../../../', '../../../../'];
      for (const path of paths) {
        const result = await fetchGitConfig(path);
        if (result) {
          CONFIG.owner = result.owner;
          CONFIG.repo = result.repo;
          localStorage.setItem(storageKey('repo'), JSON.stringify(result));
          return;
        }
      }

      const manualResult = await showInlineForm();
      CONFIG.owner = manualResult.owner;
      CONFIG.repo = manualResult.repo;
    };

    const initTheme = () => {
      const btnDarkMode = document.getElementById('btnDarkMode');
      const isDark = localStorage.getItem(storageKey('darkMode')) === 'true';

      const updateTheme = (dark) => {
        if (dark) {
          document.body.classList.add('dark-mode');
          btnDarkMode.textContent = '☀️';
        } else {
          document.body.classList.remove('dark-mode');
          btnDarkMode.textContent = '🌙';
        }
      };

      updateTheme(isDark);

      btnDarkMode.addEventListener('click', () => {
        const willBeDark = !document.body.classList.contains('dark-mode');
        localStorage.setItem(storageKey('darkMode'), willBeDark);
        updateTheme(willBeDark);
      });
    };

    const initFontSize = () => {
      const htmlStyle = document.documentElement.style;
      let currentSize = parseInt(localStorage.getItem(storageKey('fontSize')), 10) || 16;

      const applySize = (size) => {
        htmlStyle.setProperty('--font-size', \`\${size}px\`);
        localStorage.setItem(storageKey('fontSize'), size);
      };

      applySize(currentSize);

      document.getElementById('btnFontDec').addEventListener('click', () => {
        currentSize = Math.max(10, currentSize - 2);
        applySize(currentSize);
      });

      document.getElementById('btnFontInc').addEventListener('click', () => {
        currentSize = Math.min(28, currentSize + 2);
        applySize(currentSize);
      });
    };

    const initResizer = () => {
      const resizer = document.getElementById('resizer');
      const sidebar = document.getElementById('sidebar');

      let savedWidth = localStorage.getItem(storageKey('sidebarWidth'));
      if (savedWidth) {
        sidebar.style.setProperty('--sidebar-width', \`\${savedWidth}px\`);
      }

      let isDragging = false;

      resizer.addEventListener('pointerdown', (e) => {
        isDragging = true;
        resizer.classList.add('dragging');
        resizer.setPointerCapture(e.pointerId);
        document.body.style.userSelect = 'none';
        document.body.style.cursor = 'col-resize';
      });

      resizer.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        const newWidth = Math.max(150, Math.min(e.clientX, window.innerWidth - 100));
        sidebar.style.setProperty('--sidebar-width', \`\${newWidth}px\`);
      });

      resizer.addEventListener('pointerup', (e) => {
        if (!isDragging) return;
        isDragging = false;
        resizer.classList.remove('dragging');
        resizer.releasePointerCapture(e.pointerId);
        document.body.style.userSelect = '';
        document.body.style.cursor = '';
        const finalWidth = sidebar.style.getPropertyValue('--sidebar-width').replace('px', '');
        localStorage.setItem(storageKey('sidebarWidth'), finalWidth);
      });
    };

    const initToken = () => {
      document.getElementById('btnToken').addEventListener('click', () => {
        const currentToken = localStorage.getItem(storageKey('githubToken')) || '';
        const newToken = prompt('Enter your GitHub Personal Access Token (PAT):', currentToken);
        if (newToken !== null) {
          localStorage.setItem(storageKey('githubToken'), newToken.trim());
          location.reload();
        }
      });
    };

    const initBackToTop = () => {
      const contentArea = document.getElementById('contentArea');
      const btnBackToTop = document.getElementById('btnBackToTop');

      contentArea.addEventListener('scroll', () => {
        if (contentArea.scrollTop > 400) {
          btnBackToTop.style.display = 'flex';
        } else {
          btnBackToTop.style.display = 'none';
        }
      });

      btnBackToTop.addEventListener('click', () => {
        contentArea.scrollTo({ top: 0, behavior: 'smooth' });
      });
    };

    const init = async () => {
      initResizer();
      initTheme();
      initFontSize();
      initToken();
      initBackToTop();

      await detectRepo();

      state.owner = CONFIG.owner;
      state.repo = CONFIG.repo;
      state.branch = CONFIG.branch;

      updateHeaderFromConfig();

      const contentBody = document.getElementById('contentBody');
      if (state.owner && state.repo) {
        contentBody.innerHTML = \`<p>Ready &mdash; repository detected: <strong>\${escapeHTML(state.owner)} / \${escapeHTML(state.repo)}</strong></p>\`;
      }
    };

    init();
  </script>
</body>

</html>
