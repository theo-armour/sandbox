<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="revised" content="2026-04-07 16:45">
  <title>TooToo LT</title>
  <style>
    :root {
      --primary-bg: #f3f4f6;
      --secondary-bg: #ffffff;
      --text-color: #1f2937;
      --border-color: #d1d5db;
      --highlight-color: #2563eb;
      --hover-bg: #e5e7eb;
      --font-family: system-ui, -apple-system, sans-serif;
      --sidebar-width: 300px;
      --font-size: 16px;
    }

    body.dark-mode {
      --primary-bg: #1f2937;
      --secondary-bg: #111827;
      --text-color: #f3f4f6;
      --border-color: #374151;
      --highlight-color: #3b82f6;
      --hover-bg: #374151;
    }

    html {
      font-size: var(--font-size);
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      margin: 0;
      overflow-x: hidden;
      font-family: var(--font-family);
      color: var(--text-color);
      background-color: var(--primary-bg);
    }

    header {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      background-color: var(--primary-bg);
      border-bottom: 1px solid var(--border-color);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
      z-index: 10;
      align-items: center;
    }

    #headerGitHub {
      color: currentColor;
      text-decoration: none;
      display: flex;
      align-items: center;
    }

    #headerTitle {
      font-weight: bold;
      font-size: 1.1rem;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
    }

    .header-btn {
      background-color: var(--secondary-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 0.4rem 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    .header-btn:hover {
      opacity: 0.88;
      transform: translateY(-1px);
    }

    .header-btn:active {
      transform: translateY(0);
    }

    .dark-mode-btn {
      margin-left: auto;
    }

    .rate-limit-badge {
      display: none;
      font-size: 0.8rem;
      padding: 0.2rem 0.45rem;
      border: 1px solid var(--border-color);
      border-radius: 999px;
      background-color: var(--primary-bg);
      opacity: 0.85;
      white-space: nowrap;
    }

    main {
      display: flex;
      flex: 1;
      overflow: hidden;
      flex-direction: row;
    }

    .sidebar {
      width: var(--sidebar-width);
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background-color: var(--primary-bg);
      padding: 0;
      overflow: hidden;
    }

    .resizer {
      width: 8px;
      background-color: var(--highlight-color);
      opacity: 0.7;
      cursor: col-resize;
      touch-action: none;
      transition: opacity 0.2s;
    }

    .resizer:hover,
    .resizer.dragging {
      opacity: 1;
    }

    .content-area {
      flex: 1;
      min-width: 0;
      padding: 0;
      overflow-y: auto;
      background-color: var(--secondary-bg);
      position: relative;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 0.5rem;
      border-bottom: 1px solid var(--border-color);
      background-color: var(--primary-bg);
    }

    .panel-header h3 {
      margin: 0;
      font-size: 0.95rem;
    }

    .file-header {
      position: sticky;
      top: 0;
      z-index: 5;
      padding: 0.5rem 1rem;
    }

    #treeList {
      padding: 0 0.5rem;
      flex: 1;
      overflow-y: auto;
    }

    #contentBody {
      padding: 0 1rem 1rem 1rem;
      background-color: var(--secondary-bg);
    }

    input[type="text"] {
      margin: 0.4rem 0.5rem 0 0.5rem;
      width: calc(100% - 1rem);
      box-sizing: border-box;
      padding: 0.3rem 0.5rem;
      font-size: 0.85rem;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      background-color: var(--secondary-bg);
      color: var(--text-color);
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--highlight-color);
    }

    button.primary,
    button.secondary {
      background-color: var(--highlight-color);
      color: #ffffff;
      border: none;
      padding: 0.4rem 0.75rem;
      border-radius: 6px;
      cursor: pointer;
    }

    button.primary:hover,
    button.secondary:hover {
      opacity: 0.88;
      transform: translateY(-1px);
    }

    button.primary:active,
    button.secondary:active {
      transform: translateY(0);
    }

    .back-to-top {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      z-index: 20;
      background-color: var(--highlight-color);
      color: #ffffff;
      border: none;
      border-radius: 50%;
      width: 2.5rem;
      height: 2.5rem;
      font-size: 1.2rem;
      display: none;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
      cursor: pointer;
      align-items: center;
      justify-content: center;
    }

    @media (max-width: 768px) {
      .sidebar {
        width: 25% !important;
      }

      .resizer {
        width: 4px;
      }

      .file-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.5rem;
      }
    }

    /* Treeview styles */
    .tree-folder {
      display: flex;
      align-items: center;
      padding: 0.2rem 0.4rem;
      cursor: pointer;
      border-radius: 4px;
      font-family: monospace;
      font-size: 0.85rem;
      user-select: none;
      list-style: none;
    }

    .tree-folder::-webkit-details-marker {
      display: none;
    }

    .tree-folder:hover {
      background: var(--hover-bg);
    }

    .tree-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.2rem 0.4rem 0.2rem 1.2rem;
      cursor: pointer;
      border-radius: 4px;
      font-family: monospace;
      font-size: 0.85rem;
    }

    .tree-item:hover {
      background: var(--hover-bg);
    }

    .tree-item.active {
      background: var(--highlight-color);
      color: #fff;
    }

    .tree-item-size {
      font-size: 0.75rem;
      opacity: 0.6;
      margin-left: 0.5rem;
      white-space: nowrap;
    }

    details details {
      padding-left: 0.8rem;
    }

    details {
      padding-left: 0;
    }
  </style>
</head>

<body>

  <header>
    <a id="headerGitHub" href="#" title="View on GitHub">
      <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor">
        <path
          d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z">
        </path>
      </svg>
    </a>
    <a id="headerTitle" href="#" title="Reload">TooToo LT</a>
    <button id="btnDarkMode" class="header-btn dark-mode-btn" title="Toggle Dark Mode">🌙</button>
    <button id="btnFontDec" class="header-btn" title="Decrease Font Size">A−</button>
    <button id="btnFontInc" class="header-btn" title="Increase Font Size">A+</button>
    <button id="btnToken" class="header-btn" title="Set GitHub Personal Access Token">⚙️ Token</button>
    <div id="rateLimitBadge" class="rate-limit-badge" aria-live="polite" title="API Rate Limit"></div>
  </header>

  <main>
    <div class="sidebar">
      <div class="panel-header" title="Last updated: 2026-04-07 16:45">
        <h3>Files</h3>
        <button id="btnExpandAll" class="secondary" style="display: none;" title="Expand All Folders">Expand
          All</button>
      </div>
      <input type="text" id="inpFilter" placeholder="Filter files…" title="Filter files by name">
      <div id="treeList">
      </div>
    </div>

    <div class="resizer" id="resizer" title="Drag to Resize Sidebar"></div>

    <div class="content-area" id="contentArea">
      <div class="panel-header file-header">
        <h3 id="contentHeaderTitle">Content</h3>
      </div>
      <div id="contentBody">
        <p>Awaiting repository detection...</p>
      </div>

      <button id="btnBackToTop" class="back-to-top" aria-label="Back to top" title="Back to Top">↑</button>
    </div>
  </main>

  <script>
    const CONFIG = {
      owner: 'theo-armour',
      repo: 'sandbox',
      branch: '',
    };

    const state = {
      owner: '',
      repo: '',
      branch: '',
      tree: null,
      currentFilePath: '',
    };

    let currentAbortController = null;

    const escapeHTML = ( str ) => {
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
      return String( str ).replace( /[&<>"']/g, ( c ) => map[ c ] );
    };

    const storageKey = ( suffix ) => `tootoo-lt:${ location.pathname }:${ suffix }`;

    const getToken = () => localStorage.getItem( storageKey( 'githubToken' ) ) || '';

    const apiHeaders = () => {
      const headers = { Accept: 'application/vnd.github+json' };
      const token = getToken();
      if ( token ) headers.Authorization = `token ${ token }`;
      return headers;
    };

    const updateRateLimit = ( response ) => {
      const remaining = response.headers.get( 'X-RateLimit-Remaining' );
      const limit = response.headers.get( 'X-RateLimit-Limit' );
      if ( remaining !== null && limit !== null ) {
        const badge = document.getElementById( 'rateLimitBadge' );
        badge.style.display = 'inline';
        badge.textContent = `${ remaining }/${ limit }`;
      }
    };

    const updateHeaderFromConfig = () => {
      const titleStr = `${ state.owner } / ${ state.repo }`;
      document.title = titleStr;
      const headerTitle = document.getElementById( 'headerTitle' );
      if ( headerTitle ) headerTitle.textContent = titleStr;
      const headerGitHub = document.getElementById( 'headerGitHub' );
      if ( headerGitHub ) headerGitHub.href = `https://github.com/${ state.owner }/${ state.repo }`;
    };

    const detectRepo = async () => {
      const params = new URLSearchParams( location.search );
      if ( params.get( 'owner' ) ) CONFIG.owner = params.get( 'owner' );
      if ( params.get( 'repo' ) ) CONFIG.repo = params.get( 'repo' );
      if ( params.get( 'branch' ) ) CONFIG.branch = params.get( 'branch' );

      if ( CONFIG.owner && CONFIG.repo ) return;

      const cachedStr = localStorage.getItem( storageKey( 'repo' ) );
      if ( cachedStr ) {
        try {
          const cached = JSON.parse( cachedStr );
          if ( cached.owner && cached.repo ) {
            CONFIG.owner = cached.owner;
            CONFIG.repo = cached.repo;
            return;
          }
        } catch ( e ) { }
      }

      const paths = [ '', '../', '../../', '../../../', '../../../../' ];
      for ( const p of paths ) {
        try {
          const res = await fetch( `${ p }.git/config` );
          if ( res.ok ) {
            const text = await res.text();
            const match = text.match( /github\.com[:/](.+?)\/(.+?)(\.git)?$/m );
            if ( match ) {
              CONFIG.owner = match[ 1 ];
              CONFIG.repo = match[ 2 ].replace( /\.git$/, '' );
              localStorage.setItem( storageKey( 'repo' ), JSON.stringify( { owner: CONFIG.owner, repo: CONFIG.repo } ) );
              return;
            }
          }
        } catch ( e ) { }
      }

      return new Promise( ( resolve ) => {
        const cb = document.getElementById( 'contentBody' );
        cb.innerHTML = `
          <h2>Repository Detection Failed</h2>
          <p>Please provide the GitHub repository details manually:</p>
          <div style="display: flex; flex-direction: column; gap: 0.5rem; max-width: 300px;">
            <input type="text" id="inpOwner" placeholder="Owner" title="GitHub Owner" style="padding: 0.4rem; font-size: 1rem;">
            <input type="text" id="inpRepo" placeholder="Repository" title="GitHub Repository" style="padding: 0.4rem; font-size: 1rem;">
            <button id="btnSetRepo" class="primary" title="Set Repository Details">Set Repository</button>
          </div>
        `;
        document.getElementById( 'btnSetRepo' ).addEventListener( 'click', () => {
          const own = document.getElementById( 'inpOwner' ).value.trim();
          const rep = document.getElementById( 'inpRepo' ).value.trim();
          if ( own && rep ) {
            CONFIG.owner = own;
            CONFIG.repo = rep;
            localStorage.setItem( storageKey( 'repo' ), JSON.stringify( { owner: CONFIG.owner, repo: CONFIG.repo } ) );
            resolve();
          }
        } );
      } );
    };

    const initAppearance = () => {
      const isDark = localStorage.getItem( storageKey( 'darkMode' ) ) === 'true';
      if ( isDark ) {
        document.body.classList.add( 'dark-mode' );
        document.getElementById( 'btnDarkMode' ).textContent = '☀️';
      }
      const savedSz = localStorage.getItem( storageKey( 'fontSize' ) );
      if ( savedSz ) document.documentElement.style.setProperty( '--font-size', savedSz );
      const savedW = localStorage.getItem( storageKey( 'sidebarWidth' ) );
      if ( savedW ) document.documentElement.style.setProperty( '--sidebar-width', savedW );
    };

    const setupListeners = () => {
      const btnDark = document.getElementById( 'btnDarkMode' );
      btnDark.addEventListener( 'click', () => {
        const isDark = document.body.classList.toggle( 'dark-mode' );
        btnDark.textContent = isDark ? '☀️' : '🌙';
        localStorage.setItem( storageKey( 'darkMode' ), isDark );
      } );

      const getFontSize = () => parseInt( window.getComputedStyle( document.documentElement ).getPropertyValue( '--font-size' ) || '16', 10 );

      document.getElementById( 'btnFontInc' ).addEventListener( 'click', () => {
        const sz = Math.min( getFontSize() + 2, 28 );
        document.documentElement.style.setProperty( '--font-size', sz + 'px' );
        localStorage.setItem( storageKey( 'fontSize' ), sz + 'px' );
      } );

      document.getElementById( 'btnFontDec' ).addEventListener( 'click', () => {
        const sz = Math.max( getFontSize() - 2, 10 );
        document.documentElement.style.setProperty( '--font-size', sz + 'px' );
        localStorage.setItem( storageKey( 'fontSize' ), sz + 'px' );
      } );

      document.getElementById( 'btnToken' ).addEventListener( 'click', () => {
        const currentToken = localStorage.getItem( storageKey( 'githubToken' ) ) || '';
        const token = prompt( 'Enter GitHub Personal Access Token (PAT):', currentToken );
        if ( token !== null ) {
          localStorage.setItem( storageKey( 'githubToken' ), token );
          location.reload();
        }
      } );

      const resizer = document.getElementById( 'resizer' );
      resizer.addEventListener( 'pointerdown', ( e ) => {
        resizer.setPointerCapture( e.pointerId );
        resizer.classList.add( 'dragging' );
        document.body.style.userSelect = 'none';
        document.body.style.cursor = 'col-resize';
      } );

      resizer.addEventListener( 'pointermove', ( e ) => {
        if ( !resizer.hasPointerCapture( e.pointerId ) ) return;
        const newWidth = Math.max( 100, Math.min( e.clientX, window.innerWidth - 100 ) );
        document.documentElement.style.setProperty( '--sidebar-width', newWidth + 'px' );
      } );

      resizer.addEventListener( 'pointerup', ( e ) => {
        resizer.releasePointerCapture( e.pointerId );
        resizer.classList.remove( 'dragging' );
        document.body.style.userSelect = '';
        document.body.style.cursor = '';
        localStorage.setItem( storageKey( 'sidebarWidth' ), window.getComputedStyle( document.documentElement ).getPropertyValue( '--sidebar-width' ) );
      } );

      const ca = document.getElementById( 'contentArea' );
      const b2t = document.getElementById( 'btnBackToTop' );
      ca.addEventListener( 'scroll', () => {
        b2t.style.display = ca.scrollTop > 400 ? 'flex' : 'none';
      } );

      b2t.addEventListener( 'click', () => {
        ca.scrollTo( { top: 0, behavior: 'smooth' } );
      } );

      document.getElementById( 'headerTitle' ).addEventListener( 'click', ( e ) => {
        e.preventDefault();
        location.reload();
      } );
    };

    /* ── File icon helper ── */
    const getFileIcon = ( name ) => {
      const ext = ( name.includes( '.' ) ? '.' + name.split( '.' ).pop() : '' ).toLowerCase();
      const iconMap = {
        '.md': '📝',
        '.js': '🟨', '.mjs': '🟨', '.cjs': '🟨',
        '.ts': '🟦', '.tsx': '🟦',
        '.py': '🐍',
        '.html': '🌐', '.htm': '🌐',
        '.css': '🎨', '.scss': '🎨', '.less': '🎨',
        '.png': '🖼️', '.jpg': '🖼️', '.jpeg': '🖼️', '.gif': '🖼️', '.webp': '🖼️', '.svg': '🖼️', '.ico': '🖼️',
        '.mp3': '🎵', '.wav': '🎵', '.ogg': '🎵',
        '.mp4': '🎬', '.webm': '🎬',
        '.pdf': '📕',
        '.xlsx': '📊', '.xls': '📊', '.csv': '📊', '.ods': '📊',
        '.yaml': '⚙️', '.yml': '⚙️', '.toml': '⚙️',
        '.zip': '📦', '.tar': '📦', '.gz': '📦', '.7z': '📦',
        '.json': '{ }',
      };
      return iconMap[ ext ] ?? '📄';
    };

    /* ── File size formatting ── */
    const formatSize = ( bytes ) => {
      if ( bytes == null ) return '';
      if ( bytes < 1024 ) return `${ bytes } B`;
      if ( bytes < 1024 * 1024 ) return `${ ( bytes / 1024 ).toFixed( 1 ) } KB`;
      return `${ ( bytes / ( 1024 * 1024 ) ).toFixed( 1 ) } MB`;
    };

    /* ── Build nested tree from flat array ── */
    const buildNestedTree = ( flatTree ) => {
      const root = { children: {} };

      for ( const item of flatTree ) {
        const parts = item.path.split( '/' );
        // Skip items whose any path segment starts with '.'
        if ( parts.some( ( p ) => p.startsWith( '.' ) ) ) continue;

        let current = root;
        for ( let i = 0; i < parts.length; i++ ) {
          const part = parts[ i ];
          if ( !current.children[ part ] ) {
            current.children[ part ] = { children: {}, type: 'tree', path: parts.slice( 0, i + 1 ).join( '/' ) };
          }
          if ( i === parts.length - 1 ) {
            current.children[ part ].type = item.type;
            current.children[ part ].size = item.size;
            current.children[ part ].path = item.path;
          }
          current = current.children[ part ];
        }
      }

      return root;
    };

    /* ── Sort children: folders first, then alphabetical ── */
    const sortedEntries = ( children ) =>
      Object.entries( children ).sort( ( [ aName, aNode ], [ bName, bNode ] ) => {
        const aIsFolder = Object.keys( aNode.children ).length > 0 || aNode.type === 'tree';
        const bIsFolder = Object.keys( bNode.children ).length > 0 || bNode.type === 'tree';
        if ( aIsFolder !== bIsFolder ) return aIsFolder ? -1 : 1;
        return aName.localeCompare( bName, undefined, { sensitivity: 'base' } );
      } );

    /* ── Render a single node to HTML ── */
    const renderNode = ( name, node ) => {
      const isFolder = Object.keys( node.children ).length > 0 || ( node.type === 'tree' && node.type !== 'blob' );
      const escapedPath = escapeHTML( node.path );
      const escapedName = escapeHTML( name );

      if ( isFolder ) {
        const childrenHTML = sortedEntries( node.children ).map( ( [ n, c ] ) => renderNode( n, c ) ).join( '' );
        return `<details data-folder-path="${ escapedPath }"><summary class="tree-folder" tabindex="0" title="${ escapedPath }">📁 <span class="folder-name">${ escapedName }</span></summary>${ childrenHTML }</details>`;
      }

      const icon = getFileIcon( name );
      const size = formatSize( node.size );
      const isReadme = /^readme/i.test( name );
      const nameHTML = isReadme ? `<strong>${ icon } ${ escapedName }</strong>` : `${ icon } ${ escapedName }`;

      return `<div class="tree-item" tabindex="0" data-action="select-file" data-path="${ escapedPath }" title="${ escapedPath }"><span class="tree-item-name">${ nameHTML }</span><span class="tree-item-size">${ escapeHTML( size ) }</span></div>`;
    };

    /* ── Render tree with batched rendering ── */
    const renderTree = ( treeArray ) => {
      const treeList = document.getElementById( 'treeList' );
      treeList.innerHTML = '';

      const nested = buildNestedTree( treeArray );
      const rootEntries = sortedEntries( nested.children );
      const batchSize = 120;
      let rendered = 0;
      const total = rootEntries.length;

      const status = document.createElement( 'div' );
      status.id = 'treeRenderStatus';
      status.style.cssText = 'font-size: 0.85rem; opacity: 0.7; padding: 0.3rem 0.5rem;';
      treeList.appendChild( status );

      const renderBatch = () => {
        const end = Math.min( rendered + batchSize, total );
        let html = '';
        for ( let i = rendered; i < end; i++ ) {
          const [ name, node ] = rootEntries[ i ];
          html += renderNode( name, node );
        }
        treeList.insertAdjacentHTML( 'beforeend', html );
        rendered = end;

        if ( rendered < total ) {
          status.textContent = `${ Math.round( ( rendered / total ) * 100 ) }% rendered…`;
          setTimeout( renderBatch, 0 );
        } else {
          status.remove();
          onTreeRenderComplete();
        }
      };

      if ( total === 0 ) {
        status.remove();
        return;
      }

      renderBatch();
    };

    /* ── After tree render completes ── */
    const onTreeRenderComplete = () => {
      // Show Expand All button
      document.getElementById( 'btnExpandAll' ).style.display = '';

      // Auto-open README
      if ( state.tree ) {
        const readme = state.tree.find( ( item ) =>
          item.type === 'blob' && /^readme\.(md|txt)$/i.test( item.path.split( '/' ).pop() ) && !item.path.includes( '/' )
        ) ?? state.tree.find( ( item ) =>
          item.type === 'blob' && /^readme\.(md|txt)$/i.test( item.path.split( '/' ).pop() )
        );
        if ( readme ) {
          const el = document.querySelector( `[data-path="${ CSS.escape( readme.path ) }"]` );
          if ( el ) {
            el.click();
            el.scrollIntoView( { block: 'center', behavior: 'smooth' } );
          }
        }
      }

      // Setup filter
      setupFilter();

      // Setup keyboard navigation
      setupKeyboardNav();
    };

    /* ── Expand All / Collapse All ── */
    document.getElementById( 'btnExpandAll' )?.addEventListener( 'click', () => {
      const btn = document.getElementById( 'btnExpandAll' );
      const allDetails = document.querySelectorAll( '#treeList details' );
      const expanding = btn.textContent.trim() === 'Expand All';

      allDetails.forEach( ( d ) => {
        if ( expanding ) d.setAttribute( 'open', '' );
        else d.removeAttribute( 'open' );
      } );

      btn.textContent = expanding ? 'Collapse All' : 'Expand All';
      btn.title = expanding ? 'Collapse All Folders' : 'Expand All Folders';
    } );

    /* ── File selection via event delegation ── */
    document.getElementById( 'treeList' ).addEventListener( 'click', ( e ) => {
      const item = e.target.closest( '[data-action="select-file"]' );
      if ( !item ) return;

      const prev = document.querySelector( '#treeList .tree-item.active' );
      if ( prev ) prev.classList.remove( 'active' );
      item.classList.add( 'active' );

      state.currentFilePath = item.dataset.path;
      const fileName = state.currentFilePath.split( '/' ).pop();
      document.getElementById( 'contentHeaderTitle' ).textContent = fileName;
      document.getElementById( 'contentBody' ).innerHTML = `<p>Selected: ${ escapeHTML( state.currentFilePath ) }</p>`;
    } );

    /* ── Filter ── */
    const setupFilter = () => {
      const filterInput = document.getElementById( 'inpFilter' );
      let debounceTimer = null;

      filterInput.addEventListener( 'input', () => {
        clearTimeout( debounceTimer );
        debounceTimer = setTimeout( () => {
          const query = filterInput.value.trim().toLowerCase();
          const treeList = document.getElementById( 'treeList' );
          const items = treeList.querySelectorAll( '.tree-item' );
          const folders = treeList.querySelectorAll( 'details' );

          if ( !query ) {
            items.forEach( ( el ) => ( el.style.display = '' ) );
            folders.forEach( ( el ) => ( el.style.display = '' ) );
            return;
          }

          items.forEach( ( el ) => {
            const path = ( el.dataset.path || '' ).toLowerCase();
            el.style.display = path.includes( query ) ? '' : 'none';
          } );

          folders.forEach( ( det ) => {
            const hasVisible = det.querySelector( '.tree-item:not([style*="display: none"])' );
            if ( hasVisible ) {
              det.style.display = '';
              det.setAttribute( 'open', '' );
            } else {
              det.style.display = 'none';
            }
          } );
        }, 150 );
      } );
    };

    /* ── Keyboard navigation ── */
    const getVisibleTreeItems = () => {
      const all = document.querySelectorAll( '#treeList .tree-folder, #treeList .tree-item' );
      return [ ...all ].filter( ( el ) => {
        if ( el.style.display === 'none' ) return false;
        // Check all ancestor details are open
        let parent = el.closest( 'details' );
        while ( parent ) {
          if ( !parent.hasAttribute( 'open' ) && !el.matches( 'details > summary' ) || ( el.matches( 'summary' ) && el.parentElement === parent ) ) {
            // summary is always visible if its parent details is visible
            if ( el.matches( 'summary' ) && el.parentElement === parent ) {
              parent = parent.parentElement?.closest( 'details' );
              continue;
            }
            if ( !parent.hasAttribute( 'open' ) ) return false;
          }
          parent = parent.parentElement?.closest( 'details' );
        }
        return true;
      } );
    };

    const setupKeyboardNav = () => {
      document.addEventListener( 'keydown', ( e ) => {
        // / shortcut to focus filter
        if ( e.key === '/' && !e.target.matches( 'input, textarea' ) ) {
          e.preventDefault();
          document.getElementById( 'inpFilter' ).focus();
          return;
        }

        const focused = document.activeElement;
        if ( !focused || ( !focused.classList.contains( 'tree-folder' ) && !focused.classList.contains( 'tree-item' ) ) ) return;

        const items = getVisibleTreeItems();
        const idx = items.indexOf( focused );
        if ( idx === -1 ) return;

        const navigate = ( newIdx ) => {
          if ( newIdx >= 0 && newIdx < items.length ) {
            e.preventDefault();
            items[ newIdx ].focus();
            // Auto-select if file
            if ( items[ newIdx ].classList.contains( 'tree-item' ) ) {
              items[ newIdx ].click();
            }
          }
        };

        switch ( e.key ) {
          case 'ArrowDown':
            e.preventDefault();
            navigate( idx + 1 );
            break;
          case 'ArrowUp':
            e.preventDefault();
            navigate( idx - 1 );
            break;
          case 'Enter':
          case ' ':
            e.preventDefault();
            if ( focused.classList.contains( 'tree-folder' ) ) {
              const details = focused.parentElement;
              details.toggleAttribute( 'open' );
            } else {
              focused.click();
            }
            break;
          case 'ArrowRight':
            e.preventDefault();
            if ( focused.classList.contains( 'tree-folder' ) ) {
              const details = focused.parentElement;
              if ( !details.hasAttribute( 'open' ) ) {
                details.setAttribute( 'open', '' );
              } else {
                // Move to first child
                const firstChild = details.querySelector( '.tree-folder, .tree-item' );
                if ( firstChild && firstChild !== focused ) {
                  firstChild.focus();
                  if ( firstChild.classList.contains( 'tree-item' ) ) firstChild.click();
                }
              }
            }
            break;
          case 'ArrowLeft':
            e.preventDefault();
            if ( focused.classList.contains( 'tree-folder' ) ) {
              const details = focused.parentElement;
              if ( details.hasAttribute( 'open' ) ) {
                details.removeAttribute( 'open' );
              } else {
                // Move to parent folder
                const parentDetails = details.parentElement?.closest( 'details' );
                if ( parentDetails ) parentDetails.querySelector( ':scope > summary' )?.focus();
              }
            } else {
              // File: move to parent folder
              const parentDetails = focused.closest( 'details' );
              if ( parentDetails ) parentDetails.querySelector( ':scope > summary' )?.focus();
            }
            break;
        }
      } );
    };

    /* ── Scroll to folder utility ── */
    const scrollToTreeFolder = ( folderPath ) => {
      const target = document.querySelector( `details[data-folder-path="${ CSS.escape( folderPath ) }"]` );
      if ( !target ) return;
      // Open all ancestors
      let parent = target.parentElement?.closest( 'details' );
      while ( parent ) {
        parent.setAttribute( 'open', '' );
        parent = parent.parentElement?.closest( 'details' );
      }
      target.setAttribute( 'open', '' );
      target.scrollIntoView( { block: 'center', behavior: 'smooth' } );
    };

    /* ── Fetch tree from GitHub API ── */
    const fetchTree = async () => {
      if ( currentAbortController ) currentAbortController.abort();
      currentAbortController = new AbortController();
      const signal = currentAbortController.signal;
      const treeList = document.getElementById( 'treeList' );

      try {
        // Fetch default branch if needed
        if ( !state.branch ) {
          const repoRes = await fetch( `https://api.github.com/repos/${ state.owner }/${ state.repo }`, {
            headers: apiHeaders(),
            signal,
          } );
          updateRateLimit( repoRes );
          if ( !repoRes.ok ) throw new Error( `Repo fetch failed: ${ repoRes.status }` );
          const repoData = await repoRes.json();
          state.branch = repoData.default_branch;
        }

        // Fetch tree
        const treeRes = await fetch(
          `https://api.github.com/repos/${ state.owner }/${ state.repo }/git/trees/${ state.branch }?recursive=1`,
          { headers: apiHeaders(), signal }
        );
        updateRateLimit( treeRes );

        if ( treeRes.status === 403 ) {
          treeList.innerHTML = `<p style="color: red; padding: 0.5rem;">Rate limited. Add a GitHub token for higher limits.</p>`;
          return;
        }
        if ( !treeRes.ok ) throw new Error( `Tree fetch failed: ${ treeRes.status }` );

        const treeData = await treeRes.json();

        if ( treeData.truncated ) {
          const warning = document.createElement( 'div' );
          warning.style.cssText = 'background: #fff3cd; border: 1px solid #ffc107; padding: 0.5rem; border-radius: 4px; margin-bottom: 0.5rem; font-size: 0.85rem;';
          warning.textContent = '⚠️ Repository tree is truncated. Some files may not appear.';
          treeList.appendChild( warning );
        }

        state.tree = treeData.tree;
        renderTree( state.tree );
      } catch ( err ) {
        if ( err.name === 'AbortError' ) return;
        treeList.innerHTML = `<p style="color: red; padding: 0.5rem;">${ escapeHTML( err.message ) }</p>`;
      }
    };

    /* ── Init ── */
    const init = async () => {
      initAppearance();
      setupListeners();
      await detectRepo();
      state.owner = CONFIG.owner;
      state.repo = CONFIG.repo;
      state.branch = CONFIG.branch;

      if ( state.owner && state.repo ) {
        updateHeaderFromConfig();
        document.getElementById( 'contentBody' ).innerHTML = '<p>Loading tree…</p>';
        await fetchTree();
      }
    };

    init();
  </script>
</body>

</html>
