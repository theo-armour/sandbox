<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="revised" content="2026-04-08 15:00">
  <title>TooToo LT</title>
  <style>
    :root {
      --primary-bg: #f3f4f6;
      --secondary-bg: #ffffff;
      --text-color: #1f2937;
      --border-color: #d1d5db;
      --highlight-color: #2563eb;
      --hover-bg: #e5e7eb;
      --font-family: system-ui, -apple-system, sans-serif;
      --sidebar-width: 300px;
      --font-size: 16px;
    }

    html {
      font-size: var(--font-size);
    }

    body.dark-mode {
      --primary-bg: #1f2937;
      --secondary-bg: #111827;
      --text-color: #f3f4f6;
      --border-color: #374151;
      --highlight-color: #3b82f6;
      --hover-bg: #374151;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      margin: 0;
      overflow-x: hidden;
      font-family: var(--font-family);
      color: var(--text-color);
      background-color: var(--primary-bg);
    }

    header {
      display: flex;
      flex-flow: row wrap;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      background: var(--primary-bg);
      border-bottom: 1px solid var(--border-color);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
      z-index: 10;
    }

    #headerGitHub {
      display: flex;
      align-items: center;
      color: inherit;
    }

    #headerTitle {
      font-weight: bold;
      font-size: 1.1rem;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
    }

    .header-btn {
      background: var(--secondary-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 0.4rem 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    .header-btn:hover {
      opacity: 0.88;
      transform: translateY(-1px);
    }

    .header-btn:active {
      transform: translateY(0);
    }

    .dark-mode-btn {
      margin-left: auto;
    }

    button.primary,
    button.secondary {
      background: var(--highlight-color);
      color: #ffffff;
      border: none;
      padding: 0.4rem 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    button.primary:hover,
    button.secondary:hover {
      opacity: 0.88;
      transform: translateY(-1px);
    }

    button.primary:active,
    button.secondary:active {
      transform: translateY(0);
    }

    .rate-limit-badge {
      display: none;
      font-size: 0.8rem;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      background: var(--hover-bg);
    }

    main {
      display: flex;
      flex-direction: row;
      flex: 1;
      overflow: hidden;
    }

    .sidebar {
      width: var(--sidebar-width);
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: var(--primary-bg);
      padding: 0;
      overflow: hidden;
    }

    .resizer {
      width: 8px;
      background: var(--highlight-color);
      opacity: 0.7;
      cursor: col-resize;
      touch-action: none;
      transition: opacity 0.2s;
    }

    .resizer:hover,
    .resizer.dragging {
      opacity: 1;
    }

    .content-area {
      flex: 1;
      min-width: 0;
      padding: 0;
      overflow-y: auto;
      background: var(--secondary-bg);
      position: relative;
    }

    #contentBody {
      padding: 0 1rem 1rem 1rem;
      background: var(--secondary-bg);
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 0.5rem;
      border-bottom: 1px solid var(--border-color);
      background: var(--primary-bg);
    }

    .panel-header h3 {
      margin: 0;
      font-size: 0.95rem;
    }

    .file-header {
      position: sticky;
      top: 0;
      z-index: 5;
      padding: 0.5rem 1rem;
      background: var(--primary-bg);
    }

    #treeFilter {
      margin: 0.4rem 0.5rem 0 0.5rem;
      width: calc(100% - 1rem);
      box-sizing: border-box;
      padding: 0.3rem 0.5rem;
      font-size: 0.85rem;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      background: var(--secondary-bg);
      color: var(--text-color);
      outline: none;
    }

    #treeFilter:focus {
      border-color: var(--highlight-color);
    }

    #treeList {
      padding: 0 0.5rem;
      flex: 1;
      overflow-y: auto;
    }

    .back-to-top {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      z-index: 20;
      background-color: var(--highlight-color);
      color: #ffffff;
      border: none;
      border-radius: 50%;
      width: 2.5rem;
      height: 2.5rem;
      font-size: 1.2rem;
      display: none;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
      cursor: pointer;
      align-items: center;
      justify-content: center;
    }

    /* --- Treeview CSS --- */

    .tree-folder {
      display: flex;
      align-items: center;
      padding: 0.2rem 0.4rem;
      cursor: pointer;
      border-radius: 4px;
      font-family: monospace;
      font-size: 0.85rem;
      user-select: none;
      list-style: none;
    }

    .tree-folder::-webkit-details-marker {
      display: none;
    }

    .tree-folder:hover {
      background: var(--hover-bg);
    }

    .tree-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.2rem 0.4rem 0.2rem 1.2rem;
      cursor: pointer;
      border-radius: 4px;
      font-family: monospace;
      font-size: 0.85rem;
    }

    .tree-item:hover {
      background: var(--hover-bg);
    }

    .tree-item.active {
      background: var(--highlight-color);
      color: #fff;
    }

    .tree-item-size {
      font-size: 0.75rem;
      opacity: 0.6;
      margin-left: 0.5rem;
      white-space: nowrap;
    }

    details details {
      padding-left: 0.8rem;
    }

    details {
      padding-left: 0;
    }

    @media (max-width: 768px) {
      .sidebar {
        width: 25% !important;
      }

      .resizer {
        width: 4px;
      }

      .file-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.5rem;
      }
    }
  </style>
</head>

<body>

  <header>
    <a id="headerGitHub" href="#" title="View on GitHub">
      <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor">
        <path
          d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z" />
      </svg>
    </a>
    <a id="headerTitle" href="#" title="Reload">TooToo LT</a>
    <button id="btnDarkMode" class="header-btn dark-mode-btn" title="Toggle Dark Mode">🌙</button>
    <button id="btnFontDec" class="header-btn" title="Decrease Font Size">A−</button>
    <button id="btnFontInc" class="header-btn" title="Increase Font Size">A+</button>
    <button id="btnToken" class="header-btn" title="Set GitHub Personal Access Token">⚙️ Token</button>
    <div id="rateBadge" class="rate-limit-badge" title="API Rate Limit" aria-live="polite"></div>
  </header>

  <main>

    <div class="sidebar">
      <div class="panel-header" title="Last updated: 2026-04-08 15:00">
        <h3 id="hFiles">Files</h3>
        <button id="btnExpandAll" class="secondary" style="display: none;" title="Expand All Folders">Expand
          All</button>
      </div>
      <input type="text" id="treeFilter" placeholder="Filter files…" title="Filter files by name">
      <div id="treeList"></div>
    </div>

    <div class="resizer" id="resizer" title="Drag to Resize Sidebar"></div>

    <div class="content-area" id="contentArea">
      <div class="panel-header file-header">
        <h3 id="contentTitle">Content</h3>
      </div>
      <div id="contentBody">
        <p>Awaiting repository detection...</p>
      </div>
      <button id="btnBackToTop" class="back-to-top" aria-label="Back to top" title="Back to Top">↑</button>
    </div>

  </main>

  <script>
    const escapeHTML = ( str ) => {
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
      return String( str ).replace( /[&<>"']/g, ( c ) => map[ c ] );
    };

    const CONFIG = {
      owner: 'theo-armour',
      repo: 'sandbox',
      branch: '',
    };

    const state = {
      owner: '',
      repo: '',
      branch: '',
      tree: null,
      currentFilePath: '',
    };

    const storageKey = ( suffix ) => `tootoo-lt:${ location.pathname }:${ suffix }`;

    const updateHeaderFromConfig = () => {
      const title = `${ state.owner } / ${ state.repo }`;
      document.title = title;
      document.getElementById( 'headerTitle' ).textContent = title;
      document.getElementById( 'headerGitHub' ).href = `https://github.com/${ encodeURIComponent( state.owner ) }/${ encodeURIComponent( state.repo ) }`;
    };

    const detectRepo = async () => {
      // 1. URL query parameters
      const params = new URLSearchParams( location.search );
      if ( params.get( 'owner' ) ) CONFIG.owner = params.get( 'owner' );
      if ( params.get( 'repo' ) ) CONFIG.repo = params.get( 'repo' );
      if ( params.get( 'branch' ) ) CONFIG.branch = params.get( 'branch' );

      // 2. CONFIG already filled
      if ( CONFIG.owner && CONFIG.repo ) return;

      // 3. localStorage cache
      const cached = localStorage.getItem( storageKey( 'repo' ) );
      if ( cached ) {
        try {
          const obj = JSON.parse( cached );
          if ( obj.owner && obj.repo ) {
            CONFIG.owner = obj.owner;
            CONFIG.repo = obj.repo;
            return;
          }
        } catch { /* ignore */ }
      }

      // 4. Fetch .git/config
      const prefixes = [ '', '../', '../../', '../../../', '../../../../' ];
      for ( const prefix of prefixes ) {
        try {
          const resp = await fetch( `${ prefix }.git/config` );
          if ( !resp.ok ) continue;
          const text = await resp.text();
          const match = text.match( /github\.com[:/]([^/\s]+)\/([^/\s.]+)/ );
          if ( match ) {
            CONFIG.owner = match[ 1 ];
            CONFIG.repo = match[ 2 ].replace( /\.git$/, '' );
            localStorage.setItem( storageKey( 'repo' ), JSON.stringify( { owner: CONFIG.owner, repo: CONFIG.repo } ) );
            return;
          }
        } catch { /* ignore 404s */ }
      }

      // 5. Show inline form
      return new Promise( ( resolve ) => {
        const cb = document.getElementById( 'contentBody' );
        cb.innerHTML = `
          <div style="display:flex;flex-direction:column;gap:0.5rem;max-width:300px;margin-top:1rem;">
            <label>Owner: <input id="inpOwner" style="padding:0.3rem 0.5rem;width:100%;box-sizing:border-box;" /></label>
            <label>Repo: <input id="inpRepo" style="padding:0.3rem 0.5rem;width:100%;box-sizing:border-box;" /></label>
            <button id="btnSetRepo" class="primary" title="Save these repository settings">Set Repository</button>
          </div>`;
        document.getElementById( 'btnSetRepo' ).addEventListener( 'click', () => {
          const owner = document.getElementById( 'inpOwner' ).value.trim();
          const repo = document.getElementById( 'inpRepo' ).value.trim();
          if ( owner && repo ) {
            CONFIG.owner = owner;
            CONFIG.repo = repo;
            localStorage.setItem( storageKey( 'repo' ), JSON.stringify( { owner, repo } ) );
            resolve();
          }
        } );
      } );
    };

    const initAppearance = () => {
      // Dark mode
      if ( localStorage.getItem( storageKey( 'darkMode' ) ) === 'true' ) {
        document.body.classList.add( 'dark-mode' );
        document.getElementById( 'btnDarkMode' ).textContent = '☀️';
      }
      // Font size
      const fs = localStorage.getItem( storageKey( 'fontSize' ) );
      if ( fs ) document.documentElement.style.setProperty( '--font-size', fs );
      // Sidebar width
      const sw = localStorage.getItem( storageKey( 'sidebarWidth' ) );
      if ( sw ) document.documentElement.style.setProperty( '--sidebar-width', sw );
    };

    let treeAbortController = null;

    const githubFetch = async ( url ) => {
      const headers = {};
      const token = localStorage.getItem( 'githubToken' );
      if ( token ) headers[ 'Authorization' ] = `token ${ token }`;

      const response = await fetch( url, { headers, signal: treeAbortController.signal } );

      const remaining = response.headers.get( 'X-RateLimit-Remaining' );
      const limit = response.headers.get( 'X-RateLimit-Limit' );
      if ( remaining && limit ) {
        const badge = document.getElementById( 'rateBadge' );
        badge.style.display = 'inline';
        badge.textContent = `${ remaining }/${ limit }`;
      }

      if ( !response.ok ) {
        if ( response.status === 403 ) {
          throw new Error( "Rate limited. Add a GitHub token for higher limits." );
        }
        throw new Error( `API Error: ${ response.status } ${ response.statusText }` );
      }
      return response.json();
    };

    const fetchTree = async () => {
      if ( treeAbortController ) treeAbortController.abort();
      treeAbortController = new AbortController();

      try {
        if ( !state.branch ) {
          const repoData = await githubFetch( `https://api.github.com/repos/${ state.owner }/${ state.repo }` );
          state.branch = repoData.default_branch;
        }

        const treeData = await githubFetch( `https://api.github.com/repos/${ state.owner }/${ state.repo }/git/trees/${ state.branch }?recursive=1` );

        const treeList = document.getElementById( 'treeList' );
        treeList.innerHTML = '';

        if ( treeData.truncated ) {
          treeList.innerHTML = `<div style="background: #fff3cd; border: 1px solid #ffc107; padding: 0.5rem; border-radius: 4px; margin-bottom: 0.5rem; font-size: 0.85rem;">⚠️ Repository tree is truncated. Some files may not appear.</div>`;
        }

        state.tree = treeData.tree;
        renderTree( state.tree );

      } catch ( err ) {
        if ( err.name !== 'AbortError' ) {
          document.getElementById( 'treeList' ).innerHTML = `<div style="color: red; padding: 0.5rem;">${ escapeHTML( err.message ) }</div>`;
        }
      }
    };

    const getFileIcon = ( ext ) => {
      const e = ext.toLowerCase();
      if ( e === 'md' ) return '📝';
      if ( [ 'js', 'mjs', 'cjs' ].includes( e ) ) return '🟨';
      if ( [ 'ts', 'tsx' ].includes( e ) ) return '🟦';
      if ( e === 'py' ) return '🐍';
      if ( [ 'html', 'htm' ].includes( e ) ) return '🌐';
      if ( [ 'css', 'scss', 'less' ].includes( e ) ) return '🎨';
      if ( [ 'png', 'jpg', 'jpeg', 'gif', 'webp', 'svg', 'ico' ].includes( e ) ) return '🖼️';
      if ( [ 'mp3', 'wav', 'ogg' ].includes( e ) ) return '🎵';
      if ( [ 'mp4', 'webm' ].includes( e ) ) return '🎬';
      if ( e === 'pdf' ) return '📕';
      if ( [ 'xlsx', 'xls', 'csv', 'ods' ].includes( e ) ) return '📊';
      if ( [ 'yaml', 'yml', 'toml' ].includes( e ) ) return '⚙️';
      if ( [ 'zip', 'tar', 'gz', '7z' ].includes( e ) ) return '📦';
      if ( e === 'json' ) return '{ }';
      return '📄';
    };

    const formatSize = ( size ) => {
      if ( size < 1024 ) return `${ size } B`;
      if ( size < 1024 * 1024 ) return `${ ( size / 1024 ).toFixed( 1 ) } KB`;
      return `${ ( size / ( 1024 * 1024 ) ).toFixed( 1 ) } MB`;
    };

    const renderTree = ( treeArray ) => {
      const root = { children: {}, type: 'tree', path: '' };

      // Build hierarchy
      for ( const item of treeArray ) {
        const parts = item.path.split( '/' );

        // Filter out hidden folders/files
        let isHidden = false;
        for ( let i = 0; i < parts.length; i++ ) {
          if ( parts[ i ].startsWith( '.' ) ) {
            isHidden = true;
            break;
          }
        }
        if ( isHidden ) continue;

        let current = root;
        for ( let i = 0; i < parts.length; i++ ) {
          const part = parts[ i ];
          if ( !current.children[ part ] ) {
            current.children[ part ] = {
              name: part,
              children: {},
              type: i === parts.length - 1 ? item.type : 'tree',
              size: i === parts.length - 1 ? item.size : undefined,
              path: parts.slice( 0, i + 1 ).join( '/' )
            };
          }
          current = current.children[ part ];
        }
      }

      // Sort function
      const sortNode = ( node ) => {
        const children = Object.values( node.children );
        children.sort( ( a, b ) => {
          if ( a.type === 'tree' && b.type !== 'tree' ) return -1;
          if ( a.type !== 'tree' && b.type === 'tree' ) return 1;
          return a.name.toLowerCase().localeCompare( b.name.toLowerCase() );
        } );
        node.sortedChildren = children;
        for ( const child of children ) {
          if ( child.type === 'tree' ) sortNode( child );
        }
      };
      sortNode( root );

      const treeList = document.getElementById( 'treeList' );
      const statusLine = document.createElement( 'div' );
      statusLine.id = 'treeRenderStatus';
      statusLine.style.cssText = 'font-size: 0.85rem; color: var(--text-color); opacity: 0.7; padding: 0.3rem 0.5rem;';
      treeList.appendChild( statusLine );

      let i = 0;
      const batchSize = 120;
      const topLevelItems = root.sortedChildren;

      const generateHTML = ( node ) => {
        let html = '';
        if ( node.type === 'tree' ) {
          html += `<details data-folder-path="${ escapeHTML( node.path ) }">
            <summary class="tree-folder" tabindex="0" title="${ escapeHTML( node.path ) }">
              📁 <span class="folder-name">${ escapeHTML( node.name ) }</span>
            </summary>`;
          for ( const child of node.sortedChildren ) {
            html += generateHTML( child );
          }
          html += `</details>`;
        } else {
          const isReadme = node.name.toLowerCase().startsWith( 'readme.' );
          const display = isReadme ? `<strong>${ escapeHTML( node.name ) }</strong>` : escapeHTML( node.name );
          const ext = node.name.split( '.' ).pop();
          const icon = getFileIcon( ext );
          html += `<div class="tree-item" tabindex="0" data-action="select-file" data-path="${ escapeHTML( node.path ) }" title="${ escapeHTML( node.path ) }">
            <span class="tree-item-name">${ icon } ${ display }</span>
            <span class="tree-item-size">${ formatSize( node.size ) }</span>
          </div>`;
        }
        return html;
      };

      const renderBatch = () => {
        const end = Math.min( i + batchSize, topLevelItems.length );
        let htmlStr = '';
        for ( ; i < end; i++ ) {
          htmlStr += generateHTML( topLevelItems[ i ] );
        }

        statusLine.insertAdjacentHTML( 'beforebegin', htmlStr );

        if ( i < topLevelItems.length ) {
          const pct = Math.round( ( i / topLevelItems.length ) * 100 );
          statusLine.textContent = `${ pct }% rendered...`;
          setTimeout( renderBatch, 0 );
        } else {
          statusLine.remove();
          onRenderComplete();
        }
      };

      renderBatch();
    };

    const onRenderComplete = () => {
      document.getElementById( 'btnExpandAll' ).style.display = 'inline-block';

      // Auto-open README
      const readme = state.tree.find( item =>
        item.type === 'blob' &&
        !item.path.includes( '/' ) &&
        item.path.toLowerCase().startsWith( 'readme.' )
      );

      if ( readme ) {
        const itemNode = document.querySelector( `.tree-item[data-path="${ readme.path }"]` );
        if ( itemNode ) {
          itemNode.click();
        }
      }
    };

    const scrollToTreeFolder = ( folderPath ) => {
      const details = document.querySelector( `details[data-folder-path="${ folderPath.replace( /"/g, '\\"' ) }"]` );
      if ( !details ) return;

      let parent = details.parentElement.closest( 'details' );
      while ( parent ) {
        parent.open = true;
        parent = parent.parentElement.closest( 'details' );
      }
      details.open = true;
      details.scrollIntoView( { block: 'center', behavior: 'smooth' } );
    };

    const setupTreeListeners = () => {
      // Filter logic (debounced)
      let filterTimeout;
      document.getElementById( 'treeFilter' ).addEventListener( 'input', ( e ) => {
        clearTimeout( filterTimeout );
        filterTimeout = setTimeout( () => {
          const query = e.target.value.trim().toLowerCase();
          const items = document.querySelectorAll( '.tree-item' );
          const details = document.querySelectorAll( '#treeList details' );

          if ( !query ) {
            items.forEach( item => item.style.display = '' );
            details.forEach( detail => detail.style.display = '' );
            return;
          }

          items.forEach( item => {
            const path = item.getAttribute( 'data-path' ).toLowerCase();
            item.style.display = path.includes( query ) ? '' : 'none';
          } );

          details.forEach( detail => {
            const hasVisible = Array.from( detail.querySelectorAll( '.tree-item' ) ).some( item => item.style.display !== 'none' );
            if ( hasVisible ) {
              detail.style.display = '';
              detail.open = true;
            } else {
              detail.style.display = 'none';
            }
          } );
        }, 150 );
      } );

      // Expand / Collapse All
      document.getElementById( 'btnExpandAll' ).addEventListener( 'click', ( e ) => {
        const btn = e.target;
        const details = document.querySelectorAll( '#treeList details' );
        const isExpand = btn.textContent === 'Expand All';

        details.forEach( detail => detail.open = isExpand );
        btn.textContent = isExpand ? 'Collapse All' : 'Expand All';
      } );

      // Select file via event delegation
      document.getElementById( 'treeList' ).addEventListener( 'click', ( e ) => {
        const treeItem = e.target.closest( '.tree-item' );
        if ( !treeItem ) return;

        document.querySelectorAll( '.tree-item.active' ).forEach( el => el.classList.remove( 'active' ) );
        treeItem.classList.add( 'active' );

        state.currentFilePath = treeItem.getAttribute( 'data-path' );
        const filename = state.currentFilePath.split( '/' ).pop();
        document.getElementById( 'contentTitle' ).textContent = filename;
        document.getElementById( 'contentBody' ).innerHTML = `<p>Selected: ${ escapeHTML( state.currentFilePath ) }</p>`;
      } );

      // Keyboard navigation
      const getVisibleTreeItems = () => {
        const all = document.querySelectorAll( '.tree-folder, .tree-item' );
        return Array.from( all ).filter( el => {
          if ( el.style.display === 'none' ) return false;
          let parent = el.closest( 'details' );
          while ( parent ) {
            if ( !parent.open && el !== parent.querySelector( '.tree-folder' ) ) return false;
            if ( parent.style.display === 'none' ) return false;
            parent = parent.parentElement.closest( 'details' );
          }
          return true;
        } );
      };

      document.addEventListener( 'keydown', ( e ) => {
        // / shortcut
        if ( e.key === '/' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA' ) {
          e.preventDefault();
          document.getElementById( 'treeFilter' ).focus();
          return;
        }

        const active = document.activeElement;
        const isTreeEl = active.classList.contains( 'tree-item' ) || active.classList.contains( 'tree-folder' );
        if ( !isTreeEl || !document.getElementById( 'treeList' ).contains( active ) ) return;

        const visible = getVisibleTreeItems();
        const idx = visible.indexOf( active );

        if ( e.key === 'ArrowDown' ) {
          e.preventDefault();
          if ( idx < visible.length - 1 ) {
            visible[ idx + 1 ].focus();
            if ( visible[ idx + 1 ].classList.contains( 'tree-item' ) ) visible[ idx + 1 ].click();
          }
        } else if ( e.key === 'ArrowUp' ) {
          e.preventDefault();
          if ( idx > 0 ) {
            visible[ idx - 1 ].focus();
            if ( visible[ idx - 1 ].classList.contains( 'tree-item' ) ) visible[ idx - 1 ].click();
          }
        } else if ( e.key === 'Enter' || e.key === ' ' ) {
          e.preventDefault();
          if ( active.classList.contains( 'tree-item' ) ) active.click();
          else if ( active.classList.contains( 'tree-folder' ) ) active.closest( 'details' ).open = !active.closest( 'details' ).open;
        } else if ( e.key === 'ArrowRight' ) {
          e.preventDefault();
          if ( active.classList.contains( 'tree-folder' ) ) {
            const details = active.closest( 'details' );
            if ( !details.open ) details.open = true;
            else if ( idx < visible.length - 1 ) visible[ idx + 1 ].focus();
          }
        } else if ( e.key === 'ArrowLeft' ) {
          e.preventDefault();
          if ( active.classList.contains( 'tree-folder' ) ) {
            const details = active.closest( 'details' );
            if ( details.open ) details.open = false;
            else {
              const p = details.parentElement.closest( 'details' );
              if ( p ) p.querySelector( '.tree-folder' ).focus();
            }
          } else if ( active.classList.contains( 'tree-item' ) ) {
            const p = active.closest( 'details' );
            if ( p ) p.querySelector( '.tree-folder' ).focus();
          }
        }
      } );
    };

    const setupListeners = () => {
      // Dark mode toggle
      document.getElementById( 'btnDarkMode' ).addEventListener( 'click', () => {
        document.body.classList.toggle( 'dark-mode' );
        const isDark = document.body.classList.contains( 'dark-mode' );
        document.getElementById( 'btnDarkMode' ).textContent = isDark ? '☀️' : '🌙';
        localStorage.setItem( storageKey( 'darkMode' ), isDark );
      } );

      // Font size
      const getFontSize = () => parseInt( getComputedStyle( document.documentElement ).getPropertyValue( '--font-size' ) ) || 16;

      document.getElementById( 'btnFontInc' ).addEventListener( 'click', () => {
        const sz = Math.min( getFontSize() + 2, 28 );
        document.documentElement.style.setProperty( '--font-size', sz + 'px' );
        localStorage.setItem( storageKey( 'fontSize' ), sz + 'px' );
      } );

      document.getElementById( 'btnFontDec' ).addEventListener( 'click', () => {
        const sz = Math.max( getFontSize() - 2, 10 );
        document.documentElement.style.setProperty( '--font-size', sz + 'px' );
        localStorage.setItem( storageKey( 'fontSize' ), sz + 'px' );
      } );

      // Token prompt
      document.getElementById( 'btnToken' ).addEventListener( 'click', () => {
        const current = localStorage.getItem( 'githubToken' ) || '';
        const token = prompt( 'Enter GitHub Personal Access Token:', current );
        if ( token !== null ) {
          localStorage.setItem( 'githubToken', token );
          location.reload();
        }
      } );

      // Resizable sidebar
      const resizer = document.getElementById( 'resizer' );
      resizer.addEventListener( 'pointerdown', ( e ) => {
        resizer.setPointerCapture( e.pointerId );
        resizer.classList.add( 'dragging' );
        document.body.style.userSelect = 'none';
        document.body.style.cursor = 'col-resize';
      } );
      resizer.addEventListener( 'pointermove', ( e ) => {
        if ( !resizer.hasPointerCapture( e.pointerId ) ) return;
        const w = Math.max( 100, Math.min( e.clientX, window.innerWidth - 100 ) );
        document.documentElement.style.setProperty( '--sidebar-width', w + 'px' );
      } );
      resizer.addEventListener( 'pointerup', ( e ) => {
        resizer.releasePointerCapture( e.pointerId );
        resizer.classList.remove( 'dragging' );
        document.body.style.userSelect = '';
        document.body.style.cursor = '';
        const w = getComputedStyle( document.documentElement ).getPropertyValue( '--sidebar-width' );
        localStorage.setItem( storageKey( 'sidebarWidth' ), w );
      } );

      // Back-to-top
      const contentArea = document.getElementById( 'contentArea' );
      const btnTop = document.getElementById( 'btnBackToTop' );
      contentArea.addEventListener( 'scroll', () => {
        btnTop.style.display = contentArea.scrollTop > 400 ? 'flex' : 'none';
      } );
      btnTop.addEventListener( 'click', () => {
        contentArea.scrollTo( { top: 0, behavior: 'smooth' } );
      } );

      // Header title reload
      document.getElementById( 'headerTitle' ).addEventListener( 'click', ( e ) => {
        e.preventDefault();
        location.reload();
      } );
    };

    const init = async () => {
      initAppearance();
      setupListeners();

      await detectRepo();

      state.owner = CONFIG.owner;
      state.repo = CONFIG.repo;
      state.branch = CONFIG.branch;

      if ( state.owner && state.repo ) {
        updateHeaderFromConfig();
        const cb = document.getElementById( 'contentBody' );
        cb.innerHTML = '<p>Ready — repo detected: <strong>' + escapeHTML( state.owner ) + ' / ' + escapeHTML( state.repo ) + '</strong></p>';

        setupTreeListeners();
        fetchTree();
      }
    };

    init();

  </script>
</body>

</html>
