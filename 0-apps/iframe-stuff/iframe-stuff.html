<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="revised" content="2026-04-18 12:00">
  <title>Iframe Stuff</title>
  <style>
    :root {
      --splitter-size: 6px;
      --splitter-color: #ccc;
      --splitter-hover: #888;
      --col-left: 20%;
      --row-top: 30%;
      --row-mid: 10%;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      font-family: monospace;
      overflow: hidden;
    }

    .app {
      display: grid;
      grid-template-columns: var(--col-left) var(--splitter-size) 1fr;
      height: 100vh;
      width: 100vw;
    }

    .left {
      display: grid;
      grid-template-rows:
        var(--row-top) var(--splitter-size) var(--row-mid) var(--splitter-size) 1fr;
      min-width: 0;
      min-height: 0;
    }

    .pane {
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    .pane iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    .splitter {
      background: var(--splitter-color);
      touch-action: none;
      user-select: none;
    }

    .splitter:hover,
    .splitter.active {
      background: var(--splitter-hover);
    }

    .splitter.vertical {
      cursor: col-resize;
    }

    .splitter.horizontal {
      cursor: row-resize;
    }

    body.dragging,
    body.dragging * {
      user-select: none !important;
    }

    body.dragging iframe {
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div class="app" id="app">
    <div class="left" id="left">
      <div class="pane">
        <iframe src="../teodoro/index.html" title="Teodoro"></iframe>
      </div>
      <div class="splitter horizontal" data-target="row-top"></div>
      <div class="pane">
        <iframe src="https://theo-armour.github.io/sandbox/cookbook/iframe-stuff/iframe-director.html"
          title="Director"></iframe>
      </div>
      <div class="splitter horizontal" data-target="row-mid"></div>
      <div class="pane">
        <iframe
          src="https://calendar.google.com/calendar/embed?height=600&wkst=1&bgcolor=%23ffffff&ctz=America%2FLos_Angeles&mode=AGENDA&showTitle=0&showPrint=0&showTz=0&src=dC5hcm1vdXJAZ21haWwuY29t&src=Mmw4cGp1MXB2czc0Ym42ZHY3NWY0Y2JjZjhAZ3JvdXAuY2FsZW5kYXIuZ29vZ2xlLmNvbQ&src=cnUyMXA3M2VkdDR2MHZqMXM2Zjc1aHRpMmtAZ3JvdXAuY2FsZW5kYXIuZ29vZ2xlLmNvbQ&src=ajIwNGYzMG1yczNmOTRwNGY5MmJkMjZjZnNAZ3JvdXAuY2FsZW5kYXIuZ29vZ2xlLmNvbQ&src=Y3RtY2xzY2d1NTVxazZwZXA5ZG84bm1wNGdAZ3JvdXAuY2FsZW5kYXIuZ29vZ2xlLmNvbQ&src=ZjBnOHM1ODNvcXF2ZG1zYnExbmJnMGhzZ2dAZ3JvdXAuY2FsZW5kYXIuZ29vZ2xlLmNvbQ&src=ZW4udXNhI2hvbGlkYXlAZ3JvdXAudi5jYWxlbmRhci5nb29nbGUuY29t&color=%23039BE5&color=%23616161&color=%23AD1457&color=%23F4511E&color=%23D50000&color=%230B8043&color=%23009688"
          title="Calendar"></iframe>
      </div>
    </div>
    <div class="splitter vertical" data-target="col-left"></div>
    <div class="pane">
      <iframe src="../dashboard/index.html" title="Dashboard"></iframe>
    </div>
  </div>

  <script>
    const app = document.getElementById( 'app' );
    const left = document.getElementById( 'left' );
    const root = document.documentElement;
    const MIN = 40;
    const SPLIT = 6;

    const parsePx = ( value, total, fallbackPct ) => {
      const v = ( value || '' ).trim();
      if ( v.endsWith( 'px' ) ) return parseFloat( v );
      if ( v.endsWith( '%' ) ) return ( parseFloat( v ) / 100 ) * total;
      return fallbackPct * total;
    };

    const startDrag = ( event, splitter ) => {
      event.preventDefault();
      const target = splitter.dataset.target;
      splitter.classList.add( 'active' );
      document.body.classList.add( 'dragging' );

      const move = ( clientX, clientY ) => {
        const styles = getComputedStyle( root );
        if ( target === 'col-left' ) {
          const rect = app.getBoundingClientRect();
          const max = rect.width - MIN - SPLIT;
          const px = Math.max( MIN, Math.min( clientX - rect.left, max ) );
          root.style.setProperty( '--col-left', px + 'px' );
        } else {
          const rect = left.getBoundingClientRect();
          const total = rect.height;
          const y = clientY - rect.top;
          if ( target === 'row-top' ) {
            const midPx = parsePx( styles.getPropertyValue( '--row-mid' ), total, 0.10 );
            const maxTop = total - midPx - MIN - ( SPLIT * 2 );
            const px = Math.max( MIN, Math.min( y, maxTop ) );
            root.style.setProperty( '--row-top', px + 'px' );
          } else if ( target === 'row-mid' ) {
            const topPx = parsePx( styles.getPropertyValue( '--row-top' ), total, 0.25 );
            const midStart = topPx + SPLIT;
            const maxMidEnd = total - MIN - SPLIT;
            const midEnd = Math.max( midStart + MIN, Math.min( y, maxMidEnd ) );
            root.style.setProperty( '--row-mid', ( midEnd - midStart ) + 'px' );
          }
        }
      };

      const onMouseMove = ( e ) => move( e.clientX, e.clientY );
      const onTouchMove = ( e ) => {
        if ( e.touches.length ) {
          e.preventDefault();
          move( e.touches[ 0 ].clientX, e.touches[ 0 ].clientY );
        }
      };
      const stop = () => {
        splitter.classList.remove( 'active' );
        document.body.classList.remove( 'dragging' );
        window.removeEventListener( 'mousemove', onMouseMove );
        window.removeEventListener( 'mouseup', stop );
        window.removeEventListener( 'touchmove', onTouchMove );
        window.removeEventListener( 'touchend', stop );
        window.removeEventListener( 'touchcancel', stop );
      };

      window.addEventListener( 'mousemove', onMouseMove );
      window.addEventListener( 'mouseup', stop );
      window.addEventListener( 'touchmove', onTouchMove, { passive: false } );
      window.addEventListener( 'touchend', stop );
      window.addEventListener( 'touchcancel', stop );
    };

    document.querySelectorAll( '.splitter' ).forEach( ( splitter ) => {
      splitter.addEventListener( 'mousedown', ( e ) => startDrag( e, splitter ) );
      splitter.addEventListener( 'touchstart', ( e ) => startDrag( e, splitter ), { passive: false } );
    } );
  </script>
</body>

</html>
