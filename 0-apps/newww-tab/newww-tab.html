<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="revised" content="2026-04-18 12:00">
  <title>NewwwTab</title>
  <style>
    :root {
      --bg: #fafafa;
      --fg: #222;
      --muted: #888;
      --accent: #0366d6;
      --card-bg: #fff;
      --card-border: #e1e4e8;
      --summary-bg: #f3f4f6;
      --summary-fg: #24292e;
      --hover-bg: #eef3fb;
      --gh-bg: #eaecef;
      --gh-fg: #586069;
      --col-width: 8rem;
      --gap: 0.5rem;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --fg: #c9d1d9;
        --muted: #8b949e;
        --accent: #58a6ff;
        --card-bg: #161b22;
        --card-border: #30363d;
        --summary-bg: #21262d;
        --summary-fg: #c9d1d9;
        --hover-bg: #1f2a3a;
        --gh-bg: #30363d;
        --gh-fg: #8b949e;
      }
    }

    * {
      box-sizing: border-box;
    }

    html {
      font-size: 130%;
    }

    body {
      margin: 0;
      padding: 0.5rem;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.15;
    }

    h1 {
      font-size: 1rem;
      margin: 0 0 0.25rem;
      font-weight: 600;
      color: var(--muted);
      line-height: 1;
    }

    #board {
      display: flex;
      flex-direction: row;
      gap: var(--gap);
      align-items: flex-start;
      overflow-x: auto;
      padding-bottom: 0.5rem;
    }

    .column {
      flex: 0 0 var(--col-width);
      display: flex;
      flex-direction: column;
      gap: var(--gap);
    }

    .column>h2 {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin: 0 0 0.1rem;
      padding: 0 0.25rem;
      font-weight: 600;
      line-height: 1;
    }

    details.section {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      overflow: hidden;
    }

    details.section>summary {
      background: var(--summary-bg);
      color: var(--summary-fg);
      padding: 0.1rem 0.5rem;
      font-weight: 600;
      cursor: pointer;
      list-style: none;
      user-select: none;
      font-size: 0.85rem;
      line-height: 1.2;
    }

    details.section>summary::-webkit-details-marker {
      display: none;
    }

    details.section>summary::before {
      content: "▾";
      display: inline-block;
      width: 1rem;
      color: var(--muted);
      transition: transform 0.15s;
    }

    details.section:not([open])>summary::before {
      transform: rotate(-90deg);
    }

    ul.links {
      list-style: none;
      margin: 0;
      padding: 0.25rem 0;
    }

    ul.links li {
      padding: 0.15rem 0.6rem;
      display: flex;
      align-items: baseline;
      gap: 0.35rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    ul.links li:hover {
      background: var(--hover-bg);
    }

    ul.links a {
      color: var(--accent);
      text-decoration: none;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    ul.links a:hover {
      text-decoration: underline;
    }

    a.gh {
      display: inline-block;
      background: var(--gh-bg);
      color: var(--gh-fg);
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0 0.3rem;
      border-radius: 3px;
      text-decoration: none;
      line-height: 1.1rem;
      flex: 0 0 auto;
    }

    a.gh:hover {
      background: var(--accent);
      color: #fff;
      text-decoration: none;
    }

    #error {
      color: #c00;
      padding: 1rem;
      font-family: monospace;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

  <h1>NewwwTab</h1>
  <div id="board"></div>
  <div id="error"></div>

  <script>
    const DATA_URL = 'newwwtab-data-default.md';

    const parseMarkdown = ( text ) => {
      const lines = text.split( /\r?\n/ );
      const columns = [];
      let currentColumn = null;
      let currentSection = null;

      for ( const raw of lines ) {
        const line = raw.replace( /\s+$/, '' );
        if ( !line ) continue;

        const h2 = line.match( /^##\s+(.+)$/ );
        const h3 = line.match( /^###\s+(.+)$/ );
        const item = line.match( /^\s*-\s+(.+)$/ );

        if ( h2 && !h3 ) {
          currentColumn = { title: h2[ 1 ].trim(), sections: [] };
          columns.push( currentColumn );
          currentSection = null;
          continue;
        }
        if ( h3 ) {
          if ( !currentColumn ) {
            currentColumn = { title: '', sections: [] };
            columns.push( currentColumn );
          }
          currentSection = { title: h3[ 1 ].trim(), items: [] };
          currentColumn.sections.push( currentSection );
          continue;
        }
        if ( item && currentSection ) {
          currentSection.items.push( parseItem( item[ 1 ] ) );
        }
      }

      return columns;
    };

    const parseItem = ( text ) => {
      // Match leading [g](url) prefix
      const gh = text.match( /^\[g\]\(([^)]+)\)\s+(.+)$/ );
      let ghUrl = null;
      let rest = text;
      if ( gh ) {
        ghUrl = gh[ 1 ].trim();
        rest = gh[ 2 ];
      }

      // Find last whitespace-separated token that looks like a URL
      const urlMatch = rest.match( /^(.*\S)\s+(\S+:\/\/\S+)\s*$/ );
      let name, url;
      if ( urlMatch ) {
        name = urlMatch[ 1 ].trim();
        url = urlMatch[ 2 ].trim();
      } else {
        // Fallback: maybe the whole rest is a URL, or name with no URL
        const bare = rest.match( /^(\S+:\/\/\S+)\s*$/ );
        if ( bare ) {
          name = bare[ 1 ];
          url = bare[ 1 ];
        } else {
          name = rest.trim();
          url = null;
        }
      }

      return { ghUrl, name, url };
    };

    const render = ( columns ) => {
      const board = document.getElementById( 'board' );
      board.textContent = '';

      for ( const col of columns ) {
        const colEl = document.createElement( 'div' );
        colEl.className = 'column';

        if ( col.title ) {
          const h2 = document.createElement( 'h2' );
          h2.textContent = col.title;
          colEl.appendChild( h2 );
        }

        for ( const sec of col.sections ) {
          const det = document.createElement( 'details' );
          det.className = 'section';
          det.open = true;

          const sum = document.createElement( 'summary' );
          sum.textContent = sec.title;
          det.appendChild( sum );

          const ul = document.createElement( 'ul' );
          ul.className = 'links';

          for ( const it of sec.items ) {
            const li = document.createElement( 'li' );

            if ( it.ghUrl ) {
              const gh = document.createElement( 'a' );
              gh.className = 'gh';
              gh.href = it.ghUrl;
              gh.textContent = 'g';
              gh.title = it.ghUrl;
              gh.target = '_blank';
              gh.rel = 'noopener';
              li.appendChild( gh );
            }

            if ( it.url ) {
              const a = document.createElement( 'a' );
              a.href = it.url;
              a.textContent = it.name;
              a.title = it.url;
              a.target = '_blank';
              a.rel = 'noopener';
              li.appendChild( a );
            } else {
              const span = document.createElement( 'span' );
              span.textContent = it.name;
              li.appendChild( span );
            }

            ul.appendChild( li );
          }

          det.appendChild( ul );
          colEl.appendChild( det );
        }

        board.appendChild( colEl );
      }
    };

    const showError = ( msg ) => {
      document.getElementById( 'error' ).textContent = msg;
    };

    const init = async () => {
      try {
        const res = await fetch( DATA_URL );
        if ( !res.ok ) throw new Error( `Fetch ${ DATA_URL } failed: ${ res.status }` );
        const text = await res.text();
        const columns = parseMarkdown( text );
        render( columns );
      } catch ( err ) {
        showError( `Could not load ${ DATA_URL }\n${ err.message }\n\nServe via http:// (e.g. "python -m http.server") — file:// fetch is blocked by browsers.` );
      }
    };

    init();
  </script>

</body>

</html>
