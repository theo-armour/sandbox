<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="revised" content="2026-04-18 17:20">
  <style>
    :root {
      --bg: #ffffff;
      --fg: #000000;
      --btn-bg: #e5e5ea;
      --btn-hover: #d1d1d6;
      --muted: #6e6e73;
      --font: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1e;
        --fg: #ffffff;
        --btn-bg: #2c2c2e;
        --btn-hover: #3a3a3c;
        --muted: #98989d;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
      overflow: auto;
    }

    body {
      background-color: var(--bg);
      color: var(--fg);
      font-family: var(--font);
      font-size: clamp(0.85rem, 2.5vw, 1rem);
      padding: clamp(0.5rem, 3vw, 1.5rem);
      display: flex;
      flex-direction: column;
      gap: clamp(0.75rem, 3vw, 1.25rem);
    }

    section {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    h2 {
      font-size: clamp(0.7rem, 2vw, 0.8rem);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      font-weight: 600;
    }

    #clock {
      font-size: clamp(2rem, 12vw, 3.5rem);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    #date {
      font-size: clamp(0.85rem, 2.5vw, 1rem);
      color: var(--muted);
    }

    #weather-info {
      color: var(--muted);
      font-style: italic;
    }

    .links-list {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
    }

    .links-list a {
      display: inline-block;
      background: var(--btn-bg);
      color: var(--fg);
      text-decoration: none;
      padding: 0.3rem 0.6rem;
      border-radius: 0.3rem;
      font-size: clamp(0.8rem, 2.2vw, 0.9rem);
      transition: background-color 0.2s;
    }

    .links-list a:hover {
      background: var(--btn-hover);
    }

    #notes {
      width: 100%;
      min-height: 5rem;
      resize: vertical;
      background: var(--btn-bg);
      color: var(--fg);
      border: none;
      border-radius: 0.3rem;
      padding: 0.5rem;
      font-family: var(--font);
      font-size: clamp(0.8rem, 2.2vw, 0.9rem);
      line-height: 1.4;
    }

    #notes:focus {
      outline: 2px solid var(--muted);
    }
  </style>
</head>

<body>

  <section id="clock-section">
    <div id="clock">00:00</div>
    <div id="date"></div>
  </section>

  <section>
    <h2>Weather</h2>
    <div>San Francisco</div>
    <div id="weather-info">Weather data not connected</div>
  </section>

  <section>
    <h2>Links</h2>
    <ul class="links-list" id="links-list"></ul>
  </section>

  <section>
    <h2>Notes</h2>
    <textarea id="notes" placeholder="Type notes here..."></textarea>
  </section>

  <script>

    const LINKS = [
      { label: "GitHub", url: "https://github.com" },
      { label: "Gmail", url: "https://mail.google.com" },
      { label: "Calendar", url: "https://calendar.google.com" },
      { label: "Drive", url: "https://drive.google.com" },
      { label: "ChatGPT", url: "https://chat.openai.com" },
      { label: "Claude", url: "https://claude.ai" },
    ];

    const clockEl = document.getElementById( "clock" );
    const dateEl = document.getElementById( "date" );
    const linksEl = document.getElementById( "links-list" );
    const notesEl = document.getElementById( "notes" );

    // Clock
    const updateClock = () => {
      const now = new Date();
      clockEl.textContent = now.toLocaleTimeString( "en-US", {
        hour: "2-digit",
        minute: "2-digit",
        hour12: false,
      } );
      dateEl.textContent = now.toLocaleDateString( "en-US", {
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric",
      } );
    };

    updateClock();
    setInterval( updateClock, 60000 );

    // Links
    linksEl.innerHTML = LINKS.map(
      ( link ) => `<li><a href="${ link.url }" target="_blank" rel="noopener">${ link.label }</a></li>`
    ).join( "" );

    // Notes with localStorage persistence
    const savedNotes = localStorage.getItem( "dashboard-notes" );
    if ( savedNotes !== null ) notesEl.value = savedNotes;

    notesEl.addEventListener( "input", () => {
      localStorage.setItem( "dashboard-notes", notesEl.value );
    } );

  </script>

</body>

</html>
