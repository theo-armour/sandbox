<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="revised" content="2026-05-31 18:43">
  <title>New York Times ~ Latest News</title>
  <link rel="stylesheet" href="widget-base.css">
  <style>
    #news {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .story {
      display: flex;
      align-items: center;
      height: 1.5rem;
      border-bottom: 1px solid var(--panel-border);
      font-size: var(--text-lg);
    }

    .story:last-child {
      border-bottom: none;
    }

    .story a {
      flex: 1;
      min-width: 0;
      color: var(--fg);
      text-decoration: none;
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .story a:hover {
      text-decoration: underline;
    }

    .story-popover {
      position: fixed;
      right: 0.75rem;
      z-index: 10;
      max-width: min(24rem, calc(100vw - 1rem));
      padding: 0.65rem 0.75rem;
      background: var(--bg);
      color: var(--fg);
      border: 1px solid var(--panel-border);
      border-radius: 0.35rem;
      box-shadow: 0 0.35rem 1rem rgb(0 0 0 / 20%);
      font-size: var(--text-sm);
      line-height: 1.35;
      pointer-events: none;
    }

    .story-popover .popover-title {
      font-weight: 700;
    }

    .story-popover .popover-summary {
      margin-top: 0.3rem;
    }

    .story-popover .popover-meta {
      margin-top: 0.3rem;
      color: var(--muted);
    }
    #updated {
      font-size: var(--text-sm);
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    #refreshBtn {
      border: 1px solid var(--panel-border);
      border-radius: 999px;
      padding: 0em 0.7rem;
      font-size: 0.86rem;
    }

    #refreshBtn:disabled {
      opacity: 0.65;
      cursor: wait;
    }
  </style>
</head>

<body class="widget">
  <h2>Latest news</h2>
  <div id="news"><span class="muted">Loading latest news…</span></div>
  <div class="footer">
    <div id="updated" class="muted"></div>
    <button id="refreshBtn" type="button" aria-label="Refresh latest news">Refresh</button>
  </div>

  <div id="story-popover" class="story-popover" role="tooltip" hidden></div>

  <script>
    const newsEl = document.getElementById( "news" );
    const updatedEl = document.getElementById( "updated" );
    const refreshBtnEl = document.getElementById( "refreshBtn" );
    const storyPopoverEl = document.getElementById( "story-popover" );

    const CACHE_KEY = "dashboard-widget-nyt-cache-v2";
    const REFRESH_MS = 15 * 60 * 1000;
    const FEED_URL = "https://rss.nytimes.com/services/xml/rss/nyt/HomePage.xml";
    const MAX_STORIES = 8;

    const readJson = ( key ) => {
      const raw = localStorage.getItem( key );
      if ( raw === null ) return null;
      try {
        return JSON.parse( raw );
      } catch ( err ) {
        return null;
      }
    };

    const escapeHtml = ( value ) => String( value ).replace( /[&<>"']/g, ( char ) => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;",
    })[ char ] );

    const textFromHtml = ( html ) => {
      const doc = new DOMParser().parseFromString( html || "", "text/html" );
      return ( doc.body.textContent || "" ).replace( /\s+/g, " " ).trim();
    };

    const parseFeed = ( xmlText ) => {
      const xml = new DOMParser().parseFromString( xmlText, "application/xml" );
      if ( xml.querySelector( "parsererror" ) ) throw new Error( "invalid feed" );

      return Array.from( xml.querySelectorAll( "item" ) )
        .slice( 0, MAX_STORIES )
        .map( ( item ) => ({
          title: item.querySelector( "title" )?.textContent.trim() || "",
          link: item.querySelector( "link" )?.textContent.trim() || "",
          summary: textFromHtml( item.querySelector( "description" )?.textContent ),
          publishedAt: item.querySelector( "pubDate" )?.textContent.trim() || "",
        }) )
        .filter( ( story ) => story.title && story.link );
    };

    const fetchNews = async () => {
      const res = await fetch( FEED_URL, { cache: "no-store" } );
      if ( !res.ok ) throw new Error( `HTTP ${ res.status }` );
      return parseFeed( await res.text() );
    };

    const formatTime = ( ts ) => new Date( ts ).toLocaleTimeString( "en-US", {
      hour: "2-digit",
      minute: "2-digit",
      hour12: false,
    } );

    const formatStoryDate = ( value ) => {
      const date = new Date( value );
      if ( !value || Number.isNaN( date.getTime() ) ) return "";
      return date.toLocaleString( "en-US", {
        month: "short",
        day: "numeric",
        hour: "numeric",
        minute: "2-digit",
      } );
    };

    const hideStoryPopover = () => {
      storyPopoverEl.hidden = true;
    };

    const showStoryPopover = ( story, linkEl ) => {
      const titleEl = document.createElement( "div" );
      titleEl.className = "popover-title";
      titleEl.textContent = story.title;

      const summaryEl = document.createElement( "div" );
      summaryEl.className = "popover-summary";
      summaryEl.textContent = story.summary || "Open the headline for the full story.";

      storyPopoverEl.replaceChildren( titleEl, summaryEl );
      const published = formatStoryDate( story.publishedAt );
      if ( published ) {
        const metaEl = document.createElement( "div" );
        metaEl.className = "popover-meta";
        metaEl.textContent = `Published ${ published }`;
        storyPopoverEl.appendChild( metaEl );
      }

      storyPopoverEl.hidden = false;
      const linkRect = linkEl.getBoundingClientRect();
      const popoverRect = storyPopoverEl.getBoundingClientRect();
      const margin = 8;
      const belowTop = linkRect.bottom + margin;
      const top = belowTop + popoverRect.height <= window.innerHeight
        ? belowTop
        : Math.max( margin, linkRect.top - popoverRect.height - margin );
      storyPopoverEl.style.left = "auto";
      storyPopoverEl.style.right = `${ margin }px`;
      storyPopoverEl.style.top = `${ top }px`;
    };

    const bindStoryPopovers = ( stories ) => {
      newsEl.querySelectorAll( ".story a" ).forEach( ( linkEl ) => {
        const story = stories[ +linkEl.dataset.storyIndex ];
        linkEl.addEventListener( "mouseenter", () => showStoryPopover( story, linkEl ) );
        linkEl.addEventListener( "mouseleave", hideStoryPopover );
        linkEl.addEventListener( "focus", () => showStoryPopover( story, linkEl ) );
        linkEl.addEventListener( "blur", hideStoryPopover );
      } );
    };

    const render = ( stories, fetchedAt, stale ) => {
      hideStoryPopover();
      if ( stories.length === 0 ) {
        newsEl.innerHTML = `<span class="muted">No latest news available</span>`;
        updatedEl.textContent = "";
        return;
      }
      newsEl.innerHTML = stories
        .map( ( story, i ) => `<div class="story"><a data-story-index="${ i }" href="${ escapeHtml( story.link ) }" target="_blank" rel="noopener">${ escapeHtml( story.title ) }</a></div>` )
        .join( "" );
      bindStoryPopovers( stories );
      const prefix = stale ? "Cached" : "Updated";
      updatedEl.textContent = `${ prefix } ${ formatTime( fetchedAt ) }`;
    };

    const renderError = ( msg ) => {
      hideStoryPopover();
      newsEl.innerHTML = `<span class="muted">${ msg }</span>`;
      updatedEl.textContent = "";
    };

    const refresh = async ( force = false ) => {
      const cached = readJson( CACHE_KEY );
      const fresh = cached && ( Date.now() - cached.ts ) < REFRESH_MS;
      if ( fresh && !force ) {
        render( cached.stories, cached.ts, false );
        return;
      }
      try {
        const stories = await fetchNews();
        const ts = Date.now();
        localStorage.setItem( CACHE_KEY, JSON.stringify( { ts, stories } ) );
        render( stories, ts, false );
      } catch ( err ) {
        if ( cached && cached.stories ) {
          render( cached.stories, cached.ts, true );
        } else {
          renderError( "Unable to load latest news" );
        }
      }
    };

    const refreshNow = async () => {
      refreshBtnEl.disabled = true;
      try {
        await refresh( true );
      } finally {
        refreshBtnEl.disabled = false;
      }
    };

    refresh();
    setInterval( refresh, REFRESH_MS );
    refreshBtnEl.addEventListener( "click", refreshNow );
  </script>
</body>

</html>
