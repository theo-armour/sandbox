<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="widget-base.css">
  <style>
    #news {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .headline {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      height: 1.5rem;
      border-bottom: 1px solid var(--panel-border);
      font-size: var(--text-lg);
    }

    .headline:last-child {
      border-bottom: none;
    }

    .headline .source {
      flex-shrink: 0;
      display: inline-block;
      padding: 0rem 0.45rem;
      border-radius: 999px;
      background: var(--btn-bg);
      font-size: 1rem;
      color: var(--muted);
      white-space: nowrap;
    }

    .headline .title {
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .headline .title a {
      color: var(--fg);
      text-decoration: none;
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .headline .title a:hover {
      text-decoration: underline;
    }

    .headline .ago {
      flex-shrink: 0;
      color: var(--muted);
      font-size: 0.88rem;
      font-variant-numeric: tabular-nums;
    }

    .story-popover {
      position: fixed;
      right: 0.75rem;
      z-index: 10;
      max-width: min(24rem, calc(100vw - 1rem));
      padding: 0.65rem 0.75rem;
      background: var(--bg);
      color: var(--fg);
      border: 1px solid var(--panel-border);
      border-radius: 0.35rem;
      box-shadow: 0 0.35rem 1rem rgb(0 0 0 / 20%);
      font-size: var(--text-sm);
      line-height: 1.35;
      pointer-events: none;
    }

    .story-popover .popover-title {
      font-weight: 700;
    }

    .story-popover .popover-summary {
      margin-top: 0.3rem;
    }

    .story-popover .popover-meta {
      margin-top: 0.3rem;
      color: var(--muted);
    }

    #updated {
      font-size: var(--text-sm);
    }

    .footer {
      margin: 0rem;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0rem;
    }

    #refreshBtn {
      border: 1px solid var(--panel-border);
      border-radius: 999px;
      padding: 0em 0.7rem;
      font-size: 0.86rem;
    }

    #refreshBtn:disabled {
      opacity: 0.65;
      cursor: wait;
    }
  </style>
</head>

<body class="widget">
  <h2>News</h2>
  <div id="news"><span class="muted">Loading headlines…</span></div>
  <div class="footer">
    <div id="updated" class="muted"></div>
    <button id="refreshBtn" type="button" aria-label="Refresh headlines">Refresh</button>
  </div>

  <div id="story-popover" class="story-popover" role="tooltip" hidden></div>

  <script>
    const newsEl = document.getElementById( "news" );
    const updatedEl = document.getElementById( "updated" );
    const refreshBtnEl = document.getElementById( "refreshBtn" );
    const storyPopoverEl = document.getElementById( "story-popover" );

    const CACHE_KEY = "dashboard-widget-news-cache-v2";
    const REFRESH_MS = 15 * 60 * 1000;
    const MAX_HEADLINES = 9;

    // RSS feeds don't send CORS headers, so we fetch through a public proxy
    // that does. Swap this if api.allorigins.win stops working.
    const CORS_PROXY = "https://api.allorigins.win/raw?url=";

    // Edit this list to change what news appears. Any RSS 2.0 or Atom feed works.
    const FEEDS = [
      { name: "BBC", url: "https://feeds.bbci.co.uk/news/world/rss.xml" },
      { name: "NPR", url: "https://feeds.npr.org/1001/rss.xml" },
      { name: "HN", url: "https://hnrss.org/frontpage" },
    ];

    const readJson = ( key ) => {
      const raw = localStorage.getItem( key );
      if ( raw === null ) return null;
      try {
        return JSON.parse( raw );
      } catch ( err ) {
        return null;
      }
    };

    const escapeHtml = ( s ) => s
      .replace( /&/g, "&amp;" )
      .replace( /</g, "&lt;" )
      .replace( />/g, "&gt;" )
      .replace( /"/g, "&quot;" );

    const textFromHtml = ( html ) => {
      const doc = new DOMParser().parseFromString( html || "", "text/html" );
      return ( doc.body.textContent || "" ).replace( /\s+/g, " " ).trim();
    };

    // Handles both RSS 2.0 (<item>) and Atom (<entry>) feeds.
    const parseFeed = ( xml ) => {
      const doc = new DOMParser().parseFromString( xml, "application/xml" );
      const items = [ ...doc.getElementsByTagName( "item" ) ];
      if ( items.length > 0 ) {
        return items.map( ( item ) => ( {
          title: item.querySelector( "title" )?.textContent?.trim() || "",
          link: item.querySelector( "link" )?.textContent?.trim() || "",
          summary: textFromHtml( item.querySelector( "description" )?.textContent ),
          pubDate: new Date(
            item.querySelector( "pubDate" )?.textContent || Date.now()
          ).getTime(),
        } ) );
      }
      const entries = [ ...doc.getElementsByTagName( "entry" ) ];
      return entries.map( ( entry ) => ( {
        title: entry.querySelector( "title" )?.textContent?.trim() || "",
        link: entry.querySelector( "link" )?.getAttribute( "href" ) || "",
        summary: textFromHtml( entry.querySelector( "summary, content" )?.textContent ),
        pubDate: new Date(
          entry.querySelector( "updated, published" )?.textContent || Date.now()
        ).getTime(),
      } ) );
    };

    const fetchFeed = async ( feed ) => {
      const url = CORS_PROXY + encodeURIComponent( feed.url );
      const res = await fetch( url );
      if ( !res.ok ) throw new Error( `HTTP ${ res.status }` );
      const xml = await res.text();
      return parseFeed( xml ).map( ( item ) => ( { ...item, source: feed.name } ) );
    };

    const formatAgo = ( ts ) => {
      const secs = ( Date.now() - ts ) / 1000;
      if ( secs < 60 ) return "now";
      const mins = Math.floor( secs / 60 );
      if ( mins < 60 ) return `${ mins }m`;
      const hours = Math.floor( mins / 60 );
      if ( hours < 24 ) return `${ hours }h`;
      const days = Math.floor( hours / 24 );
      if ( days < 7 ) return `${ days }d`;
      return new Date( ts ).toLocaleDateString( "en-US", {
        month: "short",
        day: "numeric",
      } );
    };

    const formatTime = ( date ) => date.toLocaleTimeString( "en-US", {
      hour: "2-digit",
      minute: "2-digit",
      hour12: false,
    } );

    const formatStoryDate = ( ts ) => {
      const date = new Date( ts );
      if ( Number.isNaN( date.getTime() ) ) return "";
      return date.toLocaleString( "en-US", {
        month: "short",
        day: "numeric",
        hour: "numeric",
        minute: "2-digit",
      } );
    };

    const hideStoryPopover = () => {
      storyPopoverEl.hidden = true;
    };

    const showStoryPopover = ( story, linkEl ) => {
      const titleEl = document.createElement( "div" );
      titleEl.className = "popover-title";
      titleEl.textContent = story.title;

      const summaryEl = document.createElement( "div" );
      summaryEl.className = "popover-summary";
      summaryEl.textContent = story.summary || "Open the headline for the full story.";

      storyPopoverEl.replaceChildren( titleEl, summaryEl );
      const published = formatStoryDate( story.pubDate );
      const metaEl = document.createElement( "div" );
      metaEl.className = "popover-meta";
      metaEl.textContent = [ story.source, published ].filter( Boolean ).join( " · " );
      storyPopoverEl.appendChild( metaEl );

      storyPopoverEl.hidden = false;
      const linkRect = linkEl.getBoundingClientRect();
      const popoverRect = storyPopoverEl.getBoundingClientRect();
      const margin = 8;
      const belowTop = linkRect.bottom + margin;
      const top = belowTop + popoverRect.height <= window.innerHeight
        ? belowTop
        : Math.max( margin, linkRect.top - popoverRect.height - margin );
      storyPopoverEl.style.left = "auto";
      storyPopoverEl.style.right = `${ margin }px`;
      storyPopoverEl.style.top = `${ top }px`;
    };

    const bindStoryPopovers = ( items ) => {
      newsEl.querySelectorAll( ".headline a" ).forEach( ( linkEl ) => {
        const story = items[ +linkEl.dataset.storyIndex ];
        linkEl.addEventListener( "mouseenter", () => showStoryPopover( story, linkEl ) );
        linkEl.addEventListener( "mouseleave", hideStoryPopover );
        linkEl.addEventListener( "focus", () => showStoryPopover( story, linkEl ) );
        linkEl.addEventListener( "blur", hideStoryPopover );
      } );
    };

    const render = ( items, fetchedAt, stale ) => {
      hideStoryPopover();
      if ( items.length === 0 ) {
        newsEl.innerHTML = `<span class="muted">No headlines available</span>`;
        updatedEl.textContent = "";
        return;
      }
      const top = items
        .slice()
        .sort( ( a, b ) => b.pubDate - a.pubDate )
        .slice( 0, MAX_HEADLINES );
      newsEl.innerHTML = top.map( ( h, i ) => `
        <div class="headline">
          <span class="source">${ escapeHtml( h.source ) }</span>
          <span class="title"><a data-story-index="${ i }" href="${ escapeHtml( h.link ) }" target="_blank" rel="noopener">${ escapeHtml( h.title ) }</a></span>
          <span class="ago">${ formatAgo( h.pubDate ) }</span>
        </div>
      ` ).join( "" );
      bindStoryPopovers( top );
      const prefix = stale ? "Cached" : "Updated";
      updatedEl.textContent = `${ prefix } ${ formatTime( new Date( fetchedAt ) ) }`;
    };

    const renderError = ( msg ) => {
      hideStoryPopover();
      newsEl.innerHTML = `<span class="muted">${ msg }</span>`;
      updatedEl.textContent = "";
    };

    const refresh = async ( force = false ) => {
      const cached = readJson( CACHE_KEY );
      const fresh = cached && ( Date.now() - cached.ts ) < REFRESH_MS;
      if ( fresh && !force ) {
        render( cached.items, cached.ts, false );
        return;
      }
      try {
        const results = await Promise.allSettled( FEEDS.map( fetchFeed ) );
        const items = results.flatMap( ( r ) =>
          r.status === "fulfilled" ? r.value : []
        );
        if ( items.length === 0 ) throw new Error( "no items" );
        const ts = Date.now();
        localStorage.setItem( CACHE_KEY, JSON.stringify( { ts, items } ) );
        render( items, ts, false );
      } catch ( err ) {
        if ( cached && cached.items ) {
          render( cached.items, cached.ts, true );
        } else {
          renderError( "Unable to load headlines" );
        }
      }
    };

    const refreshNow = async () => {
      refreshBtnEl.disabled = true;
      try {
        await refresh( true );
      } finally {
        refreshBtnEl.disabled = false;
      }
    };

    refresh();
    setInterval( refresh, REFRESH_MS );
    refreshBtnEl.addEventListener( "click", refreshNow );
  </script>
</body>

</html>
