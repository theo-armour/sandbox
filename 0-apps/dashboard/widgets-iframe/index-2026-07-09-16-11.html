<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="revised" content="2026-05-31 18:43">
  <title>Dashboard ~ iframe widgets</title>
  <link rel="icon" href="../favicon-dashboard.svg" type="image/svg+xml">
  <style>
    :root {
      --bg: #ffffff;
      --fg: #000000;
      --panel-border: #d2d2d7;
      --font: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1e;
        --fg: #ffffff;
        --panel-border: #3a3a3c;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font);
      padding: clamp(0.1rem, 3vw, 0.5rem);
    }

    .dashboard-grid {
      display: grid;
      gap: clamp(0.75rem, 3vw, 0.1rem);
      grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr));
      align-items: start;
    }

    .tile {
      border: 1px solid var(--panel-border);
      border-radius: 0.75rem;
      overflow: hidden;
      background: var(--bg);
    }

    .tile iframe {
      display: block;
      width: 100%;
      border: none;
      background: transparent;
    }

    .tile-wide {
      grid-column: span 2;
    }

    @media (max-width: 700px) {
      .tile-wide {
        grid-column: span 1;
      }
    }
  </style>
</head>

<body>
  <main class="dashboard-grid" id="dashboard-grid"></main>

  <script>
    const LOCATION_KEY = "dashboard-location";
    const LOCATION_MESSAGE = "dashboard-location-update";
    const LOCATION_ATTEMPTED_KEY = "dashboard-location-attempted";

    const readSavedLocation = () => {
      const raw = localStorage.getItem( LOCATION_KEY );
      if ( raw === null ) return null;
      try {
        const saved = JSON.parse( raw );
        if ( typeof saved.lat === "number" && typeof saved.lon === "number" ) {
          return { lat: saved.lat, lon: saved.lon };
        }
      } catch ( err ) {
        // Ignore malformed saved location data.
      }
      return null;
    };

    const broadcastLocation = ( coords ) => {
      document.querySelectorAll( "#dashboard-grid iframe" ).forEach( ( frame ) => {
        if ( frame.contentWindow ) {
          frame.contentWindow.postMessage(
            { type: LOCATION_MESSAGE, coords }, "*"
          );
        }
      } );
    };

    const requestLocation = () => {
      if ( !navigator.geolocation || readSavedLocation() ) return;
      if ( sessionStorage.getItem( LOCATION_ATTEMPTED_KEY ) === "1" ) return;
      sessionStorage.setItem( LOCATION_ATTEMPTED_KEY, "1" );

      navigator.geolocation.getCurrentPosition(
        ( position ) => {
          const coords = {
            lat: position.coords.latitude,
            lon: position.coords.longitude,
          };
          localStorage.setItem( LOCATION_KEY, JSON.stringify( coords ) );
          broadcastLocation( coords );
        },
        () => { },
        { timeout: 5000, maximumAge: 86400000 }
      );
    };

    // One config entry per widget. Add, remove, reorder here.
    const WIDGETS = [
      { id: "teodoro", src: "widget-teodoro.html", height: 220, label: "Teodoro activity timer" },
      { id: "clock", src: "widget-clock.html", height: 220, label: "Clock and date" },
      { id: "weather", src: "widget-weather.html", height: 220, label: "Current weather" },
      { id: "calendar", src: "widget-calendar.html", height: 240, label: "Calendar"},
      { id: "notes", src: "widget-notes.html", height: 220, label: "Notes & spark"},
      { id: "github", src: "widget-github.html", height: 220, label: "Service status" },
      { id: "today", src: "widget-today.html", height: 240, label: "Today's news", wide: true },
      { id: "wikinews", src: "widget-wikinews.html", height: 240, label: "New York Times: Latest news", wide: true },

      { id: "links", src: "widget-links.html", height: 170, label: "Quick links" },
    ];

    const gridEl = document.getElementById( "dashboard-grid" );

    const createTile = ( widget ) => {
      const tile = document.createElement( "div" );
      tile.className = widget.wide ? "tile tile-wide" : "tile";

      const frame = document.createElement( "iframe" );
      frame.src = widget.src;
      frame.title = widget.label || widget.id;
      frame.loading = "lazy";
      frame.style.height = `${ widget.height }px`;
      if ( widget.allow ) frame.allow = widget.allow;

      tile.appendChild( frame );
      return tile;
    };

    WIDGETS.forEach( ( widget ) => {
      gridEl.appendChild( createTile( widget ) );
    } );

    requestLocation();
  </script>
</body>

</html>
