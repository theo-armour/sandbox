<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="widget-base.css">
  <style>
    ol {
      margin-left: 1.25rem;
      display: grid;
      gap: 0.35rem;
    }

    li::marker {
      color: var(--accent);
      font-weight: 700;
    }
  </style>
</head>

<body>
  <h2>Top 3</h2>
  <ol id="focus-list"></ol>

  <script>
    const FOCUS_ITEMS = [
      "Finish dashboard layout",
      "Check the agenda files",
      "Take a walk before dinner",
    ];

    document.getElementById( "focus-list" ).innerHTML = FOCUS_ITEMS
      .map( ( item ) => `<li>${ item }</li>` )
      .join( "" );
  </script>
</body>

</html>
