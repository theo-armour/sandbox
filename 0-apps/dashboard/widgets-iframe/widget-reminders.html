<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reminders</title>
  <link rel="stylesheet" href="widget-base.css">
  <style>
    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      font-size: var(--text-sm);
    }

    #message {
      width: 100%;
      flex: 1;
      min-height: 0;
      border: none;
      background: var(--bg);
      color: var(--fg);
      padding: 0.5rem;
      overflow: auto;
      overflow-wrap: anywhere;
      font-family: var(--font);
      font-size: var(--text-lg);
      font-weight: 400;
      line-height: 1.45;
    }

    /* Rendered Markdown. widget-base.css hides h2 and zeroes all margins,
       so headings, lists and paragraphs get their spacing back here. */
    #message h1,
    #message h2,
    #message h3,
    #message h4 {
      display: block;
      font-size: 1em;
      font-weight: 700;
      margin-top: 0.6rem;
    }

    #message h1 {
      font-size: 1.15em;
    }

    #message h2 {
      font-size: 1.08em;
    }

    #message > :first-child {
      margin-top: 0;
    }

    #message ul {
      padding-left: 1.3rem;
    }

    #message p {
      margin-top: 0.3rem;
    }

    #message code {
      background: var(--btn-bg);
      border-radius: 0.2rem;
      padding: 0 0.25rem;
    }
  </style>
</head>

<body class="widget">
  <div id="message" aria-label="Agenda reminders">Loading reminders...</div>
  <footer>
    <a id="message-link" target="_blank" rel="noopener">Reminders</a>
    <button id="reload">Reload</button>
  </footer>

  <script>
    const REMINDER_FILE = "0-agenda-reminders.md";
    const REMINDER_URL = `reminders/${ REMINDER_FILE }`;
    const NOTESY = "../../notesy/notesy.html#";
    const GITHUB_FOLDER = "https://api.github.com/repos/theo-armour/sandbox/contents/0-apps/dashboard/widgets-iframe/reminders/";

    const message = document.getElementById( "message" );
    const messageLink = document.getElementById( "message-link" );

    message.title = "Agenda reminders";
    messageLink.textContent = "Agenda reminders";
    messageLink.href = NOTESY + GITHUB_FOLDER + REMINDER_FILE;
    messageLink.title = "Edit these reminders in Notesy";
    const reload = document.getElementById( "reload" );
    let timedHeadings = [];
    let currentHeading = null;

    // Use circular distance so midnight reminders are near late-evening times.
    const scrollToNearestReminder = () => {
      if ( document.visibilityState !== "visible" || !timedHeadings.length ) return;
      const now = new Date();
      const minutes = now.getHours() * 60 + now.getMinutes();
      const distance = ( heading ) => {
        const difference = Math.abs( heading.minutes - minutes );
        return Math.min( difference, 1440 - difference );
      };
      const nearest = timedHeadings.reduce( ( best, heading ) =>
        distance( heading ) < distance( best ) ? heading : best
      );
      if ( nearest === currentHeading ) return;
      currentHeading = nearest;
      message.scrollTop += nearest.element.getBoundingClientRect().top
        - message.getBoundingClientRect().top - parseFloat( getComputedStyle( message ).paddingTop );
    };

    const escapeHtml = ( text ) => text
      .replace( /&/g, "&amp;" )
      .replace( /</g, "&lt;" )
      .replace( />/g, "&gt;" )
      .replace( /"/g, "&quot;" );

    // Markdown inside a line: **bold**, *italic*, `code`, [text](url).
    const inlineMarkdown = ( text ) => escapeHtml( text )
      .replace( /`(.+?)`/g, "<code>$1</code>" )
      .replace( /\*\*(\S.*?)\*\*/g, "<strong>$1</strong>" )
      .replace( /\*(\S.*?)\*/g, "<em>$1</em>" )
      .replace( /\[(.+?)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>' );

    // A small Markdown reader: # headings, * or - bullets, and paragraphs.
    const displayReminders = ( text ) => {
      const fragment = document.createDocumentFragment();
      let list = null; // the <ul> being filled, if the previous line was a bullet

      text.split( "\n" ).forEach( ( line ) => {
        const heading = line.match( /^(#{1,6})\s+(.*)/ );
        const bullet = line.match( /^\s*[*-]\s+(.*)/ );
        if ( !bullet ) list = null;

        if ( heading ) {
          const element = document.createElement( `h${ heading[ 1 ].length }` );
          element.innerHTML = inlineMarkdown( heading[ 2 ] );
          fragment.append( element );
          const time = line.match( /^##\s+.*?~.*?\b(1[0-2]|0?[1-9]):([0-5]\d)\s*(am|pm)\b/i );
          if ( time ) {
            const hour = Number( time[ 1 ] ) % 12 + ( time[ 3 ].toLowerCase() === "pm" ? 12 : 0 );
            timedHeadings.push( { element, minutes: hour * 60 + Number( time[ 2 ] ) } );
          }
        } else if ( bullet ) {
          if ( !list ) {
            list = document.createElement( "ul" );
            fragment.append( list );
          }
          const item = document.createElement( "li" );
          item.innerHTML = inlineMarkdown( bullet[ 1 ] );
          list.append( item );
        } else if ( line.trim() ) {
          const paragraph = document.createElement( "p" );
          paragraph.innerHTML = inlineMarkdown( line );
          fragment.append( paragraph );
        }
      } );

      message.replaceChildren( fragment );
      scrollToNearestReminder();
    };

    const loadReminder = async () => {
      reload.disabled = true;
      timedHeadings = [];
      currentHeading = null;
      message.textContent = "Loading reminders...";
      try {
        const response = await fetch( REMINDER_URL, { cache: "no-store" } );
        if ( !response.ok ) throw new Error( `HTTP ${ response.status }` );
        displayReminders( await response.text() );
      } catch ( error ) {
        console.error( "Unable to load agenda reminders:", error );
        message.textContent = `Unable to load ${ REMINDER_FILE }: ${ error.message }`;
      } finally {
        reload.disabled = false;
      }
    };

    reload.addEventListener( "click", loadReminder );
    document.addEventListener( "visibilitychange", scrollToNearestReminder );
    setInterval( scrollToNearestReminder, 60000 );
    loadReminder();
  </script>
</body>

</html>
