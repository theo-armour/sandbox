<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="widget-base.css">
  <style>
    textarea {
      width: 100%;
      flex: 1;
      min-height: 6rem;
      resize: vertical;
      background: var(--btn-bg);
      color: var(--fg);
      border: none;
      border-radius: 0.3rem;
      padding: 0.5rem;
      font-family: var(--font);
      font-size: clamp(0.95rem, 2.3vw, 1.05rem);
      line-height: 1.4;
    }

    textarea:focus {
      outline: 2px solid var(--muted);
    }
  </style>
</head>

<body>
  <h2>Notes</h2>
  <textarea id="notes" placeholder="Type notes here..."></textarea>

  <script>
    // Scoped storage key so this widget does not collide with others.
    const STORAGE_KEY = "dashboard-widget-notes";
    const notesEl = document.getElementById( "notes" );

    const saved = localStorage.getItem( STORAGE_KEY );
    if ( saved !== null ) notesEl.value = saved;

    notesEl.addEventListener( "input", () => {
      localStorage.setItem( STORAGE_KEY, notesEl.value );
    } );
  </script>
</body>

</html>
