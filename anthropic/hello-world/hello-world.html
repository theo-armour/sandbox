<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World ✨</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      overflow: hidden;
    }

    .container {
      text-align: center;
      z-index: 10;
    }

    h1 {
      font-size: 4rem;
      color: white;
      text-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
      margin-bottom: 1rem;
      animation: fadeInUp 0.8s ease-out;
    }

    .emoji {
      display: inline-block;
      animation: wave 1s ease-in-out infinite;
      transform-origin: 70% 70%;
    }

    button {
      font-size: 1.2rem;
      padding: 1rem 2rem;
      background: white;
      color: #667eea;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
      transition: all 0.3s ease;
      animation: fadeInUp 1s ease-out;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
    }

    button:active {
      transform: translateY(0);
    }

    .sparkle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: white;
      border-radius: 50%;
      pointer-events: none;
      animation: sparkleFloat 2s ease-out forwards;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes wave {

      0%,
      100% {
        transform: rotate(0deg);
      }

      25% {
        transform: rotate(20deg);
      }

      75% {
        transform: rotate(-20deg);
      }
    }

    @keyframes sparkleFloat {
      0% {
        opacity: 1;
        transform: translateY(0) scale(0);
      }

      50% {
        opacity: 1;
        transform: translateY(-100px) scale(1);
      }

      100% {
        opacity: 0;
        transform: translateY(-200px) scale(0);
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Hello World <span class="emoji">👋</span></h1>
    <button onclick="createSparkles()">Click Me!</button>
  </div>

  <script>
    const messages = [ 'Awesome! 🎉', 'You Rock! 🌟', 'Amazing! 🚀', 'Fantastic! ✨', 'Brilliant! 💫' ];
    let messageIndex = 0;

    const createSparkles = () => {
      const colors = [ '#fff', '#ffd700', '#ff69b4', '#00ffff', '#98fb98' ];
      const h1 = document.querySelector( 'h1' );
      const btn = document.querySelector( 'button' );

      // Change message
      messageIndex = ( messageIndex + 1 ) % messages.length;
      h1.innerHTML = `${ messages[ messageIndex ] } <span class="emoji">👋</span>`;

      // Pulse button
      btn.style.transform = 'scale(1.1)';
      setTimeout( () => btn.style.transform = 'scale(1)', 200 );

      // Create sparkles
      for ( let i = 0; i < 20; i++ ) {
        setTimeout( () => {
          const sparkle = document.createElement( 'div' );
          sparkle.className = 'sparkle';
          sparkle.style.left = `${ Math.random() * 100 }%`;
          sparkle.style.top = `${ Math.random() * 100 }%`;
          sparkle.style.background = colors[ Math.floor( Math.random() * colors.length ) ];
          sparkle.style.animationDelay = `${ Math.random() * 0.5 }s`;
          document.body.appendChild( sparkle );

          setTimeout( () => sparkle.remove(), 2000 );
        }, i * 50 );
      }
    };

    // Sparkle on load - wait longer so "Hello World" stays visible
    setTimeout( createSparkles, 3000 );
  </script>
</body>

</html>
