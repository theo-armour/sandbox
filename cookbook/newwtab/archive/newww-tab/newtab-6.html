<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  :root {
    --bg: #f5f3ef;
    --card: #ffffff;
    --text: #1a1a1a;
    --text-mid: #555;
    --text-light: #999;
    --accent: #b85a3a;
    --rule: #d4d0ca;
    --rule-heavy: #1a1a1a;
    --hover-bg: rgba(184,90,58,0.06);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'JetBrains Mono', monospace;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 15px;
  }

  /* Top bar */
  .topbar {
    position: sticky; top: 0; z-index: 50;
    background: var(--bg);
    border-bottom: 2px solid var(--rule-heavy);
    padding: 10px 24px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px;
  }
  .topbar-left {
    display: flex; align-items: baseline; gap: 16px;
  }
  .topbar h1 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.3rem; font-weight: 700;
    letter-spacing: -0.02em;
    text-transform: uppercase;
  }
  .topbar .date {
    font-size: 0.82rem; color: var(--text-mid);
    font-weight: 400;
    text-transform: uppercase; letter-spacing: 0.06em;
  }
  .topbar-right {
    display: flex; align-items: center; gap: 8px;
  }
  .search-box {
    display: flex; align-items: center;
    border: 1px solid var(--rule); border-radius: 4px;
    padding: 4px 8px; gap: 6px; background: var(--card);
  }
  .search-box input {
    border: none; outline: none; background: transparent;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem; color: var(--text); width: 180px;
  }
  .search-box input::placeholder { color: var(--text-light); }
  .search-box svg { color: var(--text-light); flex-shrink: 0; }
  .btn {
    padding: 5px 12px; border-radius: 3px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8rem; font-weight: 500;
    cursor: pointer; border: 1px solid var(--rule);
    background: var(--card); color: var(--text-mid);
    transition: all 0.12s;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn-accent { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-accent:hover { background: #a04e30; color: #fff; }

  /* Newspaper columns */
  .columns {
    padding: 12px 16px 40px;
    column-count: 8;
    column-width: 100px;
    column-gap: 18px;
    column-rule: 1px solid var(--rule);
  }

  /* Category block */
  .cat-block {
    break-inside: avoid;
    margin-bottom: 10px;
    page-break-inside: avoid;
  }
  .cat-head {
    display: flex; align-items: center; gap: 5px;
    padding: 0 0 4px;
    border-bottom: 1.5px solid var(--rule-heavy);
    margin-bottom: 4px;
    cursor: pointer;
    user-select: none;
  }
  .cat-toggle {
    font-size: 0.55rem; color: var(--text-light);
    transition: transform 0.2s;
    margin-right: 1px;
  }
  .cat-block.collapsed .cat-toggle { transform: rotate(-90deg); }
  .cat-block.collapsed .link-list,
  .cat-block.collapsed .add-row { display: none; }
  .cat-block.collapsed .cat-head { margin-bottom: 0; border-bottom-color: var(--rule); }
  .cat-emoji { font-size: 0.85rem; }
  .cat-name {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem; font-weight: 700;
    letter-spacing: -0.01em;
    text-transform: uppercase;
    flex: 1;
  }
  .cat-actions {
    display: flex; gap: 2px; opacity: 0;
    transition: opacity 0.12s;
  }
  .cat-block:hover .cat-actions { opacity: 1; }
  .cat-btn {
    background: none; border: none; cursor: pointer;
    font-size: 0.75rem; color: var(--text-light);
    padding: 1px 4px; border-radius: 2px;
    font-family: 'JetBrains Mono', monospace;
  }
  .cat-btn:hover { color: var(--accent); background: var(--hover-bg); }
  .cat-btn.danger:hover { color: #c44; }

  /* Link rows */
  .link-list { list-style: none; }
  .link-row {
    display: block;
  }
  .link-row a {
    display: flex; align-items: center; gap: 6px;
    padding: 3px 4px;
    text-decoration: none; color: var(--text);
    border-radius: 3px;
    transition: background 0.1s;
  }
  .link-row a:hover {
    background: var(--hover-bg);
  }
  .link-row .le { font-size: 0.85rem; flex-shrink: 0; width: 18px; text-align: center; }
  .link-row .ln {
    font-size: 0.88rem; font-weight: 400;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    line-height: 1.5;
  }
  .link-row a:hover .ln { color: var(--accent); }

  .add-row {
    padding: 2px 4px; margin-top: 1px;
  }
  .add-row button {
    background: none; border: none; cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.78rem; color: var(--text-light);
    padding: 1px 4px; border-radius: 2px;
  }
  .add-row button:hover { color: var(--accent); }

  .no-results {
    text-align: center; padding: 60px;
    color: var(--text-light); font-size: 0.85rem;
    column-span: all;
  }

  /* Modal */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(26,26,26,0.15);
    backdrop-filter: blur(4px);
    z-index: 100; align-items: center; justify-content: center;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: var(--card); border-radius: 8px;
    padding: 24px; width: 90%; max-width: 340px;
    box-shadow: 0 12px 40px rgba(26,26,26,0.15);
  }
  .modal h2 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.1rem; font-weight: 700; margin-bottom: 16px;
    text-transform: uppercase;
  }
  .fld { margin-bottom: 12px; }
  .fld label {
    font-size: 0.72rem; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--text-mid); display: block; margin-bottom: 3px;
  }
  .fld input, .fld select {
    width: 100%; padding: 7px 8px;
    border: 1px solid var(--rule); border-radius: 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.88rem; color: var(--text);
    background: var(--bg); outline: none;
  }
  .fld input:focus, .fld select:focus { border-color: var(--accent); }
  .modal-act { display: flex; gap: 6px; justify-content: flex-end; margin-top: 16px; }

  /* Context menu */
  .ctx {
    display: none; position: fixed;
    background: var(--card); border: 1px solid var(--rule);
    border-radius: 6px; padding: 3px;
    box-shadow: 0 4px 16px rgba(26,26,26,0.1);
    z-index: 200; min-width: 110px;
  }
  .ctx.active { display: block; }
  .ctx button {
    display: block; width: 100%; padding: 6px 10px;
    background: none; border: none;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.82rem; color: var(--text);
    cursor: pointer; border-radius: 4px; text-align: left;
  }
  .ctx button:hover { background: var(--bg); }
  .ctx button.danger { color: #c44; }
  .ctx-div { height: 1px; background: var(--rule); margin: 2px 4px; }

  /* Responsive columns */
  @media (max-width: 1400px) { .columns { column-count: 7; } }
  @media (max-width: 1100px) { .columns { column-count: 5; } }
  @media (max-width: 800px)  { .columns { column-count: 4; column-gap: 14px; } }
  @media (max-width: 500px)  {
    .columns { column-count: 1; }
    .topbar { flex-wrap: wrap; }
    .search-box input { width: 120px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <h1 id="greeting-text"></h1>
    <span class="date" id="date-text"></span>
  </div>
  <div class="topbar-right">
    <div class="search-box">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="search-input" placeholder="Filter links... ⌘K" />
    </div>
    <button class="btn" onclick="expandAll()">Expand all</button>
    <button class="btn" onclick="collapseAll()">Collapse all</button>
    <button class="btn" onclick="openCatModal()">+ Category</button>
    <button class="btn btn-accent" onclick="openLinkModal()">+ Link</button>
  </div>
</div>

<div class="columns" id="columns"></div>

<div class="modal-overlay" id="link-modal">
  <div class="modal">
    <h2 id="lm-title">Add Link</h2>
    <div class="fld"><label>Name</label><input type="text" id="lm-name" placeholder="YouTube" /></div>
    <div class="fld"><label>URL</label><input type="text" id="lm-url" placeholder="youtube.com" /></div>
    <div class="fld"><label>Icon</label><input type="text" id="lm-emoji" placeholder="🎬" maxlength="4" /></div>
    <div class="fld"><label>Category</label><select id="lm-cat"></select></div>
    <div class="modal-act">
      <button class="btn" onclick="closeModal('link-modal')">Cancel</button>
      <button class="btn btn-accent" id="lm-save" onclick="saveLink()">Add</button>
    </div>
  </div>
</div>
<div class="modal-overlay" id="cat-modal">
  <div class="modal">
    <h2 id="cm-title">Add Category</h2>
    <div class="fld"><label>Name</label><input type="text" id="cm-name" placeholder="Design Tools" /></div>
    <div class="fld"><label>Icon</label><input type="text" id="cm-emoji" placeholder="🎨" maxlength="4" /></div>
    <div class="modal-act">
      <button class="btn" onclick="closeModal('cat-modal')">Cancel</button>
      <button class="btn btn-accent" id="cm-save" onclick="saveCat()">Add</button>
    </div>
  </div>
</div>
<div class="ctx" id="ctx">
  <button onclick="ctxEdit()">Edit</button>
  <button onclick="ctxTop()">Move to top</button>
  <div class="ctx-div"></div>
  <button class="danger" onclick="ctxDel()">Remove</button>
</div>

let D,eLI=-1,eCI=null,cI=-1;
function load(){try{const s=localStorage.getItem(SK);D=s?JSON.parse(s):JSON.parse(JSON.stringify(DD))}catch{D=JSON.parse(JSON.stringify(DD))}}
function sv(){localStorage.setItem(SK,JSON.stringify(D))}
function h(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}

function setG(){
  const hr=new Date().getHours();
  document.getElementById('greeting-text').textContent=hr<12?'Good Morning':hr<17?'Good Afternoon':'Good Evening';
  document.getElementById('date-text').textContent=new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
}

function render(f=''){
  const box=document.getElementById('columns');box.innerHTML='';
  const q=f.toLowerCase().trim();let any=false;

  D.categories.forEach(cat=>{
    let cl=D.links.filter(l=>l.catId===cat.id);
    if(q)cl=cl.filter(l=>l.name.toLowerCase().includes(q)||l.url.toLowerCase().includes(q)||cat.name.toLowerCase().includes(q));
    if(q&&cl.length===0)return;
    any=true;

    const block=document.createElement('div');
    block.className='cat-block'+(D.collapsed[cat.id]?' collapsed':'');
    block.innerHTML=`<div class="cat-head"><span class="cat-toggle">▼</span><span class="cat-emoji">${cat.emoji}</span><span class="cat-name">${h(cat.name)}</span><div class="cat-actions"><button class="cat-btn" data-a="add">+add</button><button class="cat-btn" data-a="edit">edit</button><button class="cat-btn danger" data-a="del">×</button></div></div><ul class="link-list"></ul><div class="add-row"><button>+ add link</button></div>`;
    box.appendChild(block);

    block.querySelector('.cat-head').addEventListener('click',e=>{
      if(e.target.closest('.cat-actions'))return;
      D.collapsed[cat.id]=!D.collapsed[cat.id];sv();render(document.getElementById('search-input').value);
    });

    block.querySelector('[data-a="add"]').addEventListener('click',()=>openLinkModal(-1,cat.id));
    block.querySelector('[data-a="edit"]').addEventListener('click',()=>openCatModal(cat.id));
    block.querySelector('[data-a="del"]').addEventListener('click',()=>{if(confirm('Remove "'+cat.name+'"?')){D.links=D.links.filter(l=>l.catId!==cat.id);D.categories=D.categories.filter(c=>c.id!==cat.id);sv();render(document.getElementById('search-input').value)}});
    block.querySelector('.add-row button').addEventListener('click',()=>openLinkModal(-1,cat.id));

    const ul=block.querySelector('.link-list');
    cl.forEach(lk=>{
      const gi=D.links.indexOf(lk);
      const li=document.createElement('li');li.className='link-row';
      li.innerHTML=`<a href="${lk.url.startsWith('http')?lk.url:'https://'+lk.url}"><span class="le">${lk.emoji||'🔗'}</span><span class="ln">${h(lk.name.length>15?lk.name.slice(0,15):lk.name)}</span></a>`;
      li.addEventListener('contextmenu',e=>{e.preventDefault();showCtx(e.clientX,e.clientY,gi)});
      ul.appendChild(li);
    });
  });
  if(!any)box.innerHTML='<div class="no-results">No matches found.</div>';
}

document.getElementById('search-input').addEventListener('input',e=>render(e.target.value));

function expandAll(){D.categories.forEach(c=>D.collapsed[c.id]=false);sv();render(document.getElementById('search-input').value)}
function collapseAll(){D.categories.forEach(c=>D.collapsed[c.id]=true);sv();render(document.getElementById('search-input').value)}

function showCtx(x,y,i){cI=i;const m=document.getElementById('ctx');m.style.left=Math.min(x,innerWidth-130)+'px';m.style.top=Math.min(y,innerHeight-100)+'px';m.classList.add('active')}
function hideCtx(){document.getElementById('ctx').classList.remove('active')}
function ctxEdit(){hideCtx();openLinkModal(cI)}
function ctxTop(){hideCtx();if(cI>=0){const lk=D.links[cI];D.links.splice(cI,1);const f=D.links.findIndex(l=>l.catId===lk.catId);D.links.splice(f>=0?f:0,0,lk);sv();render(document.getElementById('search-input').value)}}
function ctxDel(){hideCtx();if(cI>=0){D.links.splice(cI,1);sv();render(document.getElementById('search-input').value)}}

function openLinkModal(i=-1,pc=null){
  eLI=i;const cs=document.getElementById('lm-cat');
  cs.innerHTML=D.categories.map(c=>'<option value="'+c.id+'">'+c.emoji+' '+h(c.name)+'</option>').join('');
  if(i>=0){const l=D.links[i];document.getElementById('lm-title').textContent='Edit Link';document.getElementById('lm-save').textContent='Save';document.getElementById('lm-name').value=l.name;document.getElementById('lm-url').value=l.url;document.getElementById('lm-emoji').value=l.emoji||'';cs.value=l.catId}
  else{document.getElementById('lm-title').textContent='Add Link';document.getElementById('lm-save').textContent='Add';document.getElementById('lm-name').value='';document.getElementById('lm-url').value='';document.getElementById('lm-emoji').value='';if(pc)cs.value=pc}
  document.getElementById('link-modal').classList.add('active');setTimeout(()=>document.getElementById('lm-name').focus(),80);
}
function saveLink(){
  const n=document.getElementById('lm-name').value.trim();let u=document.getElementById('lm-url').value.trim();const e=document.getElementById('lm-emoji').value.trim()||'🔗';const c=document.getElementById('lm-cat').value;
  if(!n||!u)return;if(!u.startsWith('http'))u='https://'+u;
  if(eLI>=0)D.links[eLI]={name:n,url:u,emoji:e,catId:c};else D.links.push({name:n,url:u,emoji:e,catId:c});
  sv();render(document.getElementById('search-input').value);closeModal('link-modal');
}
function openCatModal(id=null){
  eCI=id;
  if(id){const c=D.categories.find(x=>x.id===id);document.getElementById('cm-title').textContent='Edit Category';document.getElementById('cm-save').textContent='Save';document.getElementById('cm-name').value=c.name;document.getElementById('cm-emoji').value=c.emoji||''}
  else{document.getElementById('cm-title').textContent='Add Category';document.getElementById('cm-save').textContent='Add';document.getElementById('cm-name').value='';document.getElementById('cm-emoji').value=''}
  document.getElementById('cat-modal').classList.add('active');setTimeout(()=>document.getElementById('cm-name').focus(),80);
}
function saveCat(){
  const n=document.getElementById('cm-name').value.trim();const e=document.getElementById('cm-emoji').value.trim()||'📁';if(!n)return;
  if(eCI){const c=D.categories.find(x=>x.id===eCI);c.name=n;c.emoji=e}else D.categories.push({id:'c'+Date.now(),name:n,emoji:e});
  sv();render(document.getElementById('search-input').value);closeModal('cat-modal');
}
function closeModal(id){document.getElementById(id).classList.remove('active')}

document.addEventListener('click',e=>{if(!e.target.closest('.ctx'))hideCtx();if(e.target.classList.contains('modal-overlay'))e.target.classList.remove('active')});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeModal('link-modal');closeModal('cat-modal');hideCtx()}
  if(e.key==='Enter'){if(document.getElementById('link-modal').classList.contains('active'))saveLink();else if(document.getElementById('cat-modal').classList.contains('active'))saveCat()}
  if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();document.getElementById('search-input').focus()}
});

load();setG();render();
</script>
