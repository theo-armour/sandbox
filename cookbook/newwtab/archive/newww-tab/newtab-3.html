<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Tab</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f2ee;
    --card: #ffffff;
    --text: #2c2c2c;
    --text-light: #8a8680;
    --accent: #c4724e;
    --accent-light: rgba(196,114,78,0.08);
    --border: #e8e4df;
    --hover: rgba(44,44,44,0.08);
    --sidebar-w: 180px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:13px}

  .layout{display:flex;min-height:100vh}

  /* Sidebar */
  .sidebar{
    width:var(--sidebar-w);flex-shrink:0;
    position:fixed;top:0;left:0;bottom:0;
    background:var(--card);border-right:1px solid var(--border);
    display:flex;flex-direction:column;z-index:50;
  }
  .sb-head{padding:12px 10px 8px;border-bottom:1px solid var(--border)}
  .sb-head h1{font-family:'DM Serif Display',serif;font-size:1rem;font-weight:400}
  .sb-head p{font-size:0.65rem;color:var(--text-light);font-weight:300;margin-top:1px}
  .sb-search{padding:8px 8px 4px}
  .sb-search input{
    width:100%;padding:5px 8px;border:1px solid var(--border);border-radius:6px;
    font-family:'DM Sans',sans-serif;font-size:0.72rem;color:var(--text);
    background:var(--bg);outline:none;
  }
  .sb-search input:focus{border-color:var(--accent)}
  .sb-search input::placeholder{color:var(--text-light)}
  .sb-nav{flex:1;overflow-y:auto;padding:4px 5px 8px}
  .sb-nav::-webkit-scrollbar{width:3px}
  .sb-nav::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
  .nav-item{
    display:flex;align-items:center;gap:6px;
    padding:4px 7px;border-radius:5px;cursor:pointer;
    font-size:0.7rem;color:var(--text-light);
    transition:all 0.12s;text-decoration:none;
    border:none;background:none;width:100%;text-align:left;
    font-family:'DM Sans',sans-serif;
  }
  .nav-item:hover{background:var(--bg);color:var(--text)}
  .nav-item.active{background:var(--accent-light);color:var(--accent);font-weight:500}
  .nav-e{font-size:0.8rem;width:16px;text-align:center;flex-shrink:0}
  .nav-l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nav-c{margin-left:auto;font-size:0.6rem;opacity:0.5}
  .sb-foot{padding:6px 8px;border-top:1px solid var(--border);display:flex;gap:4px}
  .sb-foot .btn{flex:1;text-align:center;padding:5px 4px;font-size:0.68rem}

  /* Main */
  .main{flex:1;margin-left:var(--sidebar-w);padding:12px 16px 40px}

  .top-bar{display:flex;justify-content:flex-end;gap:6px;margin-bottom:10px}

  /* Section */
  .section{margin-bottom:8px;scroll-margin-top:8px}
  .section-hdr{
    display:flex;align-items:center;gap:8px;
    padding:7px 12px;
    background:rgba(255,255,255,0.5);
    border:1px solid var(--border);border-radius:8px;
    cursor:pointer;user-select:none;transition:background 0.15s;
  }
  .section-hdr:hover{background:var(--card)}
  .s-emoji{font-size:0.85rem}
  .s-name{font-family:'DM Serif Display',serif;font-size:0.85rem;font-weight:400}
  .s-count{font-size:0.6rem;color:var(--text-light)}
  .s-actions{margin-left:auto;display:flex;gap:2px}
  .s-actions .btn{opacity:0;transition:opacity 0.12s}
  .section-hdr:hover .s-actions .btn{opacity:1}
  .s-toggle{font-size:0.6rem;color:var(--text-light);transition:transform 0.25s;margin-left:4px}
  .section.collapsed .s-toggle{transform:rotate(-90deg)}

  /* Links grid — tight */
  .links-wrap{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(135px, 1fr));
    gap:3px;
    padding:6px 0 2px;
    max-height:2000px;overflow:hidden;
    transition:max-height 0.25s ease,padding 0.25s ease,opacity 0.15s ease;
    opacity:1;
  }
  .section.collapsed .links-wrap{max-height:0;padding:0;opacity:0;pointer-events:none}

  .lk{
    display:flex;align-items:center;gap:7px;
    padding:5px 8px;background:var(--card);
    border:1px solid transparent;border-radius:6px;
    text-decoration:none;color:var(--text);
    transition:all 0.15s;cursor:pointer;
  }
  .lk:hover{background:#f0ece7;border-color:var(--border)}
  .lk-e{font-size:0.78rem;flex-shrink:0}
  .lk-n{font-weight:500;font-size:0.72rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

  .lk-add{
    border:1px dashed var(--border);background:transparent;
    justify-content:center;color:var(--text-light);font-size:0.7rem;
  }
  .lk-add:hover{border-color:var(--accent);color:var(--accent)}

  .no-results{text-align:center;padding:40px;color:var(--text-light);font-size:0.85rem}

  /* Buttons */
  .btn{
    padding:5px 10px;border-radius:6px;font-family:'DM Sans',sans-serif;
    font-size:0.7rem;font-weight:500;cursor:pointer;border:none;
    transition:all 0.15s;white-space:nowrap;
  }
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:hover{background:#b3633f}
  .btn-outline{background:var(--card);color:var(--text);border:1px solid var(--border)}
  .btn-outline:hover{border-color:var(--accent);color:var(--accent)}
  .btn-ghost{background:transparent;color:var(--text-light);padding:3px 6px}
  .btn-ghost:hover{color:var(--text)}
  .btn-sm{padding:3px 7px;font-size:0.65rem}
  .btn-danger{color:#c44e4e}

  /* Modal */
  .modal-overlay{
    display:none;position:fixed;inset:0;
    background:rgba(44,44,44,0.18);backdrop-filter:blur(6px);
    z-index:100;align-items:center;justify-content:center;
  }
  .modal-overlay.active{display:flex}
  .modal{
    background:var(--card);border-radius:14px;padding:24px;
    width:90%;max-width:360px;
    box-shadow:0 16px 48px rgba(44,44,44,0.12);
  }
  .modal h2{font-family:'DM Serif Display',serif;font-size:1.05rem;font-weight:400;margin-bottom:16px}
  .fld{margin-bottom:12px}
  .fld label{font-size:0.63rem;font-weight:500;text-transform:uppercase;letter-spacing:0.1em;color:var(--text-light);display:block;margin-bottom:4px}
  .fld input,.fld select{
    width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:7px;
    font-family:'DM Sans',sans-serif;font-size:0.82rem;color:var(--text);background:var(--bg);outline:none;
  }
  .fld input:focus,.fld select:focus{border-color:var(--accent)}
  .modal-act{display:flex;gap:6px;justify-content:flex-end;margin-top:16px}

  /* Context menu */
  .ctx{
    display:none;position:fixed;background:var(--card);border:1px solid var(--border);
    border-radius:8px;padding:4px;box-shadow:0 6px 20px rgba(44,44,44,0.1);
    z-index:200;min-width:120px;
  }
  .ctx.active{display:block}
  .ctx button{
    display:block;width:100%;padding:6px 10px;background:none;border:none;
    font-family:'DM Sans',sans-serif;font-size:0.72rem;color:var(--text);
    cursor:pointer;border-radius:5px;text-align:left;
  }
  .ctx button:hover{background:var(--bg)}
  .ctx button.danger{color:#c44e4e}
  .ctx-div{height:1px;background:var(--border);margin:2px 4px}

  @media(max-width:700px){
    .sidebar{width:44px}
    .sb-head,.sb-search,.nav-l,.nav-c,.sb-foot span{display:none}
    .sb-foot{flex-direction:column;padding:4px}
    .sb-nav{padding:4px 3px}
    .nav-item{justify-content:center;padding:6px}
    .main{margin-left:44px;padding:10px 10px}
    .links-wrap{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
  }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="sb-head"><h1 id="greeting-text"></h1><p id="date-text"></p></div>
    <div class="sb-search"><input type="text" id="search-input" placeholder="Filter... ⌘K" /></div>
    <nav class="sb-nav" id="sb-nav"></nav>
    <div class="sb-foot">
      <button class="btn btn-outline" onclick="openCatModal()"><span>+Cat</span></button>
      <button class="btn btn-primary" onclick="openLinkModal()"><span>+Link</span></button>
    </div>
  </aside>
  <main class="main">
    <div class="top-bar">
      <button class="btn btn-outline btn-sm" onclick="expandAll()">Expand all</button>
      <button class="btn btn-outline btn-sm" onclick="collapseAll()">Collapse all</button>
    </div>
    <div id="sections"></div>
  </main>
</div>

<div class="modal-overlay" id="link-modal">
  <div class="modal">
    <h2 id="lm-title">Add Link</h2>
    <div class="fld"><label>Name</label><input type="text" id="lm-name" placeholder="YouTube" /></div>
    <div class="fld"><label>URL</label><input type="text" id="lm-url" placeholder="youtube.com" /></div>
    <div class="fld"><label>Icon</label><input type="text" id="lm-emoji" placeholder="🎬" maxlength="4" /></div>
    <div class="fld"><label>Category</label><select id="lm-cat"></select></div>
    <div class="modal-act">
      <button class="btn btn-ghost" onclick="closeModal('link-modal')">Cancel</button>
      <button class="btn btn-primary" id="lm-save" onclick="saveLink()">Add</button>
    </div>
  </div>
</div>
<div class="modal-overlay" id="cat-modal">
  <div class="modal">
    <h2 id="cm-title">Add Category</h2>
    <div class="fld"><label>Name</label><input type="text" id="cm-name" placeholder="Design Tools" /></div>
    <div class="fld"><label>Icon</label><input type="text" id="cm-emoji" placeholder="🎨" maxlength="4" /></div>
    <div class="modal-act">
      <button class="btn btn-ghost" onclick="closeModal('cat-modal')">Cancel</button>
      <button class="btn btn-primary" id="cm-save" onclick="saveCat()">Add</button>
    </div>
  </div>
</div>
<div class="ctx" id="ctx">
  <button onclick="ctxEdit()">Edit</button>
  <button onclick="ctxTop()">Move to top</button>
  <div class="ctx-div"></div>
  <button class="danger" onclick="ctxDel()">Remove</button>
</div>

let D,eLI=-1,eCI=null,cI=-1;
function load(){try{const s=localStorage.getItem(SK);D=s?JSON.parse(s):JSON.parse(JSON.stringify(DD));if(!s)D.categories.forEach(c=>D.collapsed[c.id]=true)}catch{D=JSON.parse(JSON.stringify(DD));D.categories.forEach(c=>D.collapsed[c.id]=true)}}
function sv(){localStorage.setItem(SK,JSON.stringify(D))}
function h(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}

function setG(){const hr=new Date().getHours();document.getElementById('greeting-text').textContent=hr<12?'Good morning':hr<17?'Good afternoon':'Good evening';document.getElementById('date-text').textContent=new Date().toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}

function renderNav(f=''){
  const nav=document.getElementById('sb-nav');nav.innerHTML='';const q=f.toLowerCase().trim();
  D.categories.forEach(cat=>{
    const cnt=D.links.filter(l=>l.catId===cat.id).length;
    if(q){const cl=D.links.filter(l=>l.catId===cat.id);if(!cat.name.toLowerCase().includes(q)&&!cl.some(l=>l.name.toLowerCase().includes(q)||l.url.toLowerCase().includes(q)))return}
    const b=document.createElement('button');
    b.className='nav-item'+(!D.collapsed[cat.id]?' active':'');
    b.innerHTML=`<span class="nav-e">${cat.emoji}</span><span class="nav-l">${h(cat.name)}</span><span class="nav-c">${cnt}</span>`;
    b.addEventListener('click',()=>{D.collapsed[cat.id]=false;sv();render(document.getElementById('search-input').value);setTimeout(()=>{const el=document.getElementById('s-'+cat.id);if(el)el.scrollIntoView({behavior:'smooth',block:'start'})},40)});
    nav.appendChild(b);
  });
}

function render(f=''){
  const box=document.getElementById('sections');box.innerHTML='';const q=f.toLowerCase().trim();let any=false;
  D.categories.forEach(cat=>{
    let cl=D.links.filter(l=>l.catId===cat.id);
    if(q)cl=cl.filter(l=>l.name.toLowerCase().includes(q)||l.url.toLowerCase().includes(q)||cat.name.toLowerCase().includes(q));
    if(q&&cl.length===0)return;any=true;
    const sec=document.createElement('div');sec.className='section'+(D.collapsed[cat.id]?' collapsed':'');sec.id='s-'+cat.id;
    sec.innerHTML=`<div class="section-hdr"><span class="s-emoji">${cat.emoji}</span><span class="s-name">${h(cat.name)}</span><span class="s-count">${cl.length}</span><div class="s-actions"><button class="btn btn-ghost btn-sm" data-a="add">+</button><button class="btn btn-ghost btn-sm" data-a="edit">✎</button><button class="btn btn-ghost btn-sm btn-danger" data-a="del">×</button></div><span class="s-toggle">▼</span></div><div class="links-wrap"></div>`;
    box.appendChild(sec);
    const hdr=sec.querySelector('.section-hdr');
    hdr.addEventListener('click',e=>{if(e.target.closest('.s-actions'))return;D.collapsed[cat.id]=!D.collapsed[cat.id];sv();render(document.getElementById('search-input').value)});
    sec.querySelector('[data-a="add"]').addEventListener('click',e=>{e.stopPropagation();openLinkModal(-1,cat.id)});
    sec.querySelector('[data-a="edit"]').addEventListener('click',e=>{e.stopPropagation();openCatModal(cat.id)});
    sec.querySelector('[data-a="del"]').addEventListener('click',e=>{e.stopPropagation();if(confirm('Remove "'+cat.name+'"?')){D.links=D.links.filter(l=>l.catId!==cat.id);D.categories=D.categories.filter(c=>c.id!==cat.id);sv();render(document.getElementById('search-input').value)}});
    if(!D.collapsed[cat.id]){
      const g=sec.querySelector('.links-wrap');
      cl.forEach(lk=>{const gi=D.links.indexOf(lk);const a=document.createElement('a');a.className='lk';a.href=lk.url.startsWith('http')?lk.url:'https://'+lk.url;a.innerHTML=`<span class="lk-e">${lk.emoji||'🔗'}</span><span class="lk-n">${h(lk.name)}</span>`;a.addEventListener('contextmenu',e=>{e.preventDefault();showCtx(e.clientX,e.clientY,gi)});g.appendChild(a)});
      const ab=document.createElement('div');ab.className='lk lk-add';ab.textContent='+';ab.addEventListener('click',()=>openLinkModal(-1,cat.id));g.appendChild(ab);
    }
  });
  if(!any)box.innerHTML='<div class="no-results">No matches found.</div>';
  renderNav(f);
}

function expandAll(){D.categories.forEach(c=>D.collapsed[c.id]=false);sv();render(document.getElementById('search-input').value)}
function collapseAll(){D.categories.forEach(c=>D.collapsed[c.id]=true);sv();render(document.getElementById('search-input').value)}
document.getElementById('search-input').addEventListener('input',e=>render(e.target.value));

function showCtx(x,y,i){cI=i;const m=document.getElementById('ctx');m.style.left=Math.min(x,innerWidth-140)+'px';m.style.top=Math.min(y,innerHeight-110)+'px';m.classList.add('active')}
function hideCtx(){document.getElementById('ctx').classList.remove('active')}
function ctxEdit(){hideCtx();openLinkModal(cI)}
function ctxTop(){hideCtx();if(cI>=0){const lk=D.links[cI];D.links.splice(cI,1);const f=D.links.findIndex(l=>l.catId===lk.catId);D.links.splice(f>=0?f:0,0,lk);sv();render(document.getElementById('search-input').value)}}
function ctxDel(){hideCtx();if(cI>=0){D.links.splice(cI,1);sv();render(document.getElementById('search-input').value)}}

function openLinkModal(i=-1,pc=null){
  eLI=i;const cs=document.getElementById('lm-cat');
  cs.innerHTML=D.categories.map(c=>'<option value="'+c.id+'">'+c.emoji+' '+h(c.name)+'</option>').join('');
  if(i>=0){const l=D.links[i];document.getElementById('lm-title').textContent='Edit Link';document.getElementById('lm-save').textContent='Save';document.getElementById('lm-name').value=l.name;document.getElementById('lm-url').value=l.url;document.getElementById('lm-emoji').value=l.emoji||'';cs.value=l.catId}
  else{document.getElementById('lm-title').textContent='Add Link';document.getElementById('lm-save').textContent='Add';document.getElementById('lm-name').value='';document.getElementById('lm-url').value='';document.getElementById('lm-emoji').value='';if(pc)cs.value=pc}
  document.getElementById('link-modal').classList.add('active');setTimeout(()=>document.getElementById('lm-name').focus(),80);
}
function saveLink(){
  const n=document.getElementById('lm-name').value.trim();let u=document.getElementById('lm-url').value.trim();const e=document.getElementById('lm-emoji').value.trim()||'🔗';const c=document.getElementById('lm-cat').value;
  if(!n||!u)return;if(!u.startsWith('http'))u='https://'+u;
  if(eLI>=0)D.links[eLI]={name:n,url:u,emoji:e,catId:c};else D.links.push({name:n,url:u,emoji:e,catId:c});
  sv();render(document.getElementById('search-input').value);closeModal('link-modal');
}
function openCatModal(id=null){
  eCI=id;
  if(id){const c=D.categories.find(x=>x.id===id);document.getElementById('cm-title').textContent='Edit Category';document.getElementById('cm-save').textContent='Save';document.getElementById('cm-name').value=c.name;document.getElementById('cm-emoji').value=c.emoji||''}
  else{document.getElementById('cm-title').textContent='Add Category';document.getElementById('cm-save').textContent='Add';document.getElementById('cm-name').value='';document.getElementById('cm-emoji').value=''}
  document.getElementById('cat-modal').classList.add('active');setTimeout(()=>document.getElementById('cm-name').focus(),80);
}
function saveCat(){
  const n=document.getElementById('cm-name').value.trim();const e=document.getElementById('cm-emoji').value.trim()||'📁';if(!n)return;
  if(eCI){const c=D.categories.find(x=>x.id===eCI);c.name=n;c.emoji=e}else D.categories.push({id:'c'+Date.now(),name:n,emoji:e});
  sv();render(document.getElementById('search-input').value);closeModal('cat-modal');
}
function closeModal(id){document.getElementById(id).classList.remove('active')}

document.addEventListener('click',e=>{if(!e.target.closest('.ctx'))hideCtx();if(e.target.classList.contains('modal-overlay'))e.target.classList.remove('active')});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeModal('link-modal');closeModal('cat-modal');hideCtx()}
  if(e.key==='Enter'){if(document.getElementById('link-modal').classList.contains('active'))saveLink();else if(document.getElementById('cat-modal').classList.contains('active'))saveCat()}
  if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();document.getElementById('search-input').focus()}
});

load();setG();render();
</script>
