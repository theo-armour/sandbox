<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf9f7;
    --card: #ffffff;
    --text: #111111;
    --text-mid: #444;
    --text-light: #888;
    --accent: #b85a3a;
    --rule: #d4d0ca;
    --rule-heavy: #1a1a1a;
    --hover-bg: rgba(184,90,58,0.06);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  input, select, button, textarea { font-family: inherit; }
  body {
    font-family: 'JetBrains Mono', monospace;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 16px;
  }

  /* Top bar */
  .topbar {
    position: sticky; top: 0; z-index: 50;
    background: linear-gradient(135deg, var(--bg) 0%, #f5efe8 50%, var(--bg) 100%);
    border-bottom: 2px solid var(--rule-heavy);
    padding: 10px 24px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px;
  }
  .topbar-left {
    display: flex; align-items: center; gap: 12px;
  }
  .topbar-repo {
    color: var(--text-light); display: flex; align-items: center;
    transition: color 0.12s;
  }
  .topbar-repo:hover { color: var(--text); }
  .topbar h1 {
    font-size: 1.4rem; font-weight: 700;
    letter-spacing: -0.02em;
    cursor: pointer;
    transition: color 0.12s;
  }
  .topbar h1:hover { color: var(--accent); }
  .topbar .date {
    font-size: 0.85rem; color: var(--text-mid);
    font-weight: 400;
    letter-spacing: 0.02em;
  }
  .topbar-right {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  }
  .search-box {
    display: flex; align-items: center;
    border: 1px solid var(--rule); border-radius: 4px;
    padding: 4px 8px; gap: 6px; background: var(--card);
  }
  .search-box input {
    border: none; outline: none; background: transparent;
    font-size: 0.88rem; color: var(--text); width: 180px;
  }
  .search-box input::placeholder { color: var(--text-light); }
  .search-box svg { color: var(--text-light); flex-shrink: 0; }
  .btn {
    padding: 5px 12px; border-radius: 3px;
    font-size: 0.82rem; font-weight: 500;
    cursor: pointer; border: 1px solid var(--rule);
    background: var(--card); color: var(--text-mid);
    transition: all 0.12s;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn-accent { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-accent:hover { background: #a04e30; color: #fff; }

  /* Newspaper columns */
  .columns {
    padding: 8px 10px 40px;
    column-count: 10;
    column-width: 95px;
    column-gap: 10px;
    column-rule: 1px solid var(--rule);
  }

  /* Category block */
  .cat-block {
    break-inside: avoid;
    margin-bottom: 10px;
  }
  .cat-head {
    display: flex; align-items: center; gap: 5px;
    padding: 0 0 4px;
    border-bottom: 1.5px solid var(--rule-heavy);
    border-left: 3px solid var(--accent);
    padding-left: 6px;
    margin-bottom: 4px;
    cursor: pointer;
    user-select: none;
  }
  .cat-toggle {
    font-size: 0.55rem; color: var(--text-light);
    transition: transform 0.2s;
    margin-right: 1px;
  }
  .cat-block.collapsed .cat-toggle { transform: rotate(-90deg); }
  .cat-block.collapsed .link-list { display: none; }
  .cat-block.collapsed .cat-head { margin-bottom: 0; border-bottom-color: var(--rule); border-left-color: var(--rule); }
  .cat-name {
    font-size: 0.9rem; font-weight: 700;
    letter-spacing: -0.01em;
    flex: 1;
  }

  /* Link rows */
  .link-list { list-style: none; }
  .link-row {
    display: flex;
    align-items: center;
  }
  .link-row[draggable="true"] { cursor: grab; }
  .link-row[draggable="true"]:active { cursor: grabbing; }
  .link-row.dragging { opacity: 0.3; }
  .link-row.drag-over {
    border-top: 2px solid var(--accent);
    margin-top: -2px;
  }
  .link-list.drag-over-empty {
    border-bottom: 2px solid var(--accent);
    padding-bottom: 2px;
  }
  .link-row a {
    display: flex; align-items: center; gap: 6px;
    padding: 3px 4px;
    text-decoration: none; color: var(--text);
    border-radius: 3px;
    transition: background 0.1s;
    min-width: 0; flex: 1;
  }
  .link-row a:hover {
    background: var(--hover-bg);
  }
  .link-row .le { flex-shrink: 0; width: 16px; height: 16px; text-align: center; font-size: 0.9rem; vertical-align: middle; border-radius: 2px; }
  .link-row .lg {
    display: flex; align-items: center;
    color: var(--text-light);
    text-decoration: none; flex: 0 0 auto;
    padding: 2px 3px; border-radius: 2px;
    margin-left: 1px; opacity: 0.4;
    transition: opacity 0.12s, color 0.12s;
  }
  .link-row:hover .lg { opacity: 0.7; }
  .link-row .lg:hover { opacity: 1; color: var(--text); }
  .link-row .ln {
    font-size: 0.92rem;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    line-height: 1.5;
  }
  .link-row a:hover .ln { color: var(--accent); }

  .no-results {
    text-align: center; padding: 60px;
    color: var(--text-light); font-size: 0.85rem;
    column-span: all;
  }

  /* Modal */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(26,26,26,0.15);
    backdrop-filter: blur(4px);
    z-index: 100; align-items: center; justify-content: center;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: var(--card); border-radius: 8px;
    padding: 24px; width: 90%; max-width: 340px;
    box-shadow: 0 12px 40px rgba(26,26,26,0.15);
  }
  .modal h2 {
    font-size: 1.15rem; font-weight: 700; margin-bottom: 16px;
  }
  .fld { margin-bottom: 12px; }
  .fld label {
    font-size: 0.75rem; font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--text-mid); display: block; margin-bottom: 3px;
  }
  .fld input, .fld select {
    width: 100%; padding: 7px 8px;
    border: 1px solid var(--rule); border-radius: 4px;
    font-size: 0.92rem; color: var(--text);
    background: var(--bg); outline: none;
  }
  .fld input:focus, .fld select:focus { border-color: var(--accent); }
  .modal-act { display: flex; gap: 6px; justify-content: flex-end; margin-top: 16px; }

  .settings-section {
    margin-bottom: 16px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--rule);
  }
  .settings-section:last-of-type { border-bottom: none; margin-bottom: 8px; padding-bottom: 8px; }
  .settings-label {
    font-size: 0.82rem; font-weight: 600;
    margin-bottom: 8px;
  }
  .settings-row {
    display: flex; gap: 6px; flex-wrap: wrap;
  }
  .settings-hint {
    font-size: 0.72rem; color: var(--text-light);
    margin-top: 6px; line-height: 1.4;
  }

  /* Context menu */
  .ctx {
    display: none; position: fixed;
    background: var(--card); border: 1px solid var(--rule);
    border-radius: 6px; padding: 3px;
    box-shadow: 0 4px 16px rgba(26,26,26,0.1);
    z-index: 200; min-width: 110px;
  }
  .ctx.active { display: block; }
  .ctx button {
    display: block; width: 100%; padding: 6px 10px;
    background: none; border: none;
    font-size: 0.85rem; color: var(--text);
    cursor: pointer; border-radius: 4px; text-align: left;
  }
  .ctx button:hover { background: var(--bg); }
  .ctx button.danger { color: #c44; }
  .ctx-div { height: 1px; background: var(--rule); margin: 2px 4px; }

  /* Responsive columns */
  @media (max-width: 1400px) { .columns { column-count: 8; } }
  @media (max-width: 1100px) { .columns { column-count: 6; } }
  @media (max-width: 800px)  { .columns { column-count: 4; column-gap: 8px; } }
  @media (max-width: 500px)  {
    .columns { column-count: 1; }
    .topbar { flex-wrap: wrap; }
    .search-box input { width: 120px; }
  }
</style>
</head>

<div class="modal-overlay" id="cat-modal">

  </div>
</div>
<div class="modal-overlay" id="settings-modal">
  <div class="modal">
    <h2>Settings</h2>
    <div class="settings-section">
      <div class="settings-label">Import</div>
      <div class="settings-row">
        <button class="btn" onclick="$('import-file').click()">Import JSON Or Markdown</button>
        <input type="file" id="import-file" accept=".json,.md,.txt,.markdown" style="display:none" onchange="importFile(this)" />
      </div>
      <div class="settings-hint">Accepts .json or .md files</div>
    </div>
    <div class="settings-section">
      <div class="settings-label">Export</div>
      <div class="settings-row">
        <button class="btn" onclick="exportJSON()">Export JSON</button>
        <button class="btn" onclick="exportMD()">Export Markdown</button>
      </div>
    </div>
    <div class="settings-section">
      <div class="settings-label">Publish</div>
      <div class="settings-row">
        <button class="btn btn-accent" onclick="downloadHTML()">Save HTML With Data</button>
      </div>
      <div class="settings-hint">Downloads a self-contained HTML file with your current links baked in. Deploy to GitHub Pages for shared access.</div>
    </div>
    <div class="modal-act">
      <button class="btn" onclick="closeModal('settings-modal')">Close</button>
    </div>
  </div>
</div>

function render(f=''){
  const box=$('columns');box.innerHTML='';
  const q=f.toLowerCase().trim();let any=false;

  D.categories.forEach(cat=>{
    let cl=D.links.filter(l=>l.catId===cat.id);
    if(q)cl=cl.filter(l=>l.name.toLowerCase().includes(q)||l.url.toLowerCase().includes(q)||cat.name.toLowerCase().includes(q));
    if(q&&cl.length===0)return;
    any=true;

    const block=document.createElement('div');
    block.className='cat-block'+(D.collapsed[cat.id]?' collapsed':'');
    const catDisplay=trunc(cat.name,9);
    const catTitle=cat.name+(cl.length?' ('+cl.length+' links)':'');
    block.innerHTML=`<div class="cat-head"><span class="cat-toggle">▼</span><span class="cat-name" title="${h(catTitle)}">${h(catDisplay)}</span></div><ul class="link-list" data-cat="${cat.id}"></ul>`;
    box.appendChild(block);

    block.querySelector('.cat-head').addEventListener('click',()=>{
      D.collapsed[cat.id]=!D.collapsed[cat.id];update();
    });
    block.querySelector('.cat-head').addEventListener('contextmenu',e=>{
      e.preventDefault();showCatCtx(e.clientX,e.clientY,cat.id);
    });

    const ul=block.querySelector('.link-list');
    cl.forEach(lk=>{
      const gi=D.links.indexOf(lk);
      const li=document.createElement('li');li.className='link-row';
      li.draggable=true;
      li.dataset.gi=gi;
      const mainUrl=toUrl(lk.url);
      const repoHtml=lk.repoUrl?`<a class="lg" href="${toUrl(lk.repoUrl)}" draggable="false" title="Repo" target="_blank" rel="noopener">${OCTOCAT}</a>`:'';
      const domain=mainUrl.replace(/^https?:\/\//,'').split('/')[0];
      const faviconUrl='https://www.google.com/s2/favicons?domain='+domain+'&sz=16';
      const linkDisplay=trunc(lk.name,15);
      const linkTitle=lk.name.length>15?' title="'+h(lk.name)+'"':'';
      li.innerHTML=`<a href="${mainUrl}" draggable="false" target="_blank" rel="noopener"${linkTitle}><img class="le" src="${faviconUrl}" width="16" height="16" data-fb="${h(lk.emoji||'🔗')}" onerror="favErr(this,this.dataset.fb)" /><span class="ln">${h(linkDisplay)}</span></a>${repoHtml}`;
      li.addEventListener('contextmenu',e=>{e.preventDefault();showCtx(e.clientX,e.clientY,gi)});

      li.addEventListener('dragstart',e=>{
        dragSrcIdx=gi;
        li.classList.add('dragging');
        e.dataTransfer.effectAllowed='move';
      });
      li.addEventListener('dragend',()=>{li.classList.remove('dragging');clearDragStates()});
      li.addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect='move';clearDragStates();li.classList.add('drag-over')});
      li.addEventListener('dragleave',()=>{li.classList.remove('drag-over')});
      li.addEventListener('drop',e=>{
        e.preventDefault();clearDragStates();
        if(dragSrcIdx<0)return;
        const targetIdx=parseInt(li.dataset.gi);
        dropLink(dragSrcIdx,targetIdx,cat.id);
      });

      ul.appendChild(li);
    });

    // Allow dropping into empty category or at end of list
    ul.addEventListener('dragover',e=>{
      if(e.target===ul){e.preventDefault();e.dataTransfer.dropEffect='move';ul.classList.add('drag-over-empty')}
    });
    ul.addEventListener('dragleave',e=>{if(e.target===ul)ul.classList.remove('drag-over-empty')});
    ul.addEventListener('drop',e=>{
      if(e.target===ul){e.preventDefault();ul.classList.remove('drag-over-empty');
        if(dragSrcIdx<0)return;
        dropLinkToEnd(dragSrcIdx,cat.id);
      }
    });
  });
  if(!any)box.innerHTML='<div class="no-results">No Matches Found</div>';
}

// Category reorder
function moveCat(catId,dir){
  const i=D.categories.findIndex(c=>c.id===catId);
  const ni=i+dir;
  if(ni<0||ni>=D.categories.length)return;
  const tmp=D.categories[i];D.categories[i]=D.categories[ni];D.categories[ni]=tmp;
  update();
}

// Link drag and drop
let dragSrcIdx=-1;

function clearDragStates(){
  document.querySelectorAll('.drag-over').forEach(el=>el.classList.remove('drag-over'));
  document.querySelectorAll('.drag-over-empty').forEach(el=>el.classList.remove('drag-over-empty'));
}

function dropLink(fromGI,toGI,toCatId){
  const lk=D.links[fromGI];
  D.links.splice(fromGI,1);
  let newToGI=toGI;
  if(fromGI<toGI)newToGI--;
  lk.catId=toCatId;
  D.links.splice(newToGI,0,lk);
  dragSrcIdx=-1;update();
}

function dropLinkToEnd(fromGI,toCatId){
  const lk=D.links[fromGI];
  D.links.splice(fromGI,1);
  lk.catId=toCatId;
  let insertAt=-1;
  for(let i=D.links.length-1;i>=0;i--){if(D.links[i].catId===toCatId){insertAt=i+1;break}}
  if(insertAt<0)insertAt=D.links.length;
  D.links.splice(insertAt,0,lk);
  dragSrcIdx=-1;update();
}

// Export Markdown
function exportMD(){
  let md='# NewwwTab Links\n\n';
  D.categories.forEach(cat=>{
    const cl=D.links.filter(l=>l.catId===cat.id);
    md+='## '+cat.emoji+' '+cat.name+'\n';
    cl.forEach(lk=>{
      if(lk.repoUrl)md+='- '+lk.emoji+' [g]('+lk.repoUrl+') '+lk.name+' '+lk.url+'\n';
      else md+='- '+lk.emoji+' '+lk.name+' '+lk.url+'\n';

// Import JSON or Markdown
function importFile(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    const txt=e.target.result;
    if(file.name.endsWith('.json')){
      try{
        const imported=JSON.parse(txt);
        if(imported.categories&&imported.links){
          D=imported;update();
        }else{alert('Invalid NewwwTab Data File')}
      }catch{alert('Could Not Parse JSON File')}
    }else{
      // Parse as Markdown
      importMarkdown(txt);
    }
  };
  reader.readAsText(file);
  input.value='';
}

function importMarkdown(txt){
  const lines=txt.split('\n');
  const cats=[];const links=[];
  let curCat=null;
  const emojiRe=/^(\p{Emoji_Presentation}|\p{Emoji}\uFE0F?)\s*(.*)/u;
  function parseEmoji(str,fallback){
    const m=str.match(emojiRe);
    return m?{emoji:m[1],rest:m[2]||str}:{emoji:fallback,rest:str};
  }
  for(const raw of lines){
    const line=raw.trim();
    if(!line)continue;
    // H2 = category
    const h2=line.match(/^##\s+(.+)$/);
    if(h2){
      const {emoji,rest}=parseEmoji(h2[1].trim(),'📁');
      const id='c'+Date.now()+'_'+cats.length;
      curCat={id,name:rest,emoji};
      cats.push(curCat);
      continue;
    }
    if(line.startsWith('#'))continue;
    // Bullet = link
    const bullet=line.match(/^[-*]\s+(.+)$/);
    if(bullet&&curCat){
      let content=bullet[1].trim();
      // Check for [g](repoUrl) pattern
      let repoUrl=null;
      const repoMatch=content.match(/\[g\]\((https?:\/\/[^)]+)\)/);
      if(repoMatch){repoUrl=repoMatch[1];content=content.replace(repoMatch[0],'').trim()}
      // URL is the last http(s) chunk
      const urlMatch=content.match(/(https?:\/\/\S+)\s*$/);
      const url=urlMatch?urlMatch[1]:'https://example.com';
      const before=urlMatch?content.slice(0,content.lastIndexOf(url)).trim():content;
      const {emoji,rest}=parseEmoji(before,'🔗');
      const name=rest.trim()||url.replace(/^https?:\/\/(www\.)?/,'').replace(/\/$/,'');
      const obj={name,url,emoji,catId:curCat.id};
      if(repoUrl)obj.repoUrl=repoUrl;
      links.push(obj);
    }
  }
  if(cats.length===0){alert('No Categories Found (Use ## Headers)');return}
  D={categories:cats,links,collapsed:{}};
  update();
}

// Download HTML with baked-in data
function downloadHTML(){
  const src=document.documentElement.outerHTML;
  const startTag='/*BAKE_START*/';
  const endTag='/*BAKE_END*/';
  const si=src.indexOf(startTag);
  const ei=src.indexOf(endTag);
  if(si<0||ei<0){alert('Could Not Bake Data');return}
  const baked=JSON.parse(JSON.stringify(D));
  baked.collapsed={};
  const bakedStr='\n/*BAKE_START*/\nconst DD='+JSON.stringify(baked)+';\n/*BAKE_END*/\n';
  const newSrc='<!DOCTYPE html>\n<html lang="en">'+
    src.substring(src.indexOf('<head>'),si)+
    bakedStr+
    src.substring(ei+endTag.length);
  dl(new Blob([newSrc],{type:'text/html'}),'newwwtab.html');
}

load();setG();render();
