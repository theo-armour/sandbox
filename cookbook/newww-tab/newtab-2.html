<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Tab</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f4f0;
    --card: #ffffff;
    --text: #2c2c2c;
    --text-light: #8a8680;
    --accent: #c4724e;
    --accent-light: rgba(196, 114, 78, 0.08);
    --border: #e8e4df;
    --shadow-hover: rgba(44, 44, 44, 0.1);
    --sidebar-w: 220px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 20% 10%, rgba(196,114,78,0.04), transparent),
      radial-gradient(ellipse 60% 50% at 80% 90%, rgba(196,114,78,0.03), transparent);
    pointer-events: none; z-index: 0;
  }

  /* Layout */
  .layout { display: flex; min-height: 100vh; position: relative; z-index: 1; }

  /* Sidebar */
  .sidebar {
    width: var(--sidebar-w); flex-shrink: 0;
    position: fixed; top: 0; left: 0; bottom: 0;
    background: var(--card);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    z-index: 50;
    overflow: hidden;
  }
  .sidebar-header {
    padding: 20px 16px 12px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-header h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 1.25rem; font-weight: 400;
    letter-spacing: -0.02em;
  }
  .sidebar-header p {
    font-size: 0.72rem; color: var(--text-light);
    font-weight: 300; margin-top: 2px;
  }
  .sidebar-search {
    padding: 12px 12px 8px;
  }
  .sidebar-search input {
    width: 100%; padding: 8px 10px;
    border: 1px solid var(--border); border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.78rem; color: var(--text);
    background: var(--bg); outline: none;
    transition: border-color 0.2s;
  }
  .sidebar-search input:focus { border-color: var(--accent); }
  .sidebar-search input::placeholder { color: var(--text-light); }
  .sidebar-nav {
    flex: 1; overflow-y: auto; padding: 6px 8px 16px;
  }
  .sidebar-nav::-webkit-scrollbar { width: 4px; }
  .sidebar-nav::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  .nav-item {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 10px; border-radius: 8px;
    cursor: pointer; font-size: 0.78rem;
    color: var(--text-light); transition: all 0.15s;
    text-decoration: none; user-select: none;
    border: none; background: none; width: 100; text-align: left;
    font-family: 'DM Sans', sans-serif;
  }
  .nav-item:hover { background: var(--bg); color: var(--text); }
  .nav-item.active { background: var(--accent-light); color: var(--accent); font-weight: 500; }
  .nav-emoji { font-size: 0.9rem; width: 20px; text-align: center; flex-shrink: 0; }
  .nav-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nav-count {
    margin-left: auto; font-size: 0.65rem;
    color: var(--text-light); opacity: 0.6;
  }
  .sidebar-footer {
    padding: 10px 12px;
    border-top: 1px solid var(--border);
    display: flex; gap: 6px;
  }
  .sidebar-footer .btn { flex: 1; text-align: center; }

  /* Main content */
  .main {
    flex: 1; margin-left: var(--sidebar-w);
    padding: 28px 32px 60px;
  }

  /* Expand/Collapse All */
  .top-bar {
    display: flex; justify-content: flex-end;
    gap: 8px; margin-bottom: 20px;
  }

  /* Section */
  .section {
    margin-bottom: 16px;
    scroll-margin-top: 16px;
  }
  .section-header {
    display: flex; align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    background: rgba(255,255,255,0.6);
    border: 1px solid var(--border);
    border-radius: 12px;
    cursor: pointer; user-select: none;
    transition: all 0.2s;
  }
  .section-header:hover { background: var(--card); }
  .section-title-area {
    display: flex; align-items: center; gap: 10px;
  }
  .section-emoji {
    font-size: 1.1rem; width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    background: var(--accent-light); border-radius: 8px;
  }
  .section-name {
    font-family: 'DM Serif Display', serif;
    font-size: 1.05rem; font-weight: 400;
  }
  .section-count {
    font-size: 0.68rem; color: var(--text-light); margin-left: 6px;
  }
  .section-toggle {
    font-size: 0.7rem; color: var(--text-light);
    transition: transform 0.3s; margin-left: auto;
    padding: 0 8px;
  }
  .section.collapsed .section-toggle { transform: rotate(-90deg); }
  .section-actions {
    display: flex; gap: 4px; margin-left: 8px;
  }
  .section-actions .btn { opacity: 0; transition: opacity 0.15s; }
  .section-header:hover .section-actions .btn { opacity: 1; }

  /* Links grid */
  .links-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(165px, 1fr));
    gap: 6px;
    padding: 10px 4px 4px;
    max-height: 2000px;
    overflow: hidden;
    transition: max-height 0.3s ease, padding 0.3s ease, opacity 0.2s ease;
    opacity: 1;
  }
  .section.collapsed .links-grid {
    max-height: 0; padding: 0 4px; opacity: 0;
    pointer-events: none;
  }
  .link-card {
    display: flex; align-items: center; gap: 9px;
    padding: 9px 11px; background: var(--card);
    border: 1px solid transparent; border-radius: 9px;
    text-decoration: none; color: var(--text);
    transition: all 0.2s cubic-bezier(0.23,1,0.32,1);
    cursor: pointer;
  }
  .link-card:hover {
    transform: translateY(-1px);
    box-shadow: 0 3px 12px var(--shadow-hover);
    border-color: var(--border);
  }
  .link-emoji {
    font-size: 0.9rem; flex-shrink: 0;
    width: 26px; height: 26px;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg); border-radius: 6px;
  }
  .link-card:hover .link-emoji { background: var(--accent-light); }
  .link-name {
    font-weight: 500; font-size: 0.78rem;
    white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; min-width: 0;
  }
  .add-link-btn {
    border: 1.5px dashed var(--border); background: transparent;
    justify-content: center; color: var(--text-light);
    font-size: 0.75rem;
  }
  .add-link-btn:hover {
    border-color: var(--accent); color: var(--accent);
    transform: none; box-shadow: none;
  }
  .no-results {
    text-align: center; padding: 60px 20px;
    color: var(--text-light); font-size: 0.9rem;
  }

  /* Buttons */
  .btn {
    padding: 7px 14px; border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.76rem; font-weight: 500;
    cursor: pointer; border: none; transition: all 0.2s; white-space: nowrap;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #b3633f; }
  .btn-outline { background: var(--card); color: var(--text); border: 1px solid var(--border); }
  .btn-outline:hover { border-color: var(--accent); color: var(--accent); }
  .btn-ghost { background: transparent; color: var(--text-light); padding: 5px 8px; }
  .btn-ghost:hover { color: var(--text); }
  .btn-sm { padding: 4px 10px; font-size: 0.7rem; }
  .btn-danger { color: #c44e4e; }
  .btn-danger:hover { background: rgba(196,78,78,0.06); }

  /* Modal */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(44,44,44,0.2);
    backdrop-filter: blur(8px);
    z-index: 100; align-items: center; justify-content: center;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: var(--card); border-radius: 16px;
    padding: 28px; width: 90%; max-width: 400px;
    box-shadow: 0 24px 64px rgba(44,44,44,0.12);
    animation: scaleIn 0.2s ease;
  }
  .modal h2 {
    font-family: 'DM Serif Display', serif;
    font-size: 1.2rem; font-weight: 400; margin-bottom: 20px;
  }
  .field { margin-bottom: 14px; }
  .field label {
    font-size: 0.68rem; font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.12em;
    color: var(--text-light); display: block; margin-bottom: 5px;
  }
  .field input, .field select {
    width: 100%; padding: 9px 12px;
    border: 1px solid var(--border); border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem; color: var(--text);
    background: var(--bg); outline: none;
  }
  .field input:focus, .field select:focus { border-color: var(--accent); }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }

  /* Context menu */
  .context-menu {
    display: none; position: fixed;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 5px;
    box-shadow: 0 8px 24px rgba(44,44,44,0.12);
    z-index: 200; min-width: 140px;
  }
  .context-menu.active { display: block; }
  .context-menu button {
    display: block; width: 100%; padding: 8px 12px;
    background: none; border: none;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.78rem; color: var(--text);
    cursor: pointer; border-radius: 6px;
    text-align: left;
  }
  .context-menu button:hover { background: var(--bg); }
  .context-menu button.danger { color: #c44e4e; }
  .ctx-divider { height: 1px; background: var(--border); margin: 3px 5px; }

  @keyframes scaleIn {
    from { opacity: 0; transform: scale(0.96); }
    to { opacity: 1; transform: scale(1); }
  }

  /* Mobile */
  @media (max-width: 768px) {
    .sidebar { width: 56px; }
    .sidebar-header, .sidebar-search, .nav-label, .nav-count, .sidebar-footer span { display: none; }
    .sidebar-footer { flex-direction: column; padding: 6px; }
    .sidebar-footer .btn { padding: 6px; font-size: 0.7rem; }
    .sidebar-nav { padding: 6px 4px; }
    .nav-item { justify-content: center; padding: 8px; }
    .nav-emoji { width: auto; }
    .main { margin-left: 56px; padding: 20px 16px; }
    .links-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  }
</style>
</head>
<body>
<div class="layout">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <h1 id="greeting-text"></h1>
      <p id="date-text"></p>
    </div>
    <div class="sidebar-search">
      <input type="text" id="search-input" placeholder="Filter... (⌘K)" />
    </div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
    <div class="sidebar-footer">
      <button class="btn btn-outline" onclick="openCategoryModal()"><span>+ </span>Cat</button>
      <button class="btn btn-primary" onclick="openLinkModal()"><span>+ </span>Link</button>
    </div>
  </aside>

  <!-- Main -->
  <main class="main">
    <div class="top-bar">
      <button class="btn btn-outline btn-sm" onclick="expandAll()">Expand all</button>
      <button class="btn btn-outline btn-sm" onclick="collapseAll()">Collapse all</button>
    </div>
    <div id="sections"></div>
  </main>

</div>

<!-- Link Modal -->
<div class="modal-overlay" id="link-modal">
  <div class="modal">
    <h2 id="link-modal-title">Add Link</h2>
    <div class="field"><label>Name</label><input type="text" id="link-name" placeholder="e.g. YouTube" /></div>
    <div class="field"><label>URL</label><input type="text" id="link-url" placeholder="e.g. youtube.com" /></div>
    <div class="field"><label>Icon (emoji)</label><input type="text" id="link-emoji" placeholder="e.g. 🎬" maxlength="4" /></div>
    <div class="field"><label>Category</label><select id="link-category"></select></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('link-modal')">Cancel</button>
      <button class="btn btn-primary" id="link-save-btn" onclick="saveLink()">Add</button>
    </div>
  </div>
</div>

<!-- Category Modal -->
<div class="modal-overlay" id="cat-modal">
  <div class="modal">
    <h2 id="cat-modal-title">Add Category</h2>
    <div class="field"><label>Category Name</label><input type="text" id="cat-name" placeholder="e.g. Design Tools" /></div>
    <div class="field"><label>Icon (emoji)</label><input type="text" id="cat-emoji" placeholder="e.g. 🎨" maxlength="4" /></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('cat-modal')">Cancel</button>
      <button class="btn btn-primary" id="cat-save-btn" onclick="saveCategory()">Add</button>
    </div>
  </div>
</div>

<!-- Context Menu -->
<div class="context-menu" id="context-menu">
  <button onclick="ctxEdit()">Edit</button>
  <button onclick="ctxMoveUp()">Move to top</button>
  <div class="ctx-divider"></div>
  <button class="danger" onclick="ctxDelete()">Remove</button>
</div>

let data, editingLinkIndex = -1, editingCatId = null;
let ctxIndex = -1;

function load() {
  try {
    const s = localStorage.getItem(STORAGE_KEY);
    data = s ? JSON.parse(s) : JSON.parse(JSON.stringify(DEFAULT_DATA));
    // Default: all collapsed
    if (!s) { data.categories.forEach(c => data.collapsed[c.id] = true); }
  } catch { data = JSON.parse(JSON.stringify(DEFAULT_DATA)); data.categories.forEach(c => data.collapsed[c.id] = true); }
}
function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function setGreeting() {
  const h = new Date().getHours();
  document.getElementById('greeting-text').textContent =
    h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
  document.getElementById('date-text').textContent =
    new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
}

function renderSidebar(filter = '') {
  const nav = document.getElementById('sidebar-nav');
  nav.innerHTML = '';
  const q = filter.toLowerCase().trim();
  data.categories.forEach(cat => {
    const count = data.links.filter(l => l.catId === cat.id).length;
    if (q) {
      const catLinks = data.links.filter(l => l.catId === cat.id);
      const match = cat.name.toLowerCase().includes(q) ||
        catLinks.some(l => l.name.toLowerCase().includes(q) || l.url.toLowerCase().includes(q));
      if (!match) return;
    }
    const btn = document.createElement('button');
    btn.className = 'nav-item' + (!data.collapsed[cat.id] ? ' active' : '');
    btn.innerHTML = `<span class="nav-emoji">${cat.emoji}</span><span class="nav-label">${esc(cat.name)}</span><span class="nav-count">${count}</span>`;
    btn.addEventListener('click', () => {
      // Expand and scroll
      data.collapsed[cat.id] = false;
      save();
      render(document.getElementById('search-input').value);
      setTimeout(() => {
        const el = document.getElementById('section-' + cat.id);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, 50);
    });
    nav.appendChild(btn);
  });
}

function render(filter = '') {
  const container = document.getElementById('sections');
  container.innerHTML = '';
  const q = filter.toLowerCase().trim();
  let anyVisible = false;

  data.categories.forEach(cat => {
    let catLinks = data.links.filter(l => l.catId === cat.id);
    if (q) catLinks = catLinks.filter(l =>
      l.name.toLowerCase().includes(q) || l.url.toLowerCase().includes(q) || cat.name.toLowerCase().includes(q)
    );
    if (q && catLinks.length === 0) return;
    anyVisible = true;

    const section = document.createElement('div');
    section.className = 'section' + (data.collapsed[cat.id] ? ' collapsed' : '');
    section.id = 'section-' + cat.id;

    section.innerHTML = `
      <div class="section-header">
        <div class="section-title-area">
          <div class="section-emoji">${cat.emoji || '📁'}</div>
          <span class="section-name">${esc(cat.name)}</span>
          <span class="section-count">${catLinks.length}</span>
        </div>
        <div class="section-actions">
          <button class="btn btn-ghost btn-sm" data-act="add">+ Add</button>
          <button class="btn btn-ghost btn-sm" data-act="edit">Edit</button>
          <button class="btn btn-ghost btn-sm btn-danger" data-act="del">×</button>
        </div>
        <span class="section-toggle">▼</span>
      </div>
      <div class="links-grid"></div>
    `;
    container.appendChild(section);

    const header = section.querySelector('.section-header');
    header.addEventListener('click', (e) => {
      if (e.target.closest('.section-actions')) return;
      data.collapsed[cat.id] = !data.collapsed[cat.id];
      save(); render(document.getElementById('search-input').value);
    });
    section.querySelector('[data-act="add"]').addEventListener('click', (e) => { e.stopPropagation(); openLinkModal(-1, cat.id); });
    section.querySelector('[data-act="edit"]').addEventListener('click', (e) => { e.stopPropagation(); openCategoryModal(cat.id); });
    section.querySelector('[data-act="del"]').addEventListener('click', (e) => {
      e.stopPropagation();
      if (confirm('Remove "'+cat.name+'" and all its links?')) {
        data.links = data.links.filter(l => l.catId !== cat.id);
        data.categories = data.categories.filter(c => c.id !== cat.id);
        save(); render(document.getElementById('search-input').value);
      }
    });

    if (!data.collapsed[cat.id]) {
      const grid = section.querySelector('.links-grid');
      catLinks.forEach(link => {
        const gi = data.links.indexOf(link);
        const card = document.createElement('a');
        card.className = 'link-card';
        card.href = link.url.startsWith('http') ? link.url : 'https://' + link.url;
        card.innerHTML = '<div class="link-emoji">'+(link.emoji||'🔗')+'</div><span class="link-name">'+esc(link.name)+'</span>';
        card.addEventListener('contextmenu', e => { e.preventDefault(); showCtx(e.clientX, e.clientY, gi); });
        grid.appendChild(card);
      });
      const addBtn = document.createElement('div');
      addBtn.className = 'link-card add-link-btn';
      addBtn.textContent = '+';
      addBtn.addEventListener('click', () => openLinkModal(-1, cat.id));
      grid.appendChild(addBtn);
    }
  });
  if (!anyVisible) container.innerHTML = '<div class="no-results">No links match your search.</div>';
  renderSidebar(filter);
}

function expandAll() { data.categories.forEach(c => data.collapsed[c.id] = false); save(); render(document.getElementById('search-input').value); }
function collapseAll() { data.categories.forEach(c => data.collapsed[c.id] = true); save(); render(document.getElementById('search-input').value); }

document.getElementById('search-input').addEventListener('input', e => render(e.target.value));

function showCtx(x, y, index) {
  ctxIndex = index;
  const m = document.getElementById('context-menu');
  m.style.left = Math.min(x, innerWidth - 160) + 'px';
  m.style.top = Math.min(y, innerHeight - 120) + 'px';
  m.classList.add('active');
}
function hideCtx() { document.getElementById('context-menu').classList.remove('active'); }
function ctxEdit() { hideCtx(); openLinkModal(ctxIndex); }
function ctxMoveUp() {
  hideCtx();
  if (ctxIndex >= 0) {
    const link = data.links[ctxIndex];
    data.links.splice(ctxIndex, 1);
    const f = data.links.findIndex(l => l.catId === link.catId);
    data.links.splice(f >= 0 ? f : 0, 0, link);
    save(); render(document.getElementById('search-input').value);
  }
}
function ctxDelete() { hideCtx(); if (ctxIndex >= 0) { data.links.splice(ctxIndex, 1); save(); render(document.getElementById('search-input').value); } }

function openLinkModal(index = -1, presetCatId = null) {
  editingLinkIndex = index;
  const cs = document.getElementById('link-category');
  cs.innerHTML = data.categories.map(c => '<option value="'+c.id+'">'+c.emoji+' '+esc(c.name)+'</option>').join('');
  if (index >= 0) {
    const l = data.links[index];
    document.getElementById('link-modal-title').textContent = 'Edit Link';
    document.getElementById('link-save-btn').textContent = 'Save';
    document.getElementById('link-name').value = l.name;
    document.getElementById('link-url').value = l.url;
    document.getElementById('link-emoji').value = l.emoji || '';
    cs.value = l.catId;
  } else {
    document.getElementById('link-modal-title').textContent = 'Add Link';
    document.getElementById('link-save-btn').textContent = 'Add';
    document.getElementById('link-name').value = '';
    document.getElementById('link-url').value = '';
    document.getElementById('link-emoji').value = '';
    if (presetCatId) cs.value = presetCatId;
  }
  document.getElementById('link-modal').classList.add('active');
  setTimeout(() => document.getElementById('link-name').focus(), 100);
}
function saveLink() {
  const name = document.getElementById('link-name').value.trim();
  let url = document.getElementById('link-url').value.trim();
  const emoji = document.getElementById('link-emoji').value.trim() || '🔗';
  const catId = document.getElementById('link-category').value;
  if (!name || !url) return;
  if (!url.startsWith('http')) url = 'https://' + url;
  if (editingLinkIndex >= 0) data.links[editingLinkIndex] = { name, url, emoji, catId };
  else data.links.push({ name, url, emoji, catId });
  save(); render(document.getElementById('search-input').value);
  closeModal('link-modal');
}
function openCategoryModal(catId = null) {
  editingCatId = catId;
  if (catId) {
    const c = data.categories.find(x => x.id === catId);
    document.getElementById('cat-modal-title').textContent = 'Edit Category';
    document.getElementById('cat-save-btn').textContent = 'Save';
    document.getElementById('cat-name').value = c.name;
    document.getElementById('cat-emoji').value = c.emoji || '';
  } else {
    document.getElementById('cat-modal-title').textContent = 'Add Category';
    document.getElementById('cat-save-btn').textContent = 'Add';
    document.getElementById('cat-name').value = '';
    document.getElementById('cat-emoji').value = '';
  }
  document.getElementById('cat-modal').classList.add('active');
  setTimeout(() => document.getElementById('cat-name').focus(), 100);
}
function saveCategory() {
  const name = document.getElementById('cat-name').value.trim();
  const emoji = document.getElementById('cat-emoji').value.trim() || '📁';
  if (!name) return;
  if (editingCatId) { const c = data.categories.find(x => x.id === editingCatId); c.name = name; c.emoji = emoji; }
  else data.categories.push({ id: 'cat_' + Date.now(), name, emoji });
  save(); render(document.getElementById('search-input').value);
  closeModal('cat-modal');
}
function closeModal(id) { document.getElementById(id).classList.remove('active'); }

document.addEventListener('click', e => {
  if (!e.target.closest('.context-menu')) hideCtx();
  if (e.target.classList.contains('modal-overlay')) e.target.classList.remove('active');
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeModal('link-modal'); closeModal('cat-modal'); hideCtx(); }
  if (e.key === 'Enter') {
    if (document.getElementById('link-modal').classList.contains('active')) saveLink();
    else if (document.getElementById('cat-modal').classList.contains('active')) saveCategory();
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); document.getElementById('search-input').focus(); }
});

load(); setGreeting(); render();
</script>
