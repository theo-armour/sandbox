<style>
  :root {
    --bg: #f6f4f0;
    --card: #ffffff;
    --text: #2c2c2c;
    --text-light: #8a8680;
    --accent: #c4724e;
    --accent-light: rgba(196, 114, 78, 0.08);
    --border: #e8e4df;
    --shadow: rgba(44, 44, 44, 0.04);
    --shadow-hover: rgba(44, 44, 44, 0.1);
    --section-bg: rgba(255,255,255,0.5);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 32px 24px 60px;
    position: relative;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 20% 10%, rgba(196, 114, 78, 0.04), transparent),
      radial-gradient(ellipse 60% 50% at 80% 90%, rgba(196, 114, 78, 0.03), transparent);
    pointer-events: none;
  }
  .header {
    max-width: 1200px;
    margin: 0 auto 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
    animation: fadeUp 0.6s ease both;
  }
  .header-left h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 2rem;
    font-weight: 400;
    letter-spacing: -0.02em;
  }
  .header-left p {
    font-weight: 300;
    font-size: 0.88rem;
    color: var(--text-light);
    margin-top: 2px;
  }
  .header-actions {
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .search-box {
    display: flex;
    align-items: center;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 14px;
    gap: 8px;
    width: 240px;
    transition: border-color 0.2s;
  }
  .search-box:focus-within { border-color: var(--accent); }
  .search-box svg { flex-shrink: 0; color: var(--text-light); }
  .search-box input {
    border: none; outline: none; background: transparent;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem; color: var(--text); width: 100%;
  }
  .search-box input::placeholder { color: var(--text-light); }
  .btn {
    padding: 9px 18px; border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.82rem; font-weight: 500;
    cursor: pointer; border: none; transition: all 0.2s; white-space: nowrap;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #b3633f; transform: translateY(-1px); }
  .btn-outline { background: var(--card); color: var(--text); border: 1px solid var(--border); }
  .btn-outline:hover { border-color: var(--accent); color: var(--accent); }
  .btn-ghost { background: transparent; color: var(--text-light); }
  .btn-ghost:hover { color: var(--text); }
  .btn-sm { padding: 6px 12px; font-size: 0.75rem; }
  .btn-danger { color: #c44e4e; }
  .btn-danger:hover { background: rgba(196, 78, 78, 0.06); }
  .sections { max-width: 1200px; margin: 0 auto; }
  .section {
    background: var(--section-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 20px;
    animation: fadeUp 0.5s ease both;
  }
  .section-header {
    display: flex; align-items: center;
    justify-content: space-between;
    margin-bottom: 16px; gap: 12px;
  }
  .section-title-area {
    display: flex; align-items: center;
    gap: 10px; cursor: pointer; user-select: none;
  }
  .section-emoji {
    font-size: 1.2rem; width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    background: var(--accent-light); border-radius: 8px;
  }
  .section-name {
    font-family: 'DM Serif Display', serif;
    font-size: 1.15rem; font-weight: 400;
  }
  .section-count {
    font-size: 0.7rem; color: var(--text-light);
    font-weight: 400; margin-left: 4px;
  }
  .section-toggle {
    font-size: 0.75rem; color: var(--text-light);
    transition: transform 0.3s;
  }
  .section.collapsed .section-toggle { transform: rotate(-90deg); }
  .section.collapsed .links-grid { display: none; }
  .section-actions { display: flex; gap: 6px; }
  .links-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 8px;
  }
  .link-card {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; background: var(--card);
    border: 1px solid transparent; border-radius: 10px;
    text-decoration: none; color: var(--text);
    transition: all 0.25s cubic-bezier(0.23, 1, 0.32, 1);
    cursor: pointer; position: relative;
  }
  .link-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 16px var(--shadow-hover);
    border-color: var(--border);
  }
  .link-emoji {
    font-size: 0.95rem; flex-shrink: 0;
    width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg); border-radius: 7px;
  }
  .link-card:hover .link-emoji { background: var(--accent-light); }
  .link-name {
    font-weight: 500; font-size: 0.8rem;
    white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; min-width: 0;
  }
  .add-link-btn {
    border: 1.5px dashed var(--border); background: transparent;
    justify-content: center; color: var(--text-light);
    font-size: 0.78rem; gap: 6px;
  }
  .add-link-btn:hover {
    border-color: var(--accent); color: var(--accent);
    background: rgba(196, 114, 78, 0.02);
    transform: none; box-shadow: none;
  }
  .no-results {
    text-align: center; padding: 60px 20px;
    color: var(--text-light); font-size: 0.9rem;
  }
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(44, 44, 44, 0.2);
    backdrop-filter: blur(8px);
    z-index: 100; align-items: center; justify-content: center;
    animation: fadeIn 0.2s ease;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: var(--card); border-radius: 18px;
    padding: 32px; width: 90%; max-width: 420px;
    box-shadow: 0 24px 64px rgba(44, 44, 44, 0.12);
    animation: scaleIn 0.25s cubic-bezier(0.23, 1, 0.32, 1);
    max-height: 90vh; overflow-y: auto;
  }
  .modal h2 {
    font-family: 'DM Serif Display', serif;
    font-size: 1.3rem; font-weight: 400; margin-bottom: 22px;
  }
  .field { margin-bottom: 16px; }
  .field label {
    font-size: 0.7rem; font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.12em;
    color: var(--text-light); display: block; margin-bottom: 6px;
  }
  .field input, .field select {
    width: 100%; padding: 10px 14px;
    border: 1px solid var(--border); border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.88rem; color: var(--text);
    background: var(--bg); outline: none;
    transition: border-color 0.2s;
  }
  .field input:focus, .field select:focus { border-color: var(--accent); }
  .modal-actions {
    display: flex; gap: 10px;
    justify-content: flex-end; margin-top: 24px;
  }
  .context-menu {
    display: none; position: fixed;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 6px;
    box-shadow: 0 12px 32px rgba(44, 44, 44, 0.12);
    z-index: 200; min-width: 150px;
    animation: scaleIn 0.12s ease;
  }
  .context-menu.active { display: block; }
  .context-menu button {
    display: block; width: 100%; padding: 9px 14px;
    background: none; border: none;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.8rem; color: var(--text);
    cursor: pointer; border-radius: 8px;
    text-align: left; transition: background 0.15s;
  }
  .context-menu button:hover { background: var(--bg); }
  .context-menu button.danger { color: #c44e4e; }
  .divider { height: 1px; background: var(--border); margin: 4px 6px; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes scaleIn {
    from { opacity: 0; transform: scale(0.96); }
    to { opacity: 1; transform: scale(1); }
  }
  @media (max-width: 600px) {
    .header { flex-direction: column; align-items: flex-start; }
    .search-box { width: 100%; }
    .links-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
    .header-left h1 { font-size: 1.6rem; }
  }
</style>
</head>
<body>
<div class="header">
  <div class="header-left">
    <h1 id="greeting-text"></h1>
    <p id="date-text"></p>
  </div>
  <div class="header-actions">
    <div class="search-box">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="search-input" placeholder="Filter links... (Ctrl+K)" />
    </div>
    <button class="btn btn-outline" onclick="openCategoryModal()">+ Category</button>
    <button class="btn btn-primary" onclick="openLinkModal()">+ Link</button>
  </div>
</div>
<div class="sections" id="sections"></div>

<div class="modal-overlay" id="link-modal">
  <div class="modal">
    <h2 id="link-modal-title">Add Link</h2>
    <div class="field"><label>Name</label><input type="text" id="link-name" placeholder="e.g. YouTube" /></div>
    <div class="field"><label>URL</label><input type="text" id="link-url" placeholder="e.g. youtube.com" /></div>
    <div class="field"><label>Icon (emoji)</label><input type="text" id="link-emoji" placeholder="e.g. 🎬" maxlength="4" /></div>
    <div class="field"><label>Category</label><select id="link-category"></select></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('link-modal')">Cancel</button>
      <button class="btn btn-primary" id="link-save-btn" onclick="saveLink()">Add</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="cat-modal">
  <div class="modal">
    <h2 id="cat-modal-title">Add Category</h2>
    <div class="field"><label>Category Name</label><input type="text" id="cat-name" placeholder="e.g. Design Tools" /></div>
    <div class="field"><label>Icon (emoji)</label><input type="text" id="cat-emoji" placeholder="e.g. 🎨" maxlength="4" /></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('cat-modal')">Cancel</button>
      <button class="btn btn-primary" id="cat-save-btn" onclick="saveCategory()">Add</button>
    </div>
  </div>
</div>

<div class="context-menu" id="context-menu">
  <button onclick="ctxEdit()">Edit</button>
  <button onclick="ctxMoveUp()">Move to top</button>
  <div class="divider"></div>
  <button class="danger" onclick="ctxDelete()">Remove</button>
</div>

let data, editingLinkIndex = -1, editingCatId = null;
let ctxType = null, ctxIndex = -1, ctxCatId = null;

function load() {
  try {
    const s = localStorage.getItem(STORAGE_KEY);
    data = s ? JSON.parse(s) : JSON.parse(JSON.stringify(DEFAULT_DATA));
  } catch { data = JSON.parse(JSON.stringify(DEFAULT_DATA)); }
}
function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function setGreeting() {
  const h = new Date().getHours();
  let g = h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
  document.getElementById('greeting-text').textContent = g;
  document.getElementById('date-text').textContent =
    new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
}

function render(filter = '') {
  const container = document.getElementById('sections');
  container.innerHTML = '';
  const q = filter.toLowerCase().trim();
  let anyVisible = false;

  data.categories.forEach((cat, catIdx) => {
    let catLinks = data.links.filter(l => l.catId === cat.id);
    if (q) catLinks = catLinks.filter(l =>
      l.name.toLowerCase().includes(q) || l.url.toLowerCase().includes(q) || cat.name.toLowerCase().includes(q)
    );
    if (q && catLinks.length === 0) return;
    anyVisible = true;

    const section = document.createElement('div');
    section.className = 'section' + (data.collapsed[cat.id] ? ' collapsed' : '');
    section.style.animationDelay = catIdx * 0.04 + 's';

    section.innerHTML = `
      <div class="section-header">
        <div class="section-title-area" data-cat="${cat.id}">
          <div class="section-emoji">${cat.emoji || '📁'}</div>
          <span class="section-name">${escapeHtml(cat.name)}</span>
          <span class="section-count">${catLinks.length}</span>
          <span class="section-toggle">▼</span>
        </div>
        <div class="section-actions">
          <button class="btn btn-ghost btn-sm" data-addcat="${cat.id}">+ Add</button>
          <button class="btn btn-ghost btn-sm" data-editcat="${cat.id}">Edit</button>
          <button class="btn btn-ghost btn-sm btn-danger" data-delcat="${cat.id}">×</button>
        </div>
      </div>
      <div class="links-grid" id="grid-${cat.id}"></div>
    `;
    container.appendChild(section);

    section.querySelector('.section-title-area').addEventListener('click', () => {
      data.collapsed[cat.id] = !data.collapsed[cat.id]; save();
      render(document.getElementById('search-input').value);
    });
    section.querySelector('[data-addcat="'+cat.id+'"]').addEventListener('click', () => openLinkModal(-1, cat.id));
    section.querySelector('[data-editcat="'+cat.id+'"]').addEventListener('click', () => openCategoryModal(cat.id));
    section.querySelector('[data-delcat="'+cat.id+'"]').addEventListener('click', () => {
      if (confirm('Remove "'+cat.name+'" and all its links?')) {
        data.links = data.links.filter(l => l.catId !== cat.id);
        data.categories = data.categories.filter(c => c.id !== cat.id);
        save(); render(document.getElementById('search-input').value);
      }
    });

    if (!data.collapsed[cat.id]) {
      const grid = section.querySelector('#grid-'+cat.id);
      catLinks.forEach(link => {
        const gi = data.links.indexOf(link);
        const card = document.createElement('a');
        card.className = 'link-card';
        card.href = link.url.startsWith('http') ? link.url : 'https://' + link.url;
        card.innerHTML = '<div class="link-emoji">'+(link.emoji||'🔗')+'</div><span class="link-name">'+escapeHtml(link.name)+'</span>';
        card.addEventListener('contextmenu', e => { e.preventDefault(); showContextMenu(e.clientX, e.clientY, 'link', gi, cat.id); });
        grid.appendChild(card);
      });
      const addBtn = document.createElement('div');
      addBtn.className = 'link-card add-link-btn';
      addBtn.innerHTML = '<span>+</span>';
      addBtn.addEventListener('click', () => openLinkModal(-1, cat.id));
      grid.appendChild(addBtn);
    }
  });
  if (!anyVisible) container.innerHTML = '<div class="no-results">No links match your search.</div>';
}

document.getElementById('search-input').addEventListener('input', e => render(e.target.value));

function showContextMenu(x, y, type, index) {
  ctxType = type; ctxIndex = index;
  const menu = document.getElementById('context-menu');
  menu.style.left = Math.min(x, window.innerWidth - 170) + 'px';
  menu.style.top = Math.min(y, window.innerHeight - 130) + 'px';
  menu.classList.add('active');
}
function hideContextMenu() { document.getElementById('context-menu').classList.remove('active'); }

function ctxEdit() { hideContextMenu(); if (ctxType === 'link') openLinkModal(ctxIndex); }
function ctxMoveUp() {
  hideContextMenu();
  if (ctxType === 'link' && ctxIndex >= 0) {
    const link = data.links[ctxIndex];
    data.links.splice(ctxIndex, 1);
    const first = data.links.findIndex(l => l.catId === link.catId);
    data.links.splice(first >= 0 ? first : 0, 0, link);
    save(); render(document.getElementById('search-input').value);
  }
}
function ctxDelete() {
  hideContextMenu();
  if (ctxType === 'link' && ctxIndex >= 0) {
    data.links.splice(ctxIndex, 1); save();
    render(document.getElementById('search-input').value);
  }
}

function openLinkModal(index = -1, presetCatId = null) {
  editingLinkIndex = index;
  const catSelect = document.getElementById('link-category');
  catSelect.innerHTML = data.categories.map(c =>
    '<option value="'+c.id+'">'+c.emoji+' '+escapeHtml(c.name)+'</option>'
  ).join('');
  if (index >= 0) {
    const l = data.links[index];
    document.getElementById('link-modal-title').textContent = 'Edit Link';
    document.getElementById('link-save-btn').textContent = 'Save';
    document.getElementById('link-name').value = l.name;
    document.getElementById('link-url').value = l.url;
    document.getElementById('link-emoji').value = l.emoji || '';
    catSelect.value = l.catId;
  } else {
    document.getElementById('link-modal-title').textContent = 'Add Link';
    document.getElementById('link-save-btn').textContent = 'Add';
    document.getElementById('link-name').value = '';
    document.getElementById('link-url').value = '';
    document.getElementById('link-emoji').value = '';
    if (presetCatId) catSelect.value = presetCatId;
  }
  document.getElementById('link-modal').classList.add('active');
  setTimeout(() => document.getElementById('link-name').focus(), 100);
}

function saveLink() {
  const name = document.getElementById('link-name').value.trim();
  let url = document.getElementById('link-url').value.trim();
  const emoji = document.getElementById('link-emoji').value.trim() || '🔗';
  const catId = document.getElementById('link-category').value;
  if (!name || !url) return;
  if (!url.startsWith('http')) url = 'https://' + url;
  if (editingLinkIndex >= 0) data.links[editingLinkIndex] = { name, url, emoji, catId };
  else data.links.push({ name, url, emoji, catId });
  save(); render(document.getElementById('search-input').value);
  closeModal('link-modal');
}

function openCategoryModal(catId = null) {
  editingCatId = catId;
  if (catId) {
    const c = data.categories.find(x => x.id === catId);
    document.getElementById('cat-modal-title').textContent = 'Edit Category';
    document.getElementById('cat-save-btn').textContent = 'Save';
    document.getElementById('cat-name').value = c.name;
    document.getElementById('cat-emoji').value = c.emoji || '';
  } else {
    document.getElementById('cat-modal-title').textContent = 'Add Category';
    document.getElementById('cat-save-btn').textContent = 'Add';
    document.getElementById('cat-name').value = '';
    document.getElementById('cat-emoji').value = '';
  }
  document.getElementById('cat-modal').classList.add('active');
  setTimeout(() => document.getElementById('cat-name').focus(), 100);
}

function saveCategory() {
  const name = document.getElementById('cat-name').value.trim();
  const emoji = document.getElementById('cat-emoji').value.trim() || '📁';
  if (!name) return;
  if (editingCatId) {
    const c = data.categories.find(x => x.id === editingCatId);
    c.name = name; c.emoji = emoji;
  } else {
    data.categories.push({ id: 'cat_' + Date.now(), name, emoji });
  }
  save(); render(document.getElementById('search-input').value);
  closeModal('cat-modal');
}

function closeModal(id) { document.getElementById(id).classList.remove('active'); }

document.addEventListener('click', e => {
  if (!e.target.closest('.context-menu')) hideContextMenu();
  if (e.target.classList.contains('modal-overlay')) e.target.classList.remove('active');
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeModal('link-modal'); closeModal('cat-modal'); hideContextMenu(); }
  if (e.key === 'Enter') {
    if (document.getElementById('link-modal').classList.contains('active')) saveLink();
    else if (document.getElementById('cat-modal').classList.contains('active')) saveCategory();
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); document.getElementById('search-input').focus(); }
});

load(); setGreeting(); render();
</script>
