<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Newww Tab</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      font: 100% monospace;
      --bg-color: #fff;
      --text-color: #000;
      --link-color: green;
      --box-border: #ffdddd;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #222;
        --text-color: #eee;
        --link-color: lightgreen;
        --box-border: #444;
      }
    }

    body {
      margin: 0;
      background-color: var(--bg-color);
      color: var(--text-color);
    }

    * {
      scrollbar-width: thin;
      scrollbar-color: #e0ffe0 var(--bg-color);
    }

    ::-webkit-scrollbar {
      width: 12px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg-color);
    }

    ::-webkit-scrollbar-thumb {
      background-color: #e0ffe0;
      border-radius: 6px;
      border: 3px solid var(--bg-color);
    }

    a {
      color: var(--link-color);
      text-decoration: none;
      font-size: 200%;
    }

    a:hover {
      text-decoration: underline;
    }

    .container {
      display: flex;
      flex-wrap: wrap;
      padding: 10px;
      gap: 4px;
    }

    .box {
      border: 1px solid var(--box-border);
      flex: 0 1 22ch;
      padding: 2px;
      overflow: auto;
      height: calc(100vh - 25px);
    }

    .box.collapsed {
      flex: 0 0 auto;
      width: auto;
      height: auto;
      overflow: hidden;
    }

    .box.collapsed .content {
      display: none;
    }

    .box-title {
      font-size: 150%;
      font-weight: bold;
      margin: 0 0 4px 0;
      cursor: pointer;
      user-select: none;
    }

    .box-title:hover {
      text-decoration: underline;
    }

    .content > :first-child {
      margin-top: 0;
    }

    details {
      margin-bottom: 1rem;
    }

    summary {
      cursor: pointer;
      font-size: 1.5rem;
      font-weight: bold;
      outline: none;
    }

    .loading {
      opacity: 0.5;
    }

    textarea {
      background: var(--bg-color);
      color: var(--text-color);
      border: 1px solid var(--box-border);
      font-family: monospace;
    }

    .edit-link {
      font-size: 100%;
      text-decoration: none;
      cursor: pointer;
    }

    .tooltip {
      display: none;
    }
  </style>
</head>

<body>

  <div id="app" class="container"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/showdown/2.1.0/showdown.min.js"></script>

  <script>
    // Config
    const REPO = "theo-armour/sandbox";
    const BRANCH = "main";
    const DATA_PATH = "cookbook/newww-tab/data";
    const COLUMNS = ["theo", "reads", "news", "ai", "apps", "groups", "orgs"];
    const API_BASE = "https://api.github.com/repos/" + REPO + "/contents/" + DATA_PATH;
    const EDIT_BASE = "https://github.com/" + REPO + "/edit/" + BRANCH + "/" + DATA_PATH;

    // localStorage keys
    const COLLAPSE_KEY = "newww-tab-collapsed";
    const GAT_KEY = "newww-tab-gat";

    const converter = new showdown.Converter({
      simpleLineBreaks: true,
      simplifiedAutoLink: true,
      openLinksInNewWindow: true
    });

    const app = document.getElementById("app");

    function getCollapsed() {
      try { return JSON.parse(localStorage.getItem(COLLAPSE_KEY)) || []; }
      catch { return []; }
    }

    function saveCollapsed(list) {
      localStorage.setItem(COLLAPSE_KEY, JSON.stringify(list));
    }

    function getGat() {
      return localStorage.getItem(GAT_KEY) || "";
    }

    function apiHeaders() {
      const h = { Accept: "application/vnd.github.v3+json" };
      const gat = getGat();
      if (gat) h.Authorization = "token " + gat;
      return h;
    }

    // GAT settings UI
    const gatBtn = document.createElement("span");
    gatBtn.textContent = "🔑";
    gatBtn.style.cssText = "cursor:pointer;position:fixed;bottom:4px;right:8px;font-size:1.2rem;z-index:10;opacity:0.6;";
    gatBtn.title = "GitHub token settings";
    const gatPanel = document.createElement("div");
    gatPanel.style.cssText = "display:none;position:fixed;bottom:30px;right:8px;background:var(--bg-color);border:1px solid var(--box-border);padding:8px;z-index:10;font-family:monospace;";
    gatPanel.innerHTML = '<label style="font-size:0.8rem;">GitHub token<br>'
      + '<input id="gatInput" type="password" style="width:22ch;background:var(--bg-color);color:var(--text-color);border:1px solid var(--box-border);font-family:monospace;" /></label> '
      + '<button id="gatSave" style="font-family:monospace;">Save</button> '
      + '<button id="gatClear" style="font-family:monospace;">Clear</button>';
    document.body.appendChild(gatBtn);
    document.body.appendChild(gatPanel);
    gatBtn.addEventListener("click", () => {
      const visible = gatPanel.style.display !== "none";
      gatPanel.style.display = visible ? "none" : "block";
      if (!visible) document.getElementById("gatInput").value = getGat();
    });
    document.getElementById("gatSave").addEventListener("click", () => {
      localStorage.setItem(GAT_KEY, document.getElementById("gatInput").value.trim());
      gatPanel.style.display = "none";
      location.reload();
    });
    document.getElementById("gatClear").addEventListener("click", () => {
      localStorage.removeItem(GAT_KEY);
      document.getElementById("gatInput").value = "";
      gatPanel.style.display = "none";
      location.reload();
    });

    function makeEditLink(column, filename) {
      const a = document.createElement("a");
      a.className = "edit-link";
      a.href = EDIT_BASE + "/" + column + "/" + filename;
      a.target = "_blank";
      a.textContent = " ✏️";
      a.title = "Edit " + filename + " on GitHub";
      return a;
    }

    function renderFile(container, column, file) {
      const sectionContent = document.createElement("div");
      sectionContent.className = "loading";
      sectionContent.textContent = "Loading...";
      container.appendChild(sectionContent);

      fetch(file.download_url)
        .then(res => {
          if (!res.ok) throw new Error("Failed");
          return res.text();
        })
        .then(text => {
          sectionContent.innerHTML = converter.makeHtml(text);
          sectionContent.classList.remove("loading");
        })
        .catch(() => {
          sectionContent.innerHTML = '<p style="color:red">Error loading</p>';
          sectionContent.classList.remove("loading");
        });
    }

    // Build columns
    COLUMNS.forEach(column => {
      const box = document.createElement("div");
      box.className = "box";

      const collapsed = getCollapsed();
      if (collapsed.includes(column)) box.classList.add("collapsed");

      const title = document.createElement("div");
      title.className = "box-title";

      function updateTitle(editLink) {
        const isCollapsed = box.classList.contains("collapsed");
        title.textContent = (isCollapsed ? "▶ " : "▼ ") + column;
        if (editLink) title.appendChild(editLink);
      }
      updateTitle();

      let singleEditLink;
      title.addEventListener("click", () => {
        box.classList.toggle("collapsed");
        updateTitle(singleEditLink);
        const current = getCollapsed();
        if (box.classList.contains("collapsed")) {
          current.push(column);
        } else {
          const idx = current.indexOf(column);
          if (idx !== -1) current.splice(idx, 1);
        }
        saveCollapsed(current);
      });
      box.appendChild(title);

      const content = document.createElement("div");
      content.className = "content loading";
      content.textContent = "Loading...";
      box.appendChild(content);

      app.appendChild(box);

      // Fetch directory listing from GitHub API
      fetch(API_BASE + "/" + column, { headers: apiHeaders() })
        .then(res => {
          if (res.status === 403) throw new Error("rate-limited");
          if (!res.ok) throw new Error("api-error");
          return res.json();
        })
        .then(entries => {
          const mdFiles = entries
            .filter(e => e.type === "file" && e.name.endsWith(".md"))
            .sort((a, b) => a.name.localeCompare(b.name));

          content.textContent = "";
          content.classList.remove("loading");

          if (mdFiles.length === 0) {
            content.innerHTML = '<p style="color:orange">No .md files found</p>';
            return;
          }

          if (mdFiles.length === 1) {
            // Single file: pencil on column title, content renders directly
            const file = mdFiles[0];
            singleEditLink = makeEditLink(column, file.name);
            singleEditLink.addEventListener("click", e => e.stopPropagation());
            updateTitle(singleEditLink);
            renderFile(content, column, file);
          } else {
            // Multiple files: each in its own <details> with pencil on summary
            mdFiles.forEach(file => {
              const name = file.name.replace(".md", "");
              const section = document.createElement("details");
              section.open = true;
              const summary = document.createElement("summary");
              summary.textContent = name;
              summary.appendChild(makeEditLink(column, file.name));
              section.appendChild(summary);
              content.appendChild(section);
              renderFile(section, column, file);
            });
          }
        })
        .catch(err => {
          content.classList.remove("loading");
          if (err.message === "rate-limited") {
            content.innerHTML = '<p style="color:orange">API rate limited. Click 🔑 to add a GitHub token.</p>';
          } else {
            content.innerHTML = '<p style="color:red">Error loading column</p>';
          }
        });
    });
  </script>

</body>

</html>
