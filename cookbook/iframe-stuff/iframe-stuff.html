<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iframe Stuff</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    height: 100%;
    overflow: hidden;
    font-family: monospace;
}

.container {
    display: flex;
    height: 100vh;
}

.left-column {
    display: flex;
    flex-direction: column;
    flex: 1 1 20%;
    min-width: 100px;
}

.right-column {
    flex: 4 1 80%;
    min-width: 100px;
}

.left-row {
    min-height: 50px;
}

#leftRow1 { flex: 0 0 25%; }
#leftRow2 { flex: 0 0 10%; }
#leftRow3 { flex: 0 0 65%; }

iframe {
    width: 100%;
    height: 100%;
    border: 1px solid #ccc;
    display: block;
}

.splitter-v {
    width: 6px;
    cursor: col-resize;
    background: #ddd;
}

.splitter-h {
    height: 6px;
    cursor: row-resize;
    background: #ddd;
}

.splitter-v:hover, .splitter-h:hover {
    background: #aaa;
}
</style>
</head>
<body>

<div class="container">
    <div class="left-column">
        <div class="left-row" id="leftRow1">
            <iframe src="https://theo-armour.github.io/sandbox/cookbook/teodoro/"></iframe>
        </div>
        <div class="splitter-h" id="splitterH1"></div>
        <div class="left-row" id="leftRow2">
            <iframe src="https://theo-armour.github.io/sandbox/cookbook/iframe-stuff/iframe-director.html"></iframe>
        </div>
        <div class="splitter-h" id="splitterH2"></div>
        <div class="left-row" id="leftRow3">
            <iframe src="https://calendar.google.com/calendar/embed?height=600&wkst=1&bgcolor=%23ffffff&ctz=America%2FLos_Angeles&mode=AGENDA&showTitle=0&showPrint=0&showTz=0&src=dC5hcm1vdXJAZ21haWwuY29t&src=Mmw4cGp1MXB2czc0Ym42ZHY3NWY0Y2JjZjhAZ3JvdXAuY2FsZW5kYXIuZ29vZ2xlLmNvbQ&src=cnUyMXA3M2VkdDR2MHZqMXM2Zjc1aHRpMmtAZ3JvdXAuY2FsZW5kYXIuZ29vZ2xlLmNvbQ&src=ajIwNGYzMG1yczNmOTRwNGY5MmJkMjZjZnNAZ3JvdXAuY2FsZW5kYXIuZ29vZ2xlLmNvbQ&src=Y3RtY2xzY2d1NTVxazZwZXA5ZG84bm1wNGdAZ3JvdXAuY2FsZW5kYXIuZ29vZ2xlLmNvbQ&src=ZjBnOHM1ODNvcXF2ZG1zYnExbmJnMGhzZ2dAZ3JvdXAuY2FsZW5kYXIuZ29vZ2xlLmNvbQ&src=ZW4udXNhI2hvbGlkYXlAZ3JvdXAudi5jYWxlbmRhci5nb29nbGUuY29t&color=%23039BE5&color=%23616161&color=%23AD1457&color=%23F4511E&color=%23D50000&color=%230B8043&color=%23009688"></iframe>
        </div>
    </div>
    <div class="splitter-v" id="splitterV"></div>
    <div class="right-column">
        <iframe allow="autoplay" src="https://www.youtube.com/embed/ph1vpnYIxJk?autoplay=1&mute=1"></iframe>
    </div>
</div>

<script>
function getPos(e, axis) {
    if (e.touches) return axis === "x" ? e.touches[0].clientX : e.touches[0].clientY;
    return axis === "x" ? e.clientX : e.clientY;
}

function initSplitter(splitter, direction) {
    let startPos, startSizeBefore, startSizeAfter, before, after;

    function onStart(e) {
        e.preventDefault();
        before = splitter.previousElementSibling;
        after = splitter.nextElementSibling;

        if (direction === "horizontal") {
            startPos = getPos(e, "y");
            startSizeBefore = before.getBoundingClientRect().height;
            startSizeAfter = after.getBoundingClientRect().height;
        } else {
            startPos = getPos(e, "x");
            startSizeBefore = before.getBoundingClientRect().width;
            startSizeAfter = after.getBoundingClientRect().width;
        }

        document.addEventListener("mousemove", onMove);
        document.addEventListener("mouseup", onEnd);
        document.addEventListener("touchmove", onMove, { passive: false });
        document.addEventListener("touchend", onEnd);

        document.querySelectorAll("iframe").forEach(f => f.style.pointerEvents = "none");
    }

    function onMove(e) {
        e.preventDefault();
        const currentPos = direction === "horizontal" ? getPos(e, "y") : getPos(e, "x");
        const delta = currentPos - startPos;

        const newBefore = startSizeBefore + delta;
        const newAfter = startSizeAfter - delta;

        if (newBefore < 50 || newAfter < 50) return;

        if (direction === "horizontal") {
            before.style.flex = "none";
            after.style.flex = "none";
            before.style.height = newBefore + "px";
            after.style.height = newAfter + "px";
        } else {
            before.style.flex = "none";
            after.style.flex = "none";
            before.style.width = newBefore + "px";
            after.style.width = newAfter + "px";
        }
    }

    function onEnd() {
        document.removeEventListener("mousemove", onMove);
        document.removeEventListener("mouseup", onEnd);
        document.removeEventListener("touchmove", onMove);
        document.removeEventListener("touchend", onEnd);
        document.querySelectorAll("iframe").forEach(f => f.style.pointerEvents = "");
    }

    splitter.addEventListener("mousedown", onStart);
    splitter.addEventListener("touchstart", onStart, { passive: false });
}

initSplitter(document.getElementById("splitterV"), "vertical");
initSplitter(document.getElementById("splitterH1"), "horizontal");
initSplitter(document.getElementById("splitterH2"), "horizontal");
</script>

</body>
</html>
