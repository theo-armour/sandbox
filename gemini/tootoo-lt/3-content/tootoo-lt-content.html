<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="revised" content="2026-04-08 15:30">
  <title>TooToo LT</title>
  <style>
    :root {
      --primary-bg: #f3f4f6;
      --secondary-bg: #ffffff;
      --text-color: #1f2937;
      --border-color: #d1d5db;
      --highlight-color: #2563eb;
      --hover-bg: #e5e7eb;
      --font-family: system-ui, -apple-system, sans-serif;
      --sidebar-width: 300px;
      --font-size: 16px;
    }

    html {
      font-size: var(--font-size);
    }

    body.dark-mode {
      --primary-bg: #1f2937;
      --secondary-bg: #111827;
      --text-color: #f3f4f6;
      --border-color: #374151;
      --highlight-color: #3b82f6;
      --hover-bg: #374151;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      margin: 0;
      overflow-x: hidden;
      font-family: var(--font-family);
      color: var(--text-color);
      background-color: var(--primary-bg);
    }

    header {
      display: flex;
      flex-flow: row wrap;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      background: var(--primary-bg);
      border-bottom: 1px solid var(--border-color);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
      z-index: 10;
    }

    #headerGitHub {
      display: flex;
      align-items: center;
      color: inherit;
    }

    #headerTitle {
      font-weight: bold;
      font-size: 1.1rem;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
    }

    .header-btn {
      background: var(--secondary-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 0.4rem 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    .header-btn:hover {
      opacity: 0.88;
      transform: translateY(-1px);
    }

    .header-btn:active {
      transform: translateY(0);
    }

    .dark-mode-btn {
      margin-left: auto;
    }

    button.primary,
    button.secondary {
      background: var(--highlight-color);
      color: #ffffff;
      border: none;
      padding: 0.4rem 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    button.primary:hover,
    button.secondary:hover {
      opacity: 0.88;
      transform: translateY(-1px);
    }

    button.primary:active,
    button.secondary:active {
      transform: translateY(0);
    }

    .rate-limit-badge {
      display: none;
      font-size: 0.8rem;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      background: var(--hover-bg);
    }

    main {
      display: flex;
      flex-direction: row;
      flex: 1;
      overflow: hidden;
    }

    .sidebar {
      width: var(--sidebar-width);
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: var(--primary-bg);
      padding: 0;
      overflow: hidden;
    }

    .resizer {
      width: 8px;
      background: var(--highlight-color);
      opacity: 0.7;
      cursor: col-resize;
      touch-action: none;
      transition: opacity 0.2s;
    }

    .resizer:hover,
    .resizer.dragging {
      opacity: 1;
    }

    .content-area {
      flex: 1;
      min-width: 0;
      padding: 0;
      overflow-y: auto;
      background: var(--secondary-bg);
      position: relative;
    }

    #contentBody {
      padding: 0 1rem 1rem 1rem;
      background: var(--secondary-bg);
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 0.5rem;
      border-bottom: 1px solid var(--border-color);
      background: var(--primary-bg);
    }

    .panel-header h3 {
      margin: 0;
      font-size: 0.95rem;
    }

    .file-header {
      position: sticky;
      top: 0;
      z-index: 5;
      padding: 0.5rem 1rem;
      background: var(--primary-bg);
    }

    #treeFilter {
      margin: 0.4rem 0.5rem 0 0.5rem;
      width: calc(100% - 1rem);
      box-sizing: border-box;
      padding: 0.3rem 0.5rem;
      font-size: 0.85rem;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      background: var(--secondary-bg);
      color: var(--text-color);
      outline: none;
    }

    #treeFilter:focus {
      border-color: var(--highlight-color);
    }

    #treeList {
      padding: 0 0.5rem;
      flex: 1;
      overflow-y: auto;
    }

    .back-to-top {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      z-index: 20;
      background-color: var(--highlight-color);
      color: #ffffff;
      border: none;
      border-radius: 50%;
      width: 2.5rem;
      height: 2.5rem;
      font-size: 1.2rem;
      display: none;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
      cursor: pointer;
      align-items: center;
      justify-content: center;
    }

    /* Treeview CSS */
    .tree-folder {
      display: flex;
      align-items: center;
      padding: 0.2rem 0.4rem;
      cursor: pointer;
      border-radius: 4px;
      font-family: monospace;
      font-size: 0.85rem;
      user-select: none;
      list-style: none;
    }

    .tree-folder::-webkit-details-marker {
      display: none;
    }

    .tree-folder:hover {
      background: var(--hover-bg);
    }

    .tree-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.2rem 0.4rem 0.2rem 1.2rem;
      cursor: pointer;
      border-radius: 4px;
      font-family: monospace;
      font-size: 0.85rem;
    }

    .tree-item:hover {
      background: var(--hover-bg);
    }

    .tree-item.active {
      background: var(--highlight-color);
      color: #fff;
    }

    .tree-item-size {
      font-size: 0.75rem;
      opacity: 0.6;
      margin-left: 0.5rem;
      white-space: nowrap;
    }

    details details {
      padding-left: 0.8rem;
    }

    details {
      padding-left: 0;
    }

    #treeRenderStatus {
      font-size: 0.85rem;
      color: var(--text-color);
      opacity: 0.7;
      padding: 0.3rem 0.5rem;
    }

    .truncation-warning {
      background: #fff3cd;
      border: 1px solid #ffc107;
      padding: 0.5rem;
      border-radius: 4px;
      margin-bottom: 0.5rem;
      font-size: 0.85rem;
    }

    @media (max-width: 768px) {
      .sidebar {
        width: 25% !important;
      }

      .resizer {
        width: 4px;
      }

      .file-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.5rem;
      }
    }
  
    .markdown-body { max-width: 700px; line-height: 1.6; word-wrap: break-word; }
    .markdown-body img { max-width: 100%; height: auto; }
    pre { max-width: 700px; overflow-x: auto; padding: 1rem; border-radius: 6px; background: var(--secondary-bg); border: 1px solid var(--border-color); white-space: pre-wrap; word-wrap: break-word; }
    body.dark-mode .markdown-body { color: var(--text-color); }
    body.dark-mode pre { background-color: var(--secondary-bg); }
    .file-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; background: var(--secondary-bg); }
    .file-title { display: flex; align-items: center; gap: 0.5rem; min-width: 0; flex-wrap: wrap; }
    .file-title a.breadcrumb-link { color: var(--highlight-color); cursor: pointer; text-decoration: none; }
    .file-title a.breadcrumb-link:hover { text-decoration: underline; }
    .file-actions { display: flex; gap: 0.4rem; align-items: center; flex-shrink: 0; }
    .file-btn { padding: 0.3rem 0.6rem; font-size: 0.8rem; border-radius: 6px; cursor: pointer; border: 1px solid var(--border-color); background: var(--secondary-bg); color: var(--text-color); }
    .file-btn:hover { opacity: 0.88; }
    .media-content { max-width: 100%; border-radius: 4px; }
    .iframe-content { width: 100%; height: 70vh; border: 1px solid var(--border-color); border-radius: 4px; background: #fff; }
    .xlsx-sheet table { border-collapse: collapse; width: 100%; margin-bottom: 1rem; }
    .xlsx-sheet td, .xlsx-sheet th { border: 1px solid var(--border-color); padding: 0.3rem 0.5rem; font-size: 0.85rem; }
    .xlsx-sheet th { background: var(--primary-bg); font-weight: bold; }
    .md-error { background: #fff3cd; border: 1px solid #ffc107; padding: 0.5rem; border-radius: 4px; margin-bottom: 0.5rem; font-size: 0.85rem; }
    body.dark-mode .md-error { background: #3a3000; border-color: #665200; }
</style>

<body>

  <header>
    <a id="headerGitHub" href="#" title="View on GitHub">
      <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor">
        <path
          d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z" />

  <main>

    <div class="sidebar">

        <button id="btnExpandAll" class="secondary" style="display: none;" title="Expand All Folders">Expand
          All</button>

  <script>
    const escapeHTML = ( str ) => {
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
      return String( str ).replace( /[&<>"']/g, ( c ) => map[ c ] );
    };

    const CONFIG = {
      owner: 'theo-armour',
      repo: 'sandbox',
      branch: '',
    };

    const state = {
      owner: '',
      repo: '',
      branch: '',
      tree: null,
      currentFilePath: '',
    };

    let currentAbortController = null;

    const storageKey = ( suffix ) => `tootoo-lt:${ location.pathname }:${ suffix }`;

    const getAuthHeaders = () => {
      const token = localStorage.getItem( 'githubToken' );
      const headers = { Accept: 'application/vnd.github.v3+json' };
      if ( token ) headers.Authorization = `token ${ token }`;
      return headers;
    };

    const updateRateBadge = ( response ) => {
      const remaining = response.headers.get( 'X-RateLimit-Remaining' );
      const limit = response.headers.get( 'X-RateLimit-Limit' );
      if ( remaining && limit ) {
        const badge = document.getElementById( 'rateBadge' );
        badge.style.display = 'inline';
        badge.textContent = `${ remaining }/${ limit }`;
      }
    };

    const updateHeaderFromConfig = () => {
      const title = `${ state.owner } / ${ state.repo }`;
      document.title = title;
      document.getElementById( 'headerTitle' ).textContent = title;
      document.getElementById( 'headerGitHub' ).href = `https://github.com/${ encodeURIComponent( state.owner ) }/${ encodeURIComponent( state.repo ) }`;
    };

    // --- File icon helper ---
    const getFileIcon = ( filename ) => {
      const ext = filename.includes( '.' ) ? '.' + filename.split( '.' ).pop().toLowerCase() : '';
      const iconMap = {
        '.md': '📝',
        '.js': '🟨', '.mjs': '🟨', '.cjs': '🟨',
        '.ts': '🟦', '.tsx': '🟦',
        '.py': '🐍',
        '.html': '🌐', '.htm': '🌐',
        '.css': '🎨', '.scss': '🎨', '.less': '🎨',
        '.png': '🖼️', '.jpg': '🖼️', '.jpeg': '🖼️', '.gif': '🖼️', '.webp': '🖼️', '.svg': '🖼️', '.ico': '🖼️',
        '.mp3': '🎵', '.wav': '🎵', '.ogg': '🎵',
        '.mp4': '🎬', '.webm': '🎬',
        '.pdf': '📕',
        '.xlsx': '📊', '.xls': '📊', '.csv': '📊', '.ods': '📊',
        '.yaml': '⚙️', '.yml': '⚙️', '.toml': '⚙️',
        '.zip': '📦', '.tar': '📦', '.gz': '📦', '.7z': '📦',
        '.json': '{ }',
      };
      return iconMap[ ext ] ?? '📄';
    };

    // --- File size formatting ---
    const formatSize = ( bytes ) => {
      if ( bytes == null ) return '';
      if ( bytes < 1024 ) return `${ bytes } B`;
      if ( bytes < 1024 * 1024 ) return `${ ( bytes / 1024 ).toFixed( 1 ) } KB`;
      return `${ ( bytes / ( 1024 * 1024 ) ).toFixed( 1 ) } MB`;
    };

    // --- Build nested tree from flat array ---
    const buildNestedTree = ( flatTree ) => {
      const root = { children: {} };
      for ( const item of flatTree ) {
        const parts = item.path.split( '/' );
        // Filter out entries inside dot-folders
        if ( parts.some( ( p ) => p.startsWith( '.' ) ) ) continue;
        let current = root;
        for ( let i = 0; i < parts.length; i++ ) {
          const name = parts[ i ];
          if ( !current.children[ name ] ) {
            current.children[ name ] = { children: {}, type: 'tree', path: parts.slice( 0, i + 1 ).join( '/' ) };
          }
          if ( i === parts.length - 1 ) {
            current.children[ name ].type = item.type;
            current.children[ name ].size = item.size;
            current.children[ name ].path = item.path;
          }
          current = current.children[ name ];
        }
      }
      return root;
    };

    // --- Sort children: folders first, then alphabetically ---
    const sortedEntries = ( children ) =>
      Object.entries( children ).sort( ( [ aName, aNode ], [ bName, bNode ] ) => {
        const aIsFolder = Object.keys( aNode.children ).length > 0 || aNode.type === 'tree';
        const bIsFolder = Object.keys( bNode.children ).length > 0 || bNode.type === 'tree';
        if ( aIsFolder !== bIsFolder ) return aIsFolder ? -1 : 1;
        return aName.localeCompare( bName, undefined, { sensitivity: 'base' } );
      } );

    // --- Render a single node to HTML ---
    const renderNode = ( name, node ) => {
      const hasChildren = Object.keys( node.children ).length > 0;
      if ( hasChildren || node.type === 'tree' ) {
        const childrenHTML = sortedEntries( node.children )
          .map( ( [ childName, childNode ] ) => renderNode( childName, childNode ) )
          .join( '' );
        return `<details data-folder-path="${ escapeHTML( node.path ) }"><summary class="tree-folder" tabindex="0" title="${ escapeHTML( node.path ) }">📁 <span class="folder-name">${ escapeHTML( name ) }</span></summary>${ childrenHTML }</details>`;
      }
      const icon = getFileIcon( name );
      const size = formatSize( node.size );
      const isReadme = /^readme/i.test( name );
      const nameHTML = isReadme ? `<strong>${ escapeHTML( name ) }</strong>` : escapeHTML( name );
      return `<div class="tree-item" tabindex="0" data-action="select-file" data-path="${ escapeHTML( node.path ) }" title="${ escapeHTML( node.path ) }"><span class="tree-item-name">${ icon } ${ nameHTML }</span><span class="tree-item-size">${ escapeHTML( size ) }</span></div>`;
    };

    // --- Render tree with batched rendering ---
    const renderTree = ( treeArray ) => {
      const treeList = document.getElementById( 'treeList' );
      treeList.innerHTML = '';
      const nested = buildNestedTree( treeArray );
      const rootEntries = sortedEntries( nested.children );
      const batchSize = 120;
      let index = 0;

      const statusEl = document.createElement( 'div' );
      statusEl.id = 'treeRenderStatus';
      treeList.appendChild( statusEl );

      const renderBatch = () => {
        const end = Math.min( index + batchSize, rootEntries.length );
        let html = '';
        for ( let i = index; i < end; i++ ) {
          html += renderNode( rootEntries[ i ][ 0 ], rootEntries[ i ][ 1 ] );
        }
        treeList.insertAdjacentHTML( 'beforeend', html );
        index = end;
        const pct = Math.round( ( index / rootEntries.length ) * 100 );
        statusEl.textContent = `${ pct }% rendered…`;

        if ( index < rootEntries.length ) {
          setTimeout( renderBatch, 0 );
        } else {
          statusEl.remove();
          onTreeRenderComplete();
        }
      };

      if ( rootEntries.length === 0 ) {
        statusEl.remove();
        return;
      }
      renderBatch();
    };

    // --- After tree render completes ---
    const onTreeRenderComplete = () => {
      // Show expand all button
      document.getElementById( 'btnExpandAll' ).style.display = '';

      // Auto-open README
      autoOpenReadme();

      // Setup filter, keyboard nav, slash shortcut
      setupTreeFilter();
      setupKeyboardNav();
      setupSlashShortcut();
    };

    // --- Auto-open README ---
    const autoOpenReadme = () => {
      if ( !state.tree ) return;
      // Prefer root-level README
      const readme = state.tree.find( ( item ) =>
        item.type === 'blob' && /^readme\.(md|txt)$/i.test( item.path )
      ) ?? state.tree.find( ( item ) =>
        item.type === 'blob' && /\/readme\.(md|txt)$/i.test( item.path )
      );
      if ( readme ) {
        const el = document.querySelector( `[data-action="select-file"][data-path="${ CSS.escape( readme.path ) }"]` );
        if ( el ) {
          selectFile( el.dataset.path );
        }
      }
    };

    // --- File selection ---
    
    // --- Error Handlers ---
    window.addEventListener('error', (event) => {
      const errEl = document.createElement('div');
      errEl.className = 'md-error';
      errEl.innerHTML = `<strong>Error:</strong> ${escapeHTML(event.message)} <button onclick="location.reload()" class="file-btn">Reload</button>`;
      document.getElementById('contentBody').prepend(errEl);
    });
    window.addEventListener('unhandledrejection', (event) => {
      const errEl = document.createElement('div');
      errEl.className = 'md-error';
      errEl.innerHTML = `<strong>Promise Error:</strong> ${escapeHTML(event.reason?.message || event.reason)} <button onclick="location.reload()" class="file-btn">Reload</button>`;
      document.getElementById('contentBody').prepend(errEl);
    });

    const IMAGE_EXTS = ['png', 'jpg', 'jpeg', 'gif', 'webp', 'svg', 'ico'];
    const AUDIO_EXTS = ['mp3', 'wav', 'ogg'];
    const VIDEO_EXTS = ['mp4', 'webm'];
    const SHEET_EXTS = ['xlsx', 'xls', 'csv', 'ods'];
    const STREAMABLE_EXTS = [...IMAGE_EXTS, ...AUDIO_EXTS, ...VIDEO_EXTS, 'pdf'];
    const NO_COPY_EXTS = [...STREAMABLE_EXTS, ...SHEET_EXTS];
    const LARGE_FILE_WARNING_BYTES = 1024 * 1024;
    const approvedLargeFiles = new Set();
    const activeBlobUrls = new Set();

    window.addEventListener('beforeunload', () => {
      activeBlobUrls.forEach((url) => URL.revokeObjectURL(url));
    });

    const fileTextCache = new Map();
    const getFileCacheKey = (path) => `${state.owner}/${state.repo}/${state.branch}/${path}`;
    const getCachedFileText = (path) => {
      const key = getFileCacheKey(path);
      if (fileTextCache.has(key)) {
        const text = fileTextCache.get(key);
        fileTextCache.delete(key);
        fileTextCache.set(key, text); // LRU refresh
        return text;
      }
      return null;
    };
    const setCachedFileText = (path, text) => {
      if (text.length > 300000) return;
      const key = getFileCacheKey(path);
      if (fileTextCache.has(key)) {
        fileTextCache.delete(key);
      }
      fileTextCache.set(key, text);
      if (fileTextCache.size > 25) {
        const firstKey = fileTextCache.keys().next().value;
        fileTextCache.delete(firstKey);
      }
      localStorage.setItem(storageKey('fileTextCache'), JSON.stringify([...fileTextCache]));
    };

    const getViewPrefKey = (ext) => storageKey(`viewPref:${ext}`);
    const getPreferredView = (ext) => localStorage.getItem(getViewPrefKey(ext)) || 'rendered';
    const setPreferredView = (ext, view) => localStorage.setItem(getViewPrefKey(ext), view);

    const setHljsTheme = (isDark) => {
      const link = document.getElementById("hljsTheme");
      if (link) {
        link.href = isDark
          ? "https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css"
          : "https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css";
      }
    };

    const apiHeaders = () => {
      const headers = getAuthHeaders();
      return headers;
    };

    const resetToHome = () => {
      localStorage.removeItem(storageKey('lastFilePath'));
      state.currentFilePath = '';
      state.tree = null;
      try { history.replaceState(null, '', location.pathname + location.search); } catch(e) {}
      fetchTree();
    };

    const buildBreadcrumbs = (path) => {
      const parts = path.split('/');

    const updateHash = (path) => {
      if (path) history.pushState(null, '', '#' + path);

    const handleHashChange = () => {
      const path = location.hash.slice(1);

    const selectFile = async (path, skipHash = false) => {

      const size = treeItem?.size || 0;

      if (size > LARGE_FILE_WARNING_BYTES && !STREAMABLE_EXTS.includes(ext) && !approvedLargeFiles.has(path)) {

      // Build Header

            <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/></svg>
          </a>

      `;
      const fileHeaderEl = document.querySelector('.file-header');

      const contentBody = document.getElementById('contentBody');

      if (!skipHash) updateHash(path);
      localStorage.setItem(storageKey('lastFilePath'), path);

      const isUserPage = state.repo.toLowerCase() === `${state.owner.toLowerCase()}.github.io`;
      const pagesUrl = isUserPage ? `https://${state.owner}.github.io/${path}` : `https://${state.owner}.github.io/${state.repo}/${path}`;

      const setupActions = (text = null) => {
        const actionsEl = document.getElementById('fileActions');
        actionsEl.innerHTML = '';

        if (['md', 'html', 'htm', 'svg'].includes(ext)) {
          const pref = getPreferredView(ext);

          btnRendered.className = 'file-btn';

          const btnRaw = document.createElement('button');

          btnRendered.onclick = () => {

          btnRaw.onclick = () => {

        if (!NO_COPY_EXTS.includes(ext) && text !== null) {

      activeBlobUrls.forEach((url) => URL.revokeObjectURL(url));

      try {
        const token = localStorage.getItem('githubToken');
        
        if (STREAMABLE_EXTS.includes(ext) || SHEET_EXTS.includes(ext)) {
          let objectUrl = '';
          if (token) {
            const resp = await fetch(`https://api.github.com/repos/${state.owner}/${state.repo}/contents/${path}?ref=${state.branch}`, {

            if (!resp.ok) throw new Error(`Fetch failed: ${resp.status}`);
            const blob = await resp.blob();
            objectUrl = URL.createObjectURL(blob);

            objectUrl = `https://raw.githubusercontent.com/${state.owner}/${state.repo}/${state.branch}/${path}`;

          setupActions();

          if (IMAGE_EXTS.includes(ext)) {

                const text = await textResp.text();
                setupActions(text);
                const pref = getPreferredView(ext);
                contentBody.innerHTML = `
                  <div id="viewRendered" style="display: ${pref === 'rendered' ? '' : 'none'}"><img src="${objectUrl}" class="media-content" alt="${escapeHTML(fileName)}"></div>
                  <pre id="viewRaw" style="display: ${pref === 'raw' ? '' : 'none'}"><code>${escapeHTML(text)}</code></pre>
                `;
             } else {
               contentBody.innerHTML = `<img src="${objectUrl}" class="media-content" alt="${escapeHTML(fileName)}">`;

          } else if (AUDIO_EXTS.includes(ext)) {
            contentBody.innerHTML = `<audio controls src="${objectUrl}" class="media-content"></audio>`;
          } else if (VIDEO_EXTS.includes(ext)) {
            contentBody.innerHTML = `<video controls src="${objectUrl}" class="media-content"></video>`;
          } else if (ext === 'pdf') {
            if (token) {
              contentBody.innerHTML = `<iframe src="${objectUrl}" class="iframe-content"></iframe>`;
            } else {

            }
          } else if (SHEET_EXTS.includes(ext)) {
            const abResp = await fetch(objectUrl);
            const arrayBuffer = await abResp.arrayBuffer();
            const workbook = XLSX.read(arrayBuffer, { type: 'array' });
            let htmlOut = '';
            for (const sheetName of workbook.SheetNames) {
              const sheetHtml = XLSX.utils.sheet_to_html(workbook.Sheets[sheetName]);
              htmlOut += `<div class="xlsx-sheet"><h3>${escapeHTML(sheetName)}</h3>${sheetHtml}</div>`;
            }
            contentBody.innerHTML = DOMPurify.sanitize(htmlOut);
          }
          document.getElementById('contentArea').scrollTo({ top: 0 });
          return;
        } // End streamables

        let text = getCachedFileText(path);
        if (text === null) {
          const url = token ? `https://api.github.com/repos/${state.owner}/${state.repo}/contents/${path}?ref=${state.branch}` : `https://raw.githubusercontent.com/${state.owner}/${state.repo}/${state.branch}/${path}`;
          const h = token ? { ...apiHeaders(), Accept: 'application/vnd.github.raw+json' } : {};
          const resp = await fetch(url, { headers: h, signal });
          if (!resp.ok) throw new Error(`Fetch failed: ${resp.status}`);
          text = await resp.text();
          setCachedFileText(path, text);
        }

        setupActions(text);
        const pref = getPreferredView(ext);

        if (ext === 'md') {
           try {
             let html = marked.parse(text);
             contentBody.innerHTML = `
                <div class="markdown-body" id="viewRendered" style="display: ${pref === 'rendered' ? '' : 'none'}">${html}</div>
                <pre id="viewRaw" style="display: ${pref === 'raw' ? '' : 'none'}"><code>${escapeHTML(text)}</code></pre>
             `;
             
             // Rewrite links
             const mdBody = document.getElementById('viewRendered');
             const links = mdBody.querySelectorAll('a');
             const currentDir = path.includes('/') ? path.substring(0, path.lastIndexOf('/')) : '';
             
             for (const a of links) {
                const href = a.getAttribute('href');
                if (!href || href.startsWith('#')) continue;
                
                if (href.startsWith('http')) {
                   const ghMatch = href.match(new RegExp(`github\.com/${state.owner}/${state.repo}/blob/[^/]+/(.*)`));
                   if (ghMatch) {
                      a.onclick = (e) => { e.preventDefault(); selectFile(ghMatch[1]); };
                      a.href = '#' + ghMatch[1];
                   } else {
                     a.target = '_blank';
                     a.rel = 'noopener';
                   }
                } else {
                   // Relative path
                   const resolved = currentDir ? currentDir + '/' + href : href;
                   a.onclick = (e) => { e.preventDefault(); selectFile(resolved); };
                   a.href = '#' + resolved;
                }
             }
           } catch(e) {
             contentBody.innerHTML = `<div class="md-error">⚠️ Markdown rendering failed: ${escapeHTML(e.message)}</div><pre><code>${escapeHTML(text)}</code></pre>`;
           }
        } else if (['html', 'htm'].includes(ext)) {
           const blob = new Blob([text], { type: 'text/html' });
           const objectUrl = URL.createObjectURL(blob);
           activeBlobUrls.add(objectUrl);
           contentBody.innerHTML = `
              <div id="viewRendered" style="display: ${pref === 'rendered' ? '' : 'none'}"><iframe src="${objectUrl}" sandbox="allow-scripts" class="iframe-content"></iframe></div>
              <pre id="viewRaw" style="display: ${pref === 'raw' ? '' : 'none'}"><code>${escapeHTML(text)}</code></pre>
           `;
           if (size < 500000 && document.getElementById('viewRaw')?.querySelector('code')) {
             hljs.highlightElement(document.getElementById('viewRaw').querySelector('code'));
           }

    };


    // Event delegation for file selection
    document.getElementById( 'treeList' ).addEventListener( 'click', ( e ) => {

      if ( item ) selectFile( item.dataset.path );
    } );

    // --- Expand All / Collapse All ---
    document.getElementById( 'btnExpandAll' ).addEventListener( 'click', () => {
      const btn = document.getElementById( 'btnExpandAll' );
      const treeList = document.getElementById( 'treeList' );
      const allDetails = treeList.querySelectorAll( 'details' );
      const expanding = btn.textContent === 'Expand All';
      allDetails.forEach( ( d ) => { d.open = expanding; } );
      btn.textContent = expanding ? 'Collapse All' : 'Expand All';
    } );

    // --- Tree filter (debounced) ---
    const setupTreeFilter = () => {
      let timer = null;
      document.getElementById( 'treeFilter' ).addEventListener( 'input', ( e ) => {
        clearTimeout( timer );
        timer = setTimeout( () => filterTree( e.target.value ), 150 );
      } );
    };

    const filterTree = ( query ) => {
      const q = query.trim().toLowerCase();
      const treeList = document.getElementById( 'treeList' );
      const items = treeList.querySelectorAll( '.tree-item' );
      const details = treeList.querySelectorAll( 'details' );

      if ( !q ) {
        items.forEach( ( el ) => { el.style.display = ''; } );
        details.forEach( ( el ) => { el.style.display = ''; } );
        return;
      }

      items.forEach( ( el ) => {
        const match = el.dataset.path.toLowerCase().includes( q );
        el.style.display = match ? '' : 'none';
      } );

      // Show/open folders that have visible children
      // Process innermost first by reversing
      [ ...details ].reverse().forEach( ( det ) => {
        const hasVisible = det.querySelector( '.tree-item:not([style*="display: none"])' );
        det.style.display = hasVisible ? '' : 'none';
        if ( hasVisible ) det.open = true;
      } );
    };

    // --- Keyboard navigation ---
    const getVisibleTreeItems = () => {
      const treeList = document.getElementById( 'treeList' );
      const all = treeList.querySelectorAll( '.tree-folder, .tree-item' );
      return [ ...all ].filter( ( el ) => {
        if ( el.style.display === 'none' ) return false;
        // Check all ancestor details are open
        let parent = el.parentElement;
        while ( parent && parent.id !== 'treeList' ) {
          if ( parent.tagName === 'DETAILS' && !parent.open ) {
            // Allow the summary itself (direct child)
            if ( el.tagName === 'SUMMARY' && el.parentElement === parent ) {
              // visible
            } else {
              return false;
            }
          }
          parent = parent.parentElement;
        }
        return true;
      } );
    };

    const setupKeyboardNav = () => {
      document.addEventListener( 'keydown', ( e ) => {
        const focused = document.activeElement;
        const inTree = focused?.closest( '#treeList' ) && ( focused.classList.contains( 'tree-folder' ) || focused.classList.contains( 'tree-item' ) );
        if ( !inTree ) return;

        const visible = getVisibleTreeItems();
        const idx = visible.indexOf( focused );
        if ( idx === -1 ) return;

        const isFolder = focused.classList.contains( 'tree-folder' );
        const detailsEl = isFolder ? focused.parentElement : null;

        switch ( e.key ) {
          case 'ArrowDown': {
            e.preventDefault();
            const next = visible[ idx + 1 ];
            if ( next ) {
              next.focus();
              if ( next.classList.contains( 'tree-item' ) ) selectFile( next.dataset.path );
            }
            break;
          }
          case 'ArrowUp': {
            e.preventDefault();
            const prev = visible[ idx - 1 ];
            if ( prev ) {
              prev.focus();
              if ( prev.classList.contains( 'tree-item' ) ) selectFile( prev.dataset.path );
            }
            break;
          }
          case 'Enter':
          case ' ': {
            e.preventDefault();
            if ( isFolder ) {
              detailsEl.open = !detailsEl.open;
            } else {
              selectFile( focused.dataset.path );
            }
            break;
          }
          case 'ArrowRight': {
            e.preventDefault();
            if ( isFolder ) {
              if ( !detailsEl.open ) {
                detailsEl.open = true;
              } else {
                // Focus first child
                const firstChild = detailsEl.querySelector( '.tree-folder, .tree-item' );
                if ( firstChild && firstChild !== focused ) firstChild.focus();
              }
            }
            break;
          }
          case 'ArrowLeft': {
            e.preventDefault();
            if ( isFolder && detailsEl.open ) {
              detailsEl.open = false;
            } else {
              // Move to parent folder
              const parentDetails = focused.closest( 'details' )?.parentElement?.closest( 'details' );
              if ( parentDetails ) {
                const parentSummary = parentDetails.querySelector( ':scope > summary' );
                if ( parentSummary ) parentSummary.focus();
              }
            }
            break;
          }
        }
      } );
    };

      if ( !target ) return;

      let parent = target.parentElement?.closest( 'details' );

        parent.open = true;
        parent = parent.parentElement?.closest( 'details' );

      target.querySelector( 'summary' )?.scrollIntoView( { block: 'center', behavior: 'smooth' } );

    // --- Layout listeners (from layout shell) ---
    const initAppearance = () => {

      const sw = localStorage.getItem( storageKey( 'sidebarWidth' ) );
      if ( sw ) document.documentElement.style.setProperty( '--sidebar-width', sw );
    };
      const fs = localStorage.getItem( storageKey( 'fontSize' ) );

      const sw = localStorage.getItem( storageKey( 'sidebarWidth' ) );

    const setupListeners = () => {

      const getFontSize = () => parseInt( getComputedStyle( document.documentElement ).getPropertyValue( '--font-size' ) ) || 16;

      document.getElementById( 'btnFontInc' ).addEventListener( 'click', () => {
        const sz = Math.min( getFontSize() + 2, 28 );
        document.documentElement.style.setProperty( '--font-size', sz + 'px' );
        localStorage.setItem( storageKey( 'fontSize' ), sz + 'px' );
      } );

      document.getElementById( 'btnFontDec' ).addEventListener( 'click', () => {

      const resizer = document.getElementById( 'resizer' );

        resizer.classList.add( 'dragging' );
        document.body.style.userSelect = 'none';

      resizer.addEventListener( 'pointermove', ( e ) => {

    // --- Fetch tree from GitHub API ---
    const fetchTree = async () => {
      if ( currentAbortController ) currentAbortController.abort();
      currentAbortController = new AbortController();
      const signal = currentAbortController.signal;
      const headers = getAuthHeaders();
      const treeList = document.getElementById( 'treeList' );

      try {
        // Fetch default branch if needed
        if ( !state.branch ) {
          const repoResp = await fetch(
            `https://api.github.com/repos/${ encodeURIComponent( state.owner ) }/${ encodeURIComponent( state.repo ) }`,
            { headers, signal }
          );
          updateRateBadge( repoResp );
          if ( !repoResp.ok ) throw new Error( `Repo fetch failed: ${ repoResp.status }` );
          const repoData = await repoResp.json();
          state.branch = repoData.default_branch;
        }

        // Fetch tree
        const treeResp = await fetch(
          `https://api.github.com/repos/${ encodeURIComponent( state.owner ) }/${ encodeURIComponent( state.repo ) }/git/trees/${ encodeURIComponent( state.branch ) }?recursive=1`,
          { headers, signal }
        );
        updateRateBadge( treeResp );
        if ( !treeResp.ok ) {
          if ( treeResp.status === 403 ) {
            treeList.innerHTML = `<p style="color:red;padding:0.5rem;">Rate limited. Add a GitHub token for higher limits.</p>`;
            return;
          }
          throw new Error( `Tree fetch failed: ${ treeResp.status }` );
        }
        const treeData = await treeResp.json();

        if ( treeData.truncated ) {
          treeList.innerHTML = `<div class="truncation-warning">⚠️ Repository tree is truncated. Some files may not appear.</div>`;
        }

        state.tree = treeData.tree;
        renderTree( state.tree );

      } catch ( err ) {
        if ( err.name === 'AbortError' ) return;
        treeList.innerHTML = `<p style="color:red;padding:0.5rem;">${ escapeHTML( err.message ) }</p>`;
      }

    // --- Init ---
    const init = async () => {
      try {
        const cacheStr = localStorage.getItem(storageKey('fileTextCache'));
        if (cacheStr) {
          const arr = JSON.parse(cacheStr);
          for (const [k, v] of arr) fileTextCache.set(k, v);
        }
      } catch(e) {}

      initAppearance();
      setupListeners();

      state.owner = CONFIG.owner;
      state.repo = CONFIG.repo;
      state.branch = CONFIG.branch;

      if ( state.owner && state.repo ) {
        updateHeaderFromConfig();
        document.getElementById( 'contentBody' ).innerHTML = '<p>Loading tree…</p>';
        await fetchTree();
        
        if (location.hash && location.hash.length > 1) {

           const lastPath = localStorage.getItem(storageKey('lastFilePath'));
           if (lastPath) {
             const el = document.querySelector(`[data-action="select-file"][data-path="${CSS.escape(lastPath)}"]`);
             if (el) selectFile(lastPath, true);
           }
        }
      }
    };

    init();
  </script>
</body>
