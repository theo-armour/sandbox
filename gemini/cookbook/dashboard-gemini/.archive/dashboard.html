<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="revised" content="2026-04-19 00:00">
  <style>
    :root {
      --bg: #ffffff;
      --fg: #000000;
      --btn-bg: #e5e5ea;
      --btn-hover: #d1d1d6;
      --muted: #6e6e73;
      --panel-border: #d2d2d7;
      --accent: #0a7f5a;
      --font: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1e;
        --fg: #ffffff;
        --btn-bg: #2c2c2e;
        --btn-hover: #3a3a3c;
        --muted: #98989d;
        --panel-border: #3a3a3c;
        --accent: #56d6a9;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
      overflow: auto;
    }

    body {
      background-color: var(--bg);
      color: var(--fg);
      font-family: var(--font);
      font-size: clamp(0.85rem, 2.5vw, 1rem);
      padding: clamp(0.5rem, 3vw, 1.5rem);
    }

    .dashboard-grid {
      display: grid;
      gap: clamp(0.75rem, 3vw, 1rem);
      grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr));
      align-items: start;
    }

    .panel {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      min-height: 100%;
      padding: 0.9rem;
      border: 1px solid var(--panel-border);
      border-radius: 0.75rem;
      background: color-mix(in srgb, var(--bg) 88%, var(--btn-bg) 12%);
    }

    h2 {
      font-size: clamp(0.7rem, 2vw, 0.8rem);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      font-weight: 600;
    }

    .panel-wide {
      grid-column: span 2;
    }

    @media (max-width: 700px) {
      .panel-wide {
        grid-column: span 1;
      }
    }

    #clock {
      font-size: clamp(2rem, 12vw, 3.5rem);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    #date {
      font-size: clamp(0.85rem, 2.5vw, 1rem);
      color: var(--muted);
    }

    .github-link {
      color: var(--fg);
      text-decoration: none;
      word-break: break-word;
    }

    .github-link:hover {
      text-decoration: underline;
    }

    #weather-info {
      color: var(--muted);
      font-style: italic;
    }

    .weather-temp {
      font-size: clamp(1.2rem, 4vw, 1.7rem);
      font-weight: 600;
    }

    .focus-list {
      margin-left: 1.25rem;
      display: grid;
      gap: 0.35rem;
    }

    .focus-list li::marker {
      color: var(--accent);
      font-weight: 700;
    }

    .links-list {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
    }

    .links-list a {
      display: inline-block;
      background: var(--btn-bg);
      color: var(--fg);
      text-decoration: none;
      padding: 0.3rem 0.6rem;
      border-radius: 0.3rem;
      font-size: clamp(0.8rem, 2.2vw, 0.9rem);
      transition: background-color 0.2s;
    }

    .links-list a:hover {
      background: var(--btn-hover);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: clamp(0.8rem, 2vw, 0.9rem);
    }

    th,
    td {
      padding: 0.55rem 0.35rem;
      border-bottom: 1px solid var(--panel-border);
      text-align: left;
      vertical-align: top;
    }

    th {
      color: var(--muted);
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-weight: 600;
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      padding: 0.15rem 0.45rem;
      border-radius: 999px;
      background: var(--btn-bg);
      font-size: 0.75rem;
      color: var(--muted);
      white-space: nowrap;
    }

    #notes {
      width: 100%;
      min-height: 8rem;
      resize: vertical;
      background: var(--btn-bg);
      color: var(--fg);
      border: none;
      border-radius: 0.3rem;
      padding: 0.5rem;
      font-family: var(--font);
      font-size: clamp(0.8rem, 2.2vw, 0.9rem);
      line-height: 1.4;
    }

    #notes:focus {
      outline: 2px solid var(--muted);
    }
  </style>
</head>

<body>
  <main class="dashboard-grid">
    <section class="panel panel-wide" id="clock-section">
      <h2>Now</h2>
      <div id="clock">00:00</div>
      <div id="date"></div>
    </section>

    <section class="panel">
      <h2>GitHub</h2>
      <a class="github-link" href="https://github.com/theo-armour/sandbox" target="_blank"
        rel="noopener">github.com/theo-armour/sandbox</a>
    </section>

    <section class="panel">
      <h2>Weather</h2>
      <div>San Francisco</div>
      <div class="weather-temp">58 F</div>
      <div id="weather-info">Clear placeholder data until weather is connected</div>
    </section>

    <section class="panel">
      <h2>Top 3</h2>
      <ol class="focus-list" id="focus-list"></ol>
    </section>

    <section class="panel">
      <h2>Links</h2>
      <ul class="links-list" id="links-list"></ul>
    </section>

    <section class="panel panel-wide">
      <h2>Today</h2>
      <table>
        <thead>
          <tr>
            <th>Time</th>
            <th>Item</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="today-table-body"></tbody>
      </table>
    </section>

    <section class="panel panel-wide">
      <h2>Notes</h2>
      <textarea id="notes" placeholder="Type notes here..."></textarea>
    </section>
  </main>

  <script>

    const LINKS = [
      { label: "GitHub", url: "https://github.com" },
      { label: "Gmail", url: "https://mail.google.com" },
      { label: "Calendar", url: "https://calendar.google.com" },
      { label: "Drive", url: "https://drive.google.com" },
      { label: "ChatGPT", url: "https://chat.openai.com" },
      { label: "Claude", url: "https://claude.ai" },
    ];

    const FOCUS_ITEMS = [
      "Finish dashboard layout",
      "Check the agenda files",
      "Take a walk before dinner",
    ];

    const TODAY_ITEMS = [
      { time: "10:00", item: "Review dashboard notes", status: "Open" },
      { time: "13:30", item: "Tidy quick links", status: "Pending" },
      { time: "16:00", item: "Walk and think", status: "Planned" },
    ];

    const clockEl = document.getElementById( "clock" );
    const dateEl = document.getElementById( "date" );
    const focusListEl = document.getElementById( "focus-list" );
    const linksEl = document.getElementById( "links-list" );
    const todayTableBodyEl = document.getElementById( "today-table-body" );
    const notesEl = document.getElementById( "notes" );

    // Clock
    const updateClock = () => {
      const now = new Date();
      clockEl.textContent = now.toLocaleTimeString( "en-US", {
        hour: "2-digit",
        minute: "2-digit",
        hour12: false,
      } );
      dateEl.textContent = now.toLocaleDateString( "en-US", {
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric",
      } );
    };

    updateClock();
    setInterval( updateClock, 60000 );

    focusListEl.innerHTML = FOCUS_ITEMS.map(
      ( item ) => `<li>${ item }</li>`
    ).join( "" );

    // Links
    linksEl.innerHTML = LINKS.map(
      ( link ) => `<li><a href="${ link.url }" target="_blank" rel="noopener">${ link.label }</a></li>`
    ).join( "" );

    todayTableBodyEl.innerHTML = TODAY_ITEMS.map(
      ( entry ) => `
        <tr>
          <td>${ entry.time }</td>
          <td>${ entry.item }</td>
          <td><span class="status-pill">${ entry.status }</span></td>
        </tr>`
    ).join( "" );

    // Notes with localStorage persistence
    const savedNotes = localStorage.getItem( "dashboard-notes" );
    if ( savedNotes !== null ) notesEl.value = savedNotes;

    notesEl.addEventListener( "input", () => {
      localStorage.setItem( "dashboard-notes", notesEl.value );
    } );

  </script>

</body>

</html>
