<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="widget-base.css">
  <style>
    /* Gemini Widget Specific Styling */
    body {
      padding: 0.8rem;
      gap: 0.4rem;
      position: relative;
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      flex-shrink: 0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .header-left h2 {
      font-size: clamp(0.78rem, 2vw, 0.88rem);
      margin-bottom: 0;
    }

    .mode-indicators {
      display: flex;
      gap: 0.4rem;
      background: var(--btn-bg);
      padding: 0.2rem;
      border-radius: 0.4rem;
    }

    .mode-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 600;
      padding: 0.2rem 0.5rem;
      border-radius: 0.3rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .mode-btn.active {
      background: var(--bg);
      color: var(--fg);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
    }

    .settings-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.95rem;
      padding: 0.1rem 0.3rem;
      transition: color 0.2s, transform 0.2s;
    }

    .settings-btn:hover {
      color: var(--fg);
      transform: rotate(30deg);
    }

    /* Content Area toggled by tabs */
    .content-area {
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      min-height: 0;
      position: relative;
    }

    /* --- CHAT VIEW STYLE --- */
    .panel-chat {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
    }

    .chat-history {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      padding: 0.4rem 0;
      min-height: 0;
    }

    .chat-history::-webkit-scrollbar {
      width: 4px;
    }

    .chat-history::-webkit-scrollbar-thumb {
      background: var(--btn-bg);
      border-radius: 10px;
    }

    .chat-bubble {
      max-width: 85%;
      padding: 0.5rem 0.7rem;
      border-radius: 0.6rem;
      font-size: 0.88rem;
      line-height: 1.4;
      word-break: break-word;
      animation: bubbleFade 0.25s ease-out;
    }

    .chat-bubble.user {
      align-self: flex-end;
      background: var(--btn-bg);
      color: var(--fg);
      border-bottom-right-radius: 0.1rem;
    }

    .chat-bubble.model {
      align-self: flex-start;
      background: rgba(10, 127, 90, 0.12);
      color: var(--fg);
      border-bottom-left-radius: 0.1rem;
    }

    @media (prefers-color-scheme: dark) {
      .chat-bubble.model {
        background: rgba(86, 214, 169, 0.15);
      }
    }

    .chat-bubble p {
      margin-bottom: 0.4rem;
    }

    .chat-bubble p:last-child {
      margin-bottom: 0;
    }

    .chat-bubble code {
      font-family: monospace;
      background: rgba(0, 0, 0, 0.08);
      padding: 0.1rem 0.25rem;
      border-radius: 0.2rem;
      font-size: 0.8rem;
    }

    @media (prefers-color-scheme: dark) {
      .chat-bubble code {
        background: rgba(255, 255, 255, 0.08);
      }
    }

    .chat-input-wrapper {
      display: flex;
      gap: 0.4rem;
      padding-top: 0.4rem;
      border-top: 1px solid var(--panel-border);
      flex-shrink: 0;
    }

    .chat-input-wrapper input {
      flex: 1;
      background: var(--btn-bg);
      border: 1px solid var(--panel-border);
      color: var(--fg);
      padding: 0.45rem 0.7rem;
      border-radius: 0.4rem;
      font-size: 0.88rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .chat-input-wrapper input:focus {
      border-color: var(--muted);
    }

    .chat-input-wrapper button {
      background: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: 0.4rem;
      width: 38px;
      height: 36px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.2s;
    }

    .chat-input-wrapper button:hover {
      opacity: 0.9;
    }

    /* --- VOICE VIEW STYLE --- */
    .panel-voice {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 0.8rem;
    }

    .visualizer-container {
      width: 130px;
      height: 130px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Glowing Voice Visualizer Orb */
    .orb {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--accent) 0%, rgba(86, 214, 169, 0.3) 100%);
      box-shadow: 0 0 20px rgba(86, 214, 169, 0.4);
      transition: all 0.3s ease;
      position: relative;
      z-index: 2;
    }

    .orb-wave {
      position: absolute;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: 2px solid var(--accent);
      opacity: 0.3;
      z-index: 1;
      animation: ripple 2s infinite linear;
    }

    .orb-wave:nth-child(2) {
      animation-delay: 0.6s;
    }

    .orb-wave:nth-child(3) {
      animation-delay: 1.2s;
    }

    /* Orb active states */
    .orb.listening {
      background: radial-gradient(circle, #0a7f5a 0%, rgba(10, 127, 90, 0.4) 100%);
      box-shadow: 0 0 25px rgba(10, 127, 90, 0.6);
      transform: scale(1.05);
    }

    .orb.speaking {
      background: radial-gradient(circle, #c53b32 0%, rgba(197, 59, 50, 0.4) 100%);
      box-shadow: 0 0 35px rgba(197, 59, 50, 0.8);
      transform: scale(1.15);
      animation: morphSpeak 0.5s infinite alternate ease-in-out;
    }

    @keyframes ripple {
      from { transform: scale(1); opacity: 0.6; }
      to { transform: scale(2.2); opacity: 0; }
    }

    @keyframes morphSpeak {
      0% { border-radius: 46% 54% 50% 50% / 46% 45% 55% 54%; }
      100% { border-radius: 54% 46% 53% 47% / 54% 56% 44% 46%; }
    }

    .voice-status {
      font-size: 0.8rem;
      color: var(--muted);
      font-weight: 600;
      text-align: center;
      min-height: 18px;
    }

    .voice-controls {
      display: flex;
      gap: 0.6rem;
    }

    .voice-btn {
      background: var(--btn-bg);
      color: var(--fg);
      border: none;
      border-radius: 0.4rem;
      padding: 0.45rem 1rem;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: background 0.2s, transform 0.1s;
    }

    .voice-btn:hover {
      background: var(--btn-hover);
    }

    .voice-btn:active {
      transform: scale(0.97);
    }

    .voice-btn.active {
      background: #c53b32;
      color: #ffffff;
    }

    /* --- SETTINGS SCREEN PANEL --- */
    .panel-settings {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      z-index: 10;
      display: none;
      flex-direction: column;
      justify-content: center;
      gap: 0.8rem;
      animation: modalFade 0.2s ease-out;
    }

    .settings-title {
      font-size: 0.85rem;
      color: var(--fg);
      font-weight: 700;
      text-align: center;
    }

    .settings-desc {
      font-size: 0.72rem;
      color: var(--muted);
      text-align: center;
      line-height: 1.4;
      padding: 0 0.5rem;
    }

    .settings-input-wrapper {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      padding: 0 1rem;
    }

    .settings-input-wrapper input {
      background: var(--btn-bg);
      border: 1px solid var(--panel-border);
      color: var(--fg);
      padding: 0.5rem;
      border-radius: 0.3rem;
      font-size: 0.82rem;
      outline: none;
      text-align: center;
    }

    .settings-actions {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      padding: 0 1rem;
    }

    .settings-actions button {
      background: var(--btn-bg);
      color: var(--fg);
      border: none;
      border-radius: 0.3rem;
      padding: 0.4rem 0.8rem;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .settings-actions button.btn-save {
      background: var(--accent);
      color: #ffffff;
    }

    .settings-actions button:hover {
      opacity: 0.9;
    }

    @keyframes bubbleFade {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes modalFade {
      from { opacity: 0; transform: scale(0.97); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>

<body>
  <!-- HEADER -->
  <div class="header-row">
    <div class="header-left">
      <h2>Gemini AI</h2>
      <!-- Mode toggles -->
      <div class="mode-indicators">
        <button class="mode-btn active" id="tab-chat">Chat</button>
        <button class="mode-btn" id="tab-voice">Live Voice</button>
      </div>
    </div>
    <button class="settings-btn" id="btn-settings" title="API Settings">⚙️</button>
  </div>

  <!-- MAIN WIDGET BODY AREA -->
  <div class="content-area">
    
    <!-- CHAT CONSOLE PANEL -->
    <div class="panel-chat" id="panel-chat">
      <div class="chat-history" id="chat-history">
        <div class="chat-bubble model">
          <p>Hello! I am your Gemini assistant. Paste your API Key in the settings gear to get started.</p>
        </div>
      </div>
      <div class="chat-input-wrapper">
        <input type="text" id="chat-input" placeholder="Ask Gemini..." autocomplete="off">
        <button id="chat-send" title="Send message">➜</button>
      </div>
    </div>

    <!-- VOICE CONVERSATION PANEL -->
    <div class="panel-voice" id="panel-voice">
      <div class="visualizer-container">
        <div class="orb-wave"></div>
        <div class="orb-wave"></div>
        <div class="orb-wave"></div>
        <div class="orb" id="visualizer-orb"></div>
      </div>
      <div class="voice-status" id="voice-status">Voice connection offline</div>
      <div class="voice-controls">
        <button class="voice-btn" id="btn-voice-toggle">🎙️ Start Voice</button>
      </div>
    </div>

    <!-- SETTINGS PANEL OVERLAY -->
    <div class="panel-settings" id="panel-settings">
      <div class="settings-title">API Settings</div>
      <div class="settings-desc">
        Enter your Google Gemini API Key. Your key is stored securely in local browser storage and never shared.
      </div>
      <div class="settings-input-wrapper">
        <input type="password" id="api-key-input" placeholder="AIzaSy...">
      </div>
      <div class="settings-actions">
        <button id="settings-cancel">Cancel</button>
        <button class="btn-save" id="settings-save">Save Key</button>
      </div>
    </div>

  </div>

  <script>
    // Local storage key scoping
    const API_KEY_STORAGE = "dashboard-widget-gemini-key";
    
    // UI Elements
    const tabChat = document.getElementById("tab-chat");
    const tabVoice = document.getElementById("tab-voice");
    const panelChat = document.getElementById("panel-chat");
    const panelVoice = document.getElementById("panel-voice");
    const panelSettings = document.getElementById("panel-settings");
    const btnSettings = document.getElementById("btn-settings");
    const apiKeyInput = document.getElementById("api-key-input");
    const settingsSave = document.getElementById("settings-save");
    const settingsCancel = document.getElementById("settings-cancel");

    // Chat elements
    const chatHistory = document.getElementById("chat-history");
    const chatInput = document.getElementById("chat-input");
    const chatSend = document.getElementById("chat-send");

    // Voice elements
    const visualizerOrb = document.getElementById("visualizer-orb");
    const voiceStatus = document.getElementById("voice-status");
    const btnVoiceToggle = document.getElementById("btn-voice-toggle");

    // State Variables
    let geminiApiKey = localStorage.getItem(API_KEY_STORAGE) || "";
    let isVoiceActive = false;
    let wsConnection = null;
    let audioCtx = null;
    let micStream = null;
    let processorNode = null;
    let nextPlayTime = 0;
    const SAMPLE_RATE = 16000;

    // --- Tab Switching ---
    tabChat.addEventListener("click", () => {
      tabChat.classList.add("active");
      tabVoice.classList.remove("active");
      panelChat.style.display = "flex";
      panelVoice.style.display = "none";
      stopVoiceSession();
    });

    tabVoice.addEventListener("click", () => {
      tabVoice.classList.add("active");
      tabChat.classList.remove("active");
      panelChat.style.display = "none";
      panelVoice.style.display = "flex";
    });

    // --- Settings Panel ---
    btnSettings.addEventListener("click", () => {
      apiKeyInput.value = geminiApiKey;
      panelSettings.style.display = "flex";
    });

    settingsCancel.addEventListener("click", () => {
      panelSettings.style.display = "none";
    });

    settingsSave.addEventListener("click", () => {
      const key = apiKeyInput.value.trim();
      geminiApiKey = key;
      localStorage.setItem(API_KEY_STORAGE, key);
      panelSettings.style.display = "none";
      
      // Update first greeting if key exists
      if (key) {
        appendChatBubble("model", "<p>API Key saved successfully. Ask me anything or toggle to Live Voice!</p>");
      }
    });

    // --- Markdown Parser Fallback ---
    function parseMarkdown(text) {
      // Escape HTML
      let clean = text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
      
      // Code tags
      clean = clean.replace(/`([^`]+)`/g, "<code>$1</code>");
      // Bold text
      clean = clean.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      
      // Convert single line breaks to <p>
      return clean.split("\n\n").map(para => `<p>${para.replace(/\n/g, "<br>")}</p>`).join("");
    }

    function appendChatBubble(role, htmlContent) {
      const bubble = document.createElement("div");
      bubble.className = `chat-bubble ${role}`;
      bubble.innerHTML = htmlContent;
      chatHistory.appendChild(bubble);
      chatHistory.scrollTop = chatHistory.scrollHeight;
    }

    // --- Text Chat API Integration ---
    async function sendMessageToGemini() {
      const prompt = chatInput.value.trim();
      if (!prompt) return;

      if (!geminiApiKey) {
        appendChatBubble("model", "<p>Error: Please enter your Gemini API Key in the settings gear at the top right to start.</p>");
        return;
      }

      appendChatBubble("user", parseMarkdown(prompt));
      chatInput.value = "";

      // Loading bubble placeholder
      const loadingBubble = document.createElement("div");
      loadingBubble.className = "chat-bubble model";
      loadingBubble.innerHTML = "<p>Thinking...</p>";
      chatHistory.appendChild(loadingBubble);
      chatHistory.scrollTop = chatHistory.scrollHeight;

      try {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${geminiApiKey}`;
        const response = await fetch(url, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }],
            generationConfig: {
              maxOutputTokens: 800,
              temperature: 0.6
            }
          })
        });

        chatHistory.removeChild(loadingBubble);

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();
        const modelReply = data.candidates?.[0]?.content?.parts?.[0]?.text || "No reply generated.";
        appendChatBubble("model", parseMarkdown(modelReply));

      } catch (err) {
        chatHistory.removeChild(loadingBubble);
        appendChatBubble("model", `<p style="color: #c53b32;">Error calling Gemini API: ${err.message}. Ensure your API Key is correct.</p>`);
      }
    }

    chatSend.addEventListener("click", sendMessageToGemini);
    chatInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendMessageToGemini();
    });

    // --- Gemini Multimodal Live Voice (WebSocket) Logic ---

    function initAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: SAMPLE_RATE });
      }
      if (audioCtx.state === "suspended") {
        audioCtx.resume();
      }
    }

    async function startVoiceSession() {
      if (!geminiApiKey) {
        voiceStatus.textContent = "Please enter API Key in settings first";
        return;
      }

      voiceStatus.textContent = "Connecting to Gemini Live...";
      btnVoiceToggle.textContent = "Connecting...";
      btnVoiceToggle.disabled = true;

      try {
        initAudioContext();
        
        // Open bidirectional WebSocket stream using the v1beta API version (where gemini-2.0-flash-exp is supported)
        const url = `wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key=${geminiApiKey}`;
        wsConnection = new WebSocket(url);

        wsConnection.onopen = () => {
          voiceStatus.textContent = "WebSocket Connected. Initiating stream...";
          
          // Send mandatory Setup configuration first
          const setupMsg = {
            setup: {
              model: "models/gemini-2.0-flash-exp",
              generationConfig: {
                responseModalities: ["AUDIO"],
                speechConfig: {
                  voiceConfig: {
                    prebuiltVoiceConfig: {
                      voiceName: "Aoede" // Warm, pleasing conversational voice
                    }
                  }
                }
              }
            }
          };
          wsConnection.send(JSON.stringify(setupMsg));
          
          // Start capturing mic audio
          startMicrophoneCapture();
        };

        wsConnection.onmessage = async (event) => {
          const data = JSON.parse(event.data);
          
          // Handle incoming speech chunks from Gemini
          if (data.serverContent?.modelTurn?.parts) {
            for (const part of data.serverContent.modelTurn.parts) {
              if (part.inlineData && part.inlineData.data) {
                playPcmChunk(part.inlineData.data);
              }
            }
          }

          // Handle server state visual indicators
          if (data.serverContent?.turnComplete) {
            visualizerOrb.className = "orb listening";
            voiceStatus.textContent = "Gemini finished speaking. Listening...";
          }
        };

        wsConnection.onclose = (e) => {
          console.log("WebSocket closed", e);
          let reason = "Voice session ended";
          if (e.code === 4000) {
            reason = "API Key error: Check key in settings";
          } else if (e.reason) {
            reason = `Connection closed: ${e.reason}`;
          } else if (!navigator.onLine) {
            reason = "Internet connection offline";
          }
          stopVoiceSession(reason);
        };

        wsConnection.onerror = (err) => {
          console.error("WebSocket error", err);
          stopVoiceSession("Connection error: check API Key or Model access");
        };

      } catch (err) {
        console.error("Error starting session", err);
        stopVoiceSession(`Error: ${err.message}`);
      }
    }

    async function startMicrophoneCapture() {
      try {
        micStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            channelCount: 1,
            sampleRate: SAMPLE_RATE,
            echoCancellation: true,
            noiseSuppression: true
          }
        });

        const source = audioCtx.createMediaStreamSource(micStream);
        
        // Grab audio buffers (mono, 16kHz) and downsample/stream
        processorNode = audioCtx.createScriptProcessor(2048, 1, 1);
        
        processorNode.onaudioprocess = (e) => {
          if (!wsConnection || wsConnection.readyState !== WebSocket.OPEN) return;

          const inputData = e.inputBuffer.getChannelData(0);
          
          // Convert float32 to PCM 16-bit
          const pcmData = new Int16Array(inputData.length);
          for (let i = 0; i < inputData.length; i++) {
            const s = Math.max(-1, Math.min(1, inputData[i]));
            pcmData[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
          }
          
          // Convert Int16Array to Base64
          const base64Data = arrayBufferToBase64(pcmData.buffer);

          // Send to Gemini realtime stream
          const chunkMsg = {
            realtimeInput: {
              mediaChunks: [{
                mimeType: `audio/pcm;rate=${SAMPLE_RATE}`,
                data: base64Data
              }]
            }
          };
          wsConnection.send(JSON.stringify(chunkMsg));
        };

        source.connect(processorNode);
        processorNode.connect(audioCtx.destination);

        // UI active states
        isVoiceActive = true;
        btnVoiceToggle.textContent = "🔴 End Conversation";
        btnVoiceToggle.classList.add("active");
        btnVoiceToggle.disabled = false;
        visualizerOrb.className = "orb listening";
        voiceStatus.textContent = "Gemini Live is active. Speak now!";
        nextPlayTime = audioCtx.currentTime;

      } catch (err) {
        console.error("Failed to capture mic", err);
        let errorMsg = "Microphone access blocked/denied.";
        if (location.protocol === "file:") {
          errorMsg = "Mic blocked on file://: load via server instead!";
        } else if (err.name === "NotAllowedError") {
          errorMsg = "Mic access blocked by user/browser settings.";
        }
        stopVoiceSession(errorMsg);
      }
    }

    // Play base64 audio chunks back in continuous stream
    function playPcmChunk(base64Data) {
      if (!audioCtx) return;

      visualizerOrb.className = "orb speaking";
      voiceStatus.textContent = "Gemini is speaking...";

      // Decode base64 to binary ArrayBuffer
      const rawBinary = atob(base64Data);
      const len = rawBinary.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) {
        bytes[i] = rawBinary.charCodeAt(i);
      }
      
      // Parse Int16 array PCM
      const int16Array = new Int16Array(bytes.buffer);
      const float32Array = new Float32Array(int16Array.length);
      
      // Normalize back to float32
      for (let i = 0; i < int16Array.length; i++) {
        float32Array[i] = int16Array[i] / 32768.0;
      }

      // Schedule play in queue context to prevent stutters
      const buffer = audioCtx.createBuffer(1, float32Array.length, SAMPLE_RATE);
      buffer.copyToChannel(float32Array, 0);

      const source = audioCtx.createBufferSource();
      source.buffer = buffer;
      source.connect(audioCtx.destination);

      // Precised continuous timing alignment
      const scheduledTime = Math.max(nextPlayTime, audioCtx.currentTime);
      source.start(scheduledTime);
      nextPlayTime = scheduledTime + buffer.duration;
    }

    function stopVoiceSession(errorMessage = "") {
      // Clean script processor nodes
      if (processorNode) {
        processorNode.disconnect();
        processorNode = null;
      }

      // Stop mic streams
      if (micStream) {
        micStream.getTracks().forEach(track => track.stop());
        micStream = null;
      }

      // Stop WebSockets
      if (wsConnection) {
        try { wsConnection.close(); } catch(e) {}
        wsConnection = null;
      }

      // Reset states
      isVoiceActive = false;
      btnVoiceToggle.textContent = "🎙️ Start Voice";
      btnVoiceToggle.classList.remove("active");
      btnVoiceToggle.disabled = false;
      visualizerOrb.className = "orb";
      voiceStatus.textContent = errorMessage || "Voice connection offline";
    }

    btnVoiceToggle.addEventListener("click", () => {
      if (isVoiceActive) {
        stopVoiceSession();
      } else {
        startVoiceSession();
      }
    });

    // Helper: base64 converter
    function arrayBufferToBase64(buffer) {
      let binary = '';
      const bytes = new Uint8Array(buffer);
      const len = bytes.byteLength;
      for (let i = 0; i < len; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      return window.btoa(binary);
    }
  </script>
