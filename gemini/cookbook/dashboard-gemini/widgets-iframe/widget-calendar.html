<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="widget-base.css">
  <style>
    #cal {
      flex: 1;
      min-height: 0;
      width: 100%;
      border: 0;
      border-radius: 4px;
      background: #ffffff;
      transition: filter 0.3s ease;
    }

    @media (prefers-color-scheme: dark) {
      #cal {
        filter: invert(0.92) hue-rotate(180deg);
        background: #1c1c1e;
      }
    }
  </style>
</head>
